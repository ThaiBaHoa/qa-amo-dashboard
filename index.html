/* METRICS:BEGIN ==============================================================
   METRICS — the ONE place where report scope, the period rule, status groups and every
   indicator are defined. Every screen (Overview, Work Queue, Findings, Analytics, Audit
   Plan, exports, detail views) calls these; none compares a status string or computes a
   rate on its own. Change a definition here and every screen follows.
     · build.mjs refuses to build when UI code outside this block compares a report status
       or computes a rate itself (lint "metrics-only").
     · M.consistency() recomputes each indicator through every screen's path and against the
       classic formulas after every data load; any difference is shown to admins.
   Definitions (classic.html):
     scope qa     = allData (QA AMO + sub-units). TQA CMR-CAR / ECAR only on their own tabs.
     period       = calendar day of raised_date by classic dDay (4085), Year × Month filter.
     open         = not closed = Open + Overdue (classic Open Reports, renderOpen 4995).
     inTarget     = status Open only (classic KPI charts tile kk-open, 4760).
     overdue      = status Overdue; CAT from overdue_cat (catCalc 4124).
     on-time rate = On-time Closed ÷ (On-time Closed + Lately Closed) (User Guide 1627, 4767).
     closure time = mean days raised → close, closed reports with both dates.
     KPI 2 volume = MCAR count ÷ AMO-ECAR count (buildKPI2 5257–5259).
     KPI 7        = kpi7Stats (6191) with the same period rule; % withheld while pending.
     audits       = MNT scope; year = scheduled year, month = scheduled start month;
                    open = InProgress / Performed / Scheduled (renderAuditKpi 7676).
   ========================================================================== */
const M = {
  CLOSED: new Set(['On-time Closed', 'Lately Closed', 'Closed']),
  st: x => x.status !== undefined ? x.status : x.semantic_status,
  isClosed: x => M.CLOSED.has(M.st(x)),
  isOpen: x => !M.isClosed(x),
  isInTarget: x => M.st(x) === 'Open',
  isOverdue: x => M.st(x) === 'Overdue',
  isOnTime: x => M.st(x) === 'On-time Closed',
  isLate: x => M.st(x) === 'Lately Closed',
  isUngraded: x => M.st(x) === 'Closed',
  hasStatus: (x, s) => M.st(x) === s,
  catOf: x => x.cat !== undefined ? x.cat : ({ 'CAT I':'I', 'CAT II':'II', 'CAT III':'III' }[x.overdue_cat] || null),

  /* scope */
  qa: rows => REAL ? rows.filter(r => r.form !== 'cmrcar' && r.form !== 'ecar') : rows,

  /* period: one rule for every screen */
  dayOf(v){
    if(!v) return null;
    if(v instanceof Date) return v;
    const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return new Date(+m[1], +m[2]-1, +m[3]);
    const d = new Date(v); if(isNaN(d)) return null;
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  },
  inPeriodDay(d, f){
    f = f || state.filters;
    if(!f.years.length && !f.months.length) return true;
    if(!d) return false;
    if(f.years.length && !f.years.includes(d.getFullYear())) return false;
    if(f.months.length && !f.months.includes(d.getMonth())) return false;
    return true;
  },
  raisedDay: x => x.raised !== undefined ? x.raised : M.dayOf(x.raised_date),
  inPeriod: (x, f) => M.inPeriodDay(M.raisedDay(x), f),
  period: (rows, f) => rows.filter(x => M.inPeriod(x, f)),

  pct: (a, b) => b ? Math.round(a / b * 1000) / 10 : 0,

  /* the report summary every screen shows */
  summary(rows){
    const n = p => rows.filter(p).length;
    const onTime = n(M.isOnTime), late = n(M.isLate);
    const closedDated = rows.filter(r => r.closed && r.raised);
    const cat = { I:0, II:0, III:0 };
    rows.forEach(r => { if(M.isOverdue(r)){ const c = M.catOf(r); if(c) cat[c]++; } });
    return {
      total: rows.length, open: n(M.isOpen), inTarget: n(M.isInTarget), overdue: n(M.isOverdue),
      onTime, late, ungraded: n(M.isUngraded), graded: onTime + late, onTimeRate: M.pct(onTime, onTime + late),
      avgCloseDays: closedDated.length ? Math.round(closedDated.reduce((t, r) => t + dayDiff(r.closed, r.raised), 0) / closedDated.length) : 0,
      closedDated: closedDated.length, cat, repetitive: n(r => r.repetitive),
      audits: new Set(rows.map(r => r.auditId).filter(Boolean)).size
    };
  },
  /* reports closed inside a window — the monthly trend of rate and closure time */
  closedIn: (rows, from, to) => rows.filter(r => r.closed && r.closed >= from && r.closed <= to),

  /* corrective actions (r169) — the requirements an F-088 / investigation report places on other
     departments, tracked like findings (anh Ngọc 24/09/2026). Each CA carries the classic semCalc
     status (loadEisDetail): On-time Closed / Lately Closed by Date completed vs Target date,
     Open / Overdue while not completed, Closed (ungraded) when the report closed with no date. */
  caSummary(cas){
    const n = p => cas.filter(p).length;
    const onTime = n(M.isOnTime), late = n(M.isLate);
    return { total: cas.length, closed: n(M.isClosed), onTime, late, ungraded: n(M.isUngraded),
             open: n(M.isOpen), inTarget: n(M.isInTarget), overdue: n(M.isOverdue), onTimeRate: M.pct(onTime, onTime + late) };
  },
  /* reports that carry corrective actions, in the period, with their CAs (API().eis().ca) */
  caReports(f){
    const A = API(), map = A.eis().ca || {};
    return A.allData().filter(r => map[r.report_id] && M.inPeriod(r, f)).map(r => ({ r, cas: map[r.report_id] }));
  },

  /* closure health by quarter (r170, anh Ngọc 24/09/2026: a quarter must show how many reports
     ever passed their target even when all are closed). Quarter of raised_date, the selected
     years (month filter ignored — a quarter is its own period). everLate = late closed + overdue. */
  byQuarter(rows, f){
    f = f || state.filters;
    const base = M.period(rows, { years: f.years, months: [] }), by = {};
    base.forEach(r => { const d = M.raisedDay(r); if(!d) return;
      const k = d.getFullYear() + ' Q' + (Math.floor(d.getMonth() / 3) + 1); (by[k] ||= []).push(r); });
    return Object.keys(by).sort().reverse().map(k => { const s = M.summary(by[k]); return { q: k, s, everLate: s.late + s.overdue }; });
  },

  kpi2: rows => { const mcar = rows.filter(r => r.form === 'mcar').length, amo = rows.filter(r => r.form === 'amoecar').length;
                  return { mcar, amo, pct: M.pct(mcar, amo) }; },

  /* KPI 7 = the classic function itself, fed the same period rule */
  kpi7(f){
    const st = API().kpi7Stats(r => M.inPeriodDay(M.dayOf(r.raised_date), f));
    const t = st.tot;
    return { stats: st, total: t.total, assessed: t.assessed, notAssessed: t.notAssessed, pending: t.pending, withdrawn: t.withdrawn,
             rate: (t.total && !t.pending) ? M.pct(t.assessed, t.total) : null };
  },
  kpi7In(pass){ const t = API().kpi7Stats(pass).tot; return (t.total && !t.pending) ? M.pct(t.assessed, t.total) : 0; },

  /* audits (MNT) — same period rule shape for both raw auditData and the mapped AUDITS */
  auditYear: a => a.year !== undefined ? a.year : +a.sched_year,
  auditMonth: a => a.start !== undefined ? a.start : Number(String(a.scheduled_start_date).slice(5,7)) - 1,
  auditInPeriod(a, f){
    f = f || state.filters;
    return (!f.years.length || f.years.includes(M.auditYear(a))) && (!f.months.length || f.months.includes(M.auditMonth(a)));
  },
  AUDIT_OPEN: new Set(['InProgress', 'In Progress', 'Performed', 'Scheduled']),
  auditSummary(list){
    const closed = list.filter(a => a.status === 'Closed').length, open = list.filter(a => M.AUDIT_OPEN.has(a.status)).length;
    return { total: list.length, closed, open, inProgress: list.filter(a => a.status === 'InProgress' || a.status === 'In Progress').length,
             scheduled: list.filter(a => a.status === 'Scheduled').length, rate: list.length ? Math.round(closed / list.length * 100) : 0 };
  },

/* ---- derived report facts ---- */
function semantic(r){
  if(r.closed) return r.closed <= r.target ? 'On-time Closed' : 'Lately Closed';
  if(TODAY > r.target) return 'Overdue';
  return r.progress ? 'In Progress' : 'Open';
}
function daysToDue(r){ return dayDiff(r.target, TODAY); }
function catOf(r){
  if(semantic(r) !== 'Overdue') return null;
  const d = -daysToDue(r);
  return d <= 30 ? 'I' : d <= 60 ? 'II' : 'III';
}
/* Real records carry isClosed from the live status: a Closed report may have no close date. */
function isOpen(r){ return M.isOpen(r); }   /* definition lives in METRICS */
function assessed(r){ return r.rounds.length > 0; }
/* First verification date. Real data: the live kpi7Ver (earliest Date verified); a round
   can exist without a date, which is null here and must not be graded. */
function firstVerDate(r){ return r.firstVerified !== undefined ? r.firstVerified : (r.rounds[0] ? r.rounds[0].date : null); }
function verifiedIn30(r){
  const f = firstVerDate(r);
  if(!r.rounds.length || !f || !r.raised) return false;
  return dayDiff(f, r.raised) <= 30;
}
if(!REAL) REPORTS.forEach(r=>{ r.status = semantic(r); r.cat = catOf(r); r.dtd = daysToDue(r); });

/* ---- audit programme ---- */
function buildAudits(){
  return AUDIT_TITLES.map((a,i)=>{
    const start = i < 15 ? Math.min(11, Math.floor(i*0.78)) : ri(8,11);
    const span  = weighted([[1,64],[2,28],[3,8]]);
    const end   = Math.min(11, start + span - 1);
    let status;
    if(end < 8) status = weighted([['Closed',72],['Performed',28]]);
    else if(start <= 8 && end >= 8) status = weighted([['In Progress',66],['Performed',34]]);
    else status = 'Scheduled';
    const findings = status === 'Scheduled' ? 0 : ri(0, 11);
    const open     = status === 'Closed' ? 0 : Math.min(findings, ri(0, 5));   /* metrics-ok: mock prototype audits (never used with live data) */
    const overdue  = Math.min(open, rnd() < 0.34 ? ri(1,2) : 0);
    return {
      id:'aud-'+i,
      number:'QA-AMO-26-'+String(i*3+7).padStart(3,'0'),
      title:a[0], location:a[1],
      type: /inspection/i.test(a[0]) ? 'Inspection' : 'Audit',
      status, start, end, findings, open, overdue,
      lead: pick(PEOPLE).n
    };
  });
}

/* Audit Plan follows the shared Year × Month filter: year = scheduled year, month = scheduled
   start month (Galileo has no planned end date, so a bar is one month). Mock audits carry no year. */

/* ---- 12-month series, computed from the register (never invented) ---- */
function monthsBack(n){
  const out = [];
  for(let i=n-1;i>=0;i--){
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth()-i, 1);
    out.push({ y:d.getFullYear(), m:d.getMonth(), label:MONTHS[d.getMonth()], end:new Date(d.getFullYear(), d.getMonth()+1, 0, 23, 59) });
  }
  return out;
}
const SERIES_MONTHS = monthsBack(12);
function seriesFor(rows){
  const raised = [], closed = [], open = [], overdue = [];
  SERIES_MONTHS.forEach(mo=>{
    const start = new Date(mo.y, mo.m, 1);
    raised.push(rows.filter(r=> r.raised >= start && r.raised <= mo.end).length);
    closed.push(rows.filter(r=> r.closed && r.closed >= start && r.closed <= mo.end).length);
    const live = rows.filter(r=> r.raised && r.raised <= mo.end && (r.closed ? r.closed > mo.end : isOpen(r)));
    open.push(live.length);
    overdue.push(live.filter(r=> r.target && r.target < mo.end).length);
  });
  return { raised, closed, open, overdue };
}

const SCLASS = {'Open':'s-open','In Progress':'s-progress','On-time Closed':'s-ontime','Lately Closed':'s-late','Overdue':'s-overdue','Closed':'s-ontime'};

};
function mark(s){
  return '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(MARK[s]||'')+'</svg>';

function catChip(c){ return c ? '<span class="cat c'+({'I':1,'II':2,'III':3}[c])+'">CAT '+c+'</span>' : '<span class="dim">—</span>'; }
function dueCell(r){

/* ---- hand-drawn charts: sparkline, line pair, donut, stacked bar ---- */
function spark(vals, hot){
  if(!vals.length) return '';
  const w = 120, h = 30, min = Math.min(...vals), max = Math.max(...vals), rng = (max-min) || 1;
  const pts = vals.map((v,i)=>[ (i/(vals.length-1))*w, h - ((v-min)/rng)*(h-6) - 3 ]);
  const line = 'M' + pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');
  const area = line + ' L '+w+' '+h+' L 0 '+h+' Z';
  const col  = hot ? 'var(--accent)' : 'var(--text-2)';
  const last = pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="12-month trend">'
    + '<path d="'+area+'" fill="'+col+'" opacity=".13"/>'
    + '<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
    + '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.4" fill="'+col+'"/></svg>';
}
function trendTag(now, prev, goodDir, unit){
  if(prev === null || prev === undefined) return '';
  const d = now - prev;
  if(Math.abs(d) < 0.5) return '<span class="trend flat">'+ic('more',13)+' no change</span>';
  const up  = d > 0;
  const good = goodDir === 'up' ? up : !up;
  const val = (up?'+':'−') + Math.abs(Math.round(d*10)/10) + (unit||'');
  return '<span class="trend '+(good?'good':'bad')+'">'+ic(up?'arrowUp':'arrowDown',13)+val+'</span>';
}
function linePair(a, b, labels){
  const W = 640, H = 210, L = 34, R = 10, T = 14, B = 30;
  const max = Math.max(4, ...a, ...b), iw = W-L-R, ih = H-T-B;
  const x = i => L + (i/(labels.length-1))*iw;
  const y = v => T + ih - (v/max)*ih;
  const path = arr => 'M' + arr.map((v,i)=>x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' L ');
  let grid = '', ticks = '';
  for(let g=0; g<=3; g++){
    const gv = Math.round(max*g/3), gy = y(gv);
    grid  += '<line x1="'+L+'" y1="'+gy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+gy.toFixed(1)+'" stroke="var(--hairline)" stroke-width="1"/>';
    ticks += '<text x="'+(L-8)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end" font-size="11" font-family="ui-monospace,monospace" fill="var(--text-3)">'+gv+'</text>';
  }
  const xlab = labels.map((l,i)=> '<text x="'+x(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--text-3)">'+l+'</text>').join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Findings raised versus closed over the last twelve months">'
    + grid + ticks + xlab
    + '<path d="'+path(b)+'" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/>'
    + '<path d="'+path(a)+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'
    + a.map((v,i)=>'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="2.6" fill="var(--accent)"/>').join('')
    + '</svg>';
}
function donut(parts){
  const total = parts.reduce((s,p)=>s+p.v,0) || 1;
  const R = 54, C = 2*Math.PI*R;
  let off = 0;
  const segs = parts.map(p=>{
    const len = (p.v/total)*C;
    const s = '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+p.c+'" stroke-width="18" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 70 70)"/>';
    off += len; return s;
  }).join('');
  return '<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Status mix"><circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--hairline)" stroke-width="18"/>'+segs
    + '<text x="70" y="66" text-anchor="middle" font-size="26" font-weight="700" font-family="ui-monospace,monospace" fill="var(--text)">'+total+'</text>'
    + '<text x="70" y="86" text-anchor="middle" font-size="11" letter-spacing="1.2" fill="var(--text-3)">IN SCOPE</text></svg>';
}

function pct(a,b){ return b ? Math.round(a/b*1000)/10 : 0; }
function kpiTile(o){

    + ' aria-label="'+esc(o.label+': '+o.value+'. '+o.note)+'">'

    + spark(o.series, !!o.alarm) + '</button>';

/* Every number of the Overview, computed only through METRICS (M.consistency checks it). */
function overviewStats(rows){
  const s = M.summary(rows);
  const monthly = fn => SERIES_MONTHS.map(mo => fn(new Date(mo.y, mo.m, 1), mo.end));
  return {
    s,
    series: seriesFor(rows),
    rateSeries: monthly((a, b) => M.summary(M.closedIn(rows, a, b)).onTimeRate),
    closeSeries: monthly((a, b) => M.summary(M.closedIn(rows, a, b)).avgCloseDays),
    k2: M.kpi2(rows),
    k2Series: monthly((a, b) => M.kpi2(rows.filter(r => r.raised && r.raised >= a && r.raised <= b)).pct),
    k7: REAL ? (REAL.partial ? null : M.kpi7()) : null,
    k7Series: REAL && !REAL.partial ? monthly((a, b) => M.kpi7In(r => { const d = M.dayOf(r.raised_date); return d && d >= a && d <= b; })) : []
  };
}

    + '</div></div></div></div></section>'

    + '<section class="sec cols cols-2">'

    + '<div class="card-pad" style="display:grid;gap:12px">'+linePair(s.raised, s.closed, SERIES_MONTHS.map(m=>m.label))
    + '<div class="legend"><span class="legend-i"><span class="swatch" style="background:var(--accent);border-color:var(--accent)"></span>Raised</span>'

const PAGE_SIZE = 12;

const COL = {

  raised:{ l:'Raised', v:r=>r.raised ? r.raised.getTime() : 0, c:r=>'<span class="num dim od-nowrap">'+fmtShort(r.raised)+'</span>' },
  target:{ l:'Target', v:r=>r.target ? r.target.getTime() : 0, c:r=>'<span class="num od-nowrap">'+fmtShort(r.target)+'</span>' },
  dtd:{ l:'Days to due', ar:true, v:r=>r.closed?99999:r.dtd, c:dueCell },

const LANES = {
  'work/open':    { cols:['number','form','status','owner','raised','target','dtd','level'],
                    rows:rs=>rs.filter(isOpen), title:'Open reports', lead:'Open and overdue reports, nearest target date first.' },
  'work/overdue': { cols:['number','form','cat','dtd','owner','dept','target','level'],
                    rows:rs=>rs.filter(M.isOverdue), title:'Overdue', lead:'Reports past their target date. CAT I ≤ 30 days, CAT II 31–60 days, CAT III > 60 days overdue.' },
  'work/verify':  { cols:['number','status','owner','raised','verified','dtd'],
                    rows:rs=>rs.filter(r=>r.form==='pavoi' && isOpen(r) && !assessed(r)),
                    title:'Awaiting verification', lead:'Open PAVOI with no verification round recorded — not yet counted as assessed in KPI 7.' },

  'findings/cmrcar':  { cols:['number','aircraft','status','dept','raised','target','dtd'], rows:rs=>rs.filter(r=>r.form==='cmrcar') },
  'findings/ecar':    { cols:['number','aircraft','status','finding','raised','dtd'], rows:rs=>rs.filter(r=>r.form==='ecar') },
  'findings/amoecar': { cols:['number','status','raised','target','dtd','cat','audit'], rows:rs=>rs.filter(r=>r.form==='amoecar') },

};

function sortRows(rows, key){
  const st = state.sort[key];
  if(!st) return rows.slice().sort((a,b)=>{
    const ao = isOpen(a)?0:1, bo = isOpen(b)?0:1;
    if(ao!==bo) return ao-bo;
    return a.dtd - b.dtd;
  });
  const col = COL[st.k];
  return rows.slice().sort((a,b)=>{
    const av = col.v(a), bv = col.v(b);
    const r = av < bv ? -1 : av > bv ? 1 : 0;
    return st.dir === 'asc' ? r : -r;
  });
}
function tableHTML(key, cfg, rows){
  const st = state.sort[key];
  const head = cfg.cols.map(c=>{
    const col = COL[c], on = st && st.k === c;
    const icName = on ? (st.dir==='asc'?'sortUp':'sortDown') : 'sortNone';
    return '<th scope="col"'+(on?' aria-sort="'+(st.dir==='asc'?'ascending':'descending')+'"':'')+(col.ar?' class="ar"':'')+'>'
      + '<button type="button" data-act="sort" data-key="'+key+'" data-col="'+c+'">'+esc(col.l)+ic(icName,13,'sort-ic')+'</button></th>';
  }).join('');

  const sorted = sortRows(rows, key);
  const pages = Math.max(1, Math.ceil(sorted.length/PAGE_SIZE));
  let p = Math.min(state.page[key]||1, pages);
  const slice = sorted.slice((p-1)*PAGE_SIZE, p*PAGE_SIZE);

  /* a row opens the report itself (detail dialog); PAVOI keeps its list + record screen */
  const body = slice.map(r=>'<tr tabindex="0" '+(REAL && r.form!=='pavoi' ? 'data-act="breport"' : 'data-go="findings" data-tab="'+(r.form==='other'?'all':r.form)+'"')+' data-id="'+r.id+'">'
    + cfg.cols.map(c=>{
        const col = COL[c];
        return '<td data-l="'+esc(col.l)+'"'+(col.main?' class="t-main"':(col.ar?' class="ar"':''))+'>'+col.c(r)+'</td>';
      }).join('') + '</tr>').join('');

  let pager = '';
  if(pages > 1){
    const btns = [];
    btns.push('<button type="button" data-act="page" data-key="'+key+'" data-p="'+(p-1)+'"'+(p===1?' disabled':'')+' aria-label="Previous page">'+ic('chevron',14,'')+'</button>');
    for(let i=1;i<=pages;i++){
      if(pages > 7 && i>2 && i<pages-1 && Math.abs(i-p)>1){ if(i===3) btns.push('<button type="button" disabled>…</button>'); continue; }
      btns.push('<button type="button" data-act="page" data-key="'+key+'" data-p="'+i+'"'+(i===p?' aria-current="true"':'')+'>'+i+'</button>');
    }
    btns.push('<button type="button" data-act="page" data-key="'+key+'" data-p="'+(p+1)+'"'+(p===pages?' disabled':'')+' aria-label="Next page">'+ic('chevron',14,'')+'</button>');
    pager = '<div class="pg">'+btns.join('')+'</div>';
  }

  if(!sorted.length) return emptyState();

  return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>'
    + '<div class="tbl-foot"><span class="t-small dim">Showing '+((p-1)*PAGE_SIZE+1)+'–'+Math.min(p*PAGE_SIZE, sorted.length)+' of '+sorted.length+'</span>'+pager+'</div>';
}
function emptyState(){
  return '<div class="empty">'+ic('search',28,'dim')+'<h3>Nothing matches the current filters</h3>'
    + '<p class="t-sub">The year, month or search term is excluding every record. Widen one of them to see results.</p>'
    + '<button class="btn" type="button" data-act="clearall">Clear all filters</button></div>';
}
function renderLane(screen, tab){
  const key = screen+'/'+tab;
  const cfg = LANES[key];
  const nav = NAV_BY_ID[screen];
  const tabDef = nav.tabs.find(t=>t.id===tab);

  if(screen === 'findings' && tab === 'pavoi') return renderPavoi();
  if(!cfg) return placeholder(nav, tabDef);

  let rows = cfg.rows(screen === 'work' ? qaScope(scoped()) : scoped());
  if(state.cat) rows = rows.filter(r=>r.cat === state.cat);

  const form = FORM_BY_ID[tab];
  const title = cfg.title || (form ? form.code : 'All forms');
  const lead  = cfg.lead || (form
    ? (form.desc ? form.desc + '.' : 'Register of ' + form.code + ' records.') + ' Columns follow what this form actually carries.'
    : 'Every form type in one register. Use the tabs above for a single form.');

  const catNote = state.cat
    ? '<span class="fchip">CAT '+state.cat+'<button type="button" data-act="clearcat" aria-label="Remove CAT filter">'+ic('x',14)+'</button></span>'
    : '';

  return '<section class="sec"><div class="card">'
    + '<div class="card-head"><h2>'+esc(title)+'</h2>'
    + '<span class="t-small dim od-fill">'+esc(lead)+'</span>'+catNote+'</div>'
    + tableHTML(key, cfg, rows) + '</div></section>';
}

/* ==========================================================================
   SCREEN · PAVOI DETAIL (list + record)
   ========================================================================== */
function renderPavoi(){
  const rows = scoped().filter(r=>r.form==='pavoi')
    .sort((a,b)=>{ const ao=isOpen(a)?0:1, bo=isOpen(b)?0:1; return ao-bo || a.dtd-b.dtd; });
  if(!rows.length) return '<section class="sec"><div class="card">'+emptyState()+'</div></section>';

  if(!state.sel.pavoi || !rows.some(r=>r.id===state.sel.pavoi)) state.sel.pavoi = rows[0].id;
  const r = rows.find(x=>x.id===state.sel.pavoi);

  const kpiRows = rows.filter(x=>!x.withdrawn);
  const total = kpiRows.length, done = kpiRows.filter(assessed).length, wd = rows.length - kpiRows.length;
  const list = rows.map(x=>
    '<button class="rec" type="button" data-act="selpavoi" data-id="'+x.id+'"'+(x.id===r.id?' aria-current="true"':'')+'>'
    + '<span class="rec-top"><span class="row-id">'+esc(x.number)+'</span>'+(x.withdrawn?'<span class="tag">Withdrawn</span>':'')+chip(x.status)+'</span>'
    + '<span class="row-sub od-truncate">'+esc(x.auditTitle)+'</span>'
    + '<span class="od-row" style="--od-gap:8px">'
      + (assessed(x) ? '<span class="tag">'+x.rounds.length+' round'+(x.rounds.length>1?'s':'')+'</span>'
                     : '<span class="cat c1">Not assessed</span>')
      + (x.closed ? '' : '<span class="t-small dim od-nowrap">'+(x.dtd<0 ? Math.abs(x.dtd)+'d over' : x.dtd+'d left')+'</span>')
    + '</span></button>').join('');

  const fv = firstVerDate(r);
  const sinceIssue = dayDiff(TODAY, r.raised);
  const flag = r.withdrawn
    ? { cls:'warn', t:'Withdrawn — outside KPI 7',
        b:'This PAVOI has a Withdrawn stage and no completed accept/reject stage, so it is excluded from both the numerator and the denominator until it is closed properly.' }
    : !assessed(r)
    ? { cls:'warn', t:'No verification round recorded',
        b: sinceIssue > 30
          ? 'Not yet counted as assessed in KPI 7. Raised '+sinceIssue+' days ago: past the 30-day verification window (a warning flag only, not part of the KPI 7 formula).'
          : 'Not yet counted as assessed in KPI 7 until a verification round is recorded. '+(30-sinceIssue)+' days remain in the 30-day verification window.' }
    : !fv
      ? { cls:'warn', t:'Verification round recorded without a date',
          b:'A round exists, so the record counts as assessed for KPI 7, but Date verified is empty — the 30-day window cannot be checked.' }
    : verifiedIn30(r)
      ? { cls:'', t:'First verification inside 30 days',
          b:'Verified '+dayDiff(fv, r.raised)+' days after issue, within the agreed window.' }
      : { cls:'warn', t:'First verification after the 30-day window',
          b:'Verified '+dayDiff(fv, r.raised)+' days after issue. The record still counts as assessed for KPI 7 — the flag is advisory only.' };

  const rounds = r.rounds.length ? r.rounds.map((v,i)=>
    '<div class="vt-i"><div class="vt-rail"><span class="vt-pip '+(v.result==='Satisfactory'?'done':'hot')+'"></span><span class="vt-line"></span></div>'
    + '<div class="vt-body"><span class="strong">Round '+(i+1)+' · '+esc(v.result)+'</span>'
    + '<span class="t-small dim">'+fmtDate(v.date)+' · '+esc(v.by)+'</span></div></div>').join('')
    : '<p class="t-sub dim">No verification round has been recorded against this report yet.</p>';

  const meta = [
    ['Form','PAVOI'], ['Status', null], ['Owner section', r.dept], ['Owner', r.owner],
    ['Raised', fmtDate(r.raised)], ['Target', fmtDate(r.target)],
    ['Days to due', r.closed ? 'closed '+fmtDate(r.closed) : (r.dtd<0 ? Math.abs(r.dtd)+' days over' : r.dtd+' days left')],
  ].concat(REAL ? [['Department', r.pvDept], ['Source report', r.auditTitle], ['Verification result', r.verifResult]]
                : [['Finding level', r.level], ['Audit', r.auditTitle+' · '+r.location]]
  ).map(m=>'<div class="meta-i"><span class="meta-k">'+esc(m[0])+'</span>'
    + (m[1]===null ? '<span class="meta-v">'+chip(r.status)+'</span>' : '<span class="meta-v od-truncate">'+esc(m[1])+'</span>')+'</div>').join('');

  return '<section class="sec"><div class="split">'
    + '<div class="card"><div class="card-head"><h2>PAVOI register</h2>'
      + '<span class="t-small dim od-fill">'+done+' of '+total+' assessed'+(wd?' · '+wd+' withdrawn excluded':'')+'</span></div>'
      + '<div class="rec-list">'+list+'</div></div>'
    + '<div class="card"><div class="card-head">'
      + '<h2 class="mono">'+esc(r.number)+'</h2>'+chip(r.status)
      + (r.repetitive?'<span class="cat c1">Repeat finding</span>':'')
      + '<span class="od-fill"></span>'
      + '</div>'
      + '<div class="card-pad" style="display:grid;gap:24px">'
      + '<div class="meta">'+meta+'</div>'
      + '<div class="note '+flag.cls+'"><span class="note-hd">'+(flag.cls?ic('alert',16):ic('check',16))+esc(flag.t)+'</span>'
        + '<span class="t-small">'+esc(flag.b)+'</span></div>'
      + '<div style="display:grid;gap:8px"><span class="t-micro">'+(REAL ? 'Request for verification' : 'Finding')+'</span><p class="t-sub">'+esc(r.finding)+'</p></div>'
      + '<div style="display:grid;gap:12px"><span class="t-micro">Verification history</span><div class="vt">'+rounds+'</div></div>'
      + (REAL ? pavoiTasksHTML(r) : '')
      + '</div></div></div></section>';
}

const AUD_KIND = {'Closed':'k-closed','Performed':'k-performed','In Progress':'k-progress','Scheduled':'k-scheduled','Cancelled':'k-closed'};
function renderAudit(tab){
  const kpis = (REAL && typeof auditKpiTiles === 'function') ? auditKpiTiles() : '';
  if(tab === 'list') return kpis + renderAuditList();
  if(tab === 'bottleneck') return placeholder(NAV_BY_ID.audit, NAV_BY_ID.audit.tabs.find(t=>t.id==='bottleneck'));

  const now = TODAY.getMonth();
  const head = '<div class="tl-row tl-head"><div>Audit · lead · location</div>'
    + MONTHS.map((m,i)=>'<div'+(i===now?' class="now"':'')+'>'+m+'</div>').join('') + '</div>';

  const AUD = auditsScoped();
  if(!AUD.length) return kpis + '<section class="sec"><div class="card">'+emptyState()+'</div></section>';
  const multiYear = new Set(AUD.map(a=>a.year)).size > 1;
  const body = AUD.map(a=>{
    const cells = MONTHS.map((m,i)=>{
      const on = i>=a.start && i<=a.end;
      const cls = ['tl-cell', i===now?'now':'', on?'on':'', i===a.start?'start':'', i===a.end?'end':''].filter(Boolean).join(' ');
      const kind = (a.overdue>0 && on && a.status!=='Scheduled') ? 'k-overdue' : AUD_KIND[a.status];
      const label = (on && i===a.start) ? (a.findings ? a.findings+' findings' : a.status) : '';
      return '<div class="'+cls+'">'+(on ? '<span class="tl-bar '+kind+'"><span class="od-truncate">'+esc(label)+'</span></span>' : '')+'</div>';
    }).join('');
    return '<div class="tl-row" tabindex="0" role="button" data-act="'+(REAL?'baudit':'toast')+'" data-id="'+esc(a.id)+'" data-t="'+esc(a.number)+'" '
      + 'data-b="'+esc(a.title+' · '+a.type+' · lead '+a.lead+' · '+a.location+' · '+a.status+' · '+a.findings+' findings, '+a.open+' still open'+(a.overdue?', '+a.overdue+' overdue':'')+'.')+'">'
      + '<div class="tl-lbl"><span class="od-row" style="--od-gap:8px"><span class="row-id">'+esc(a.number)+'</span>'

      + '<span class="t-small dim od-truncate">'+esc(a.type)+' · '+esc(a.lead)+' · '+esc(a.location)+'</span></div>'
      + cells + '</div>';
  }).join('');

  const counts = ['Closed','Performed','In Progress','Scheduled','Cancelled'].map(s=>({s, n:AUD.filter(a=>a.status===s).length})).filter(c=>c.n || c.s!=='Cancelled');   /* metrics-ok: audit status legend counts */

  return kpis + '<section class="sec"><div class="card">'
    + '<div class="card-head"><h2>'+(REAL ? 'Programme · '+esc(periodLabel()) : 'Annual programme 2026')+'</h2>'
    + '<span class="t-small dim od-fill">'+AUD.length+' audits and inspections · bar spans the scheduled window · select a row for detail</span></div>'
    + '<div class="card-pad" style="padding-bottom:0"><div class="legend">'
    + '<span class="legend-i"><span class="swatch" style="background:repeating-linear-gradient(135deg,var(--hatch) 0 4px,transparent 4px 8px);border-style:dashed"></span>Scheduled</span>'
    + '<span class="legend-i"><span class="swatch" style="background:var(--data-1)"></span>In progress</span>'
    + '<span class="legend-i"><span class="swatch" style="background:var(--data-2)"></span>Performed</span>'
    + '<span class="legend-i"><span class="swatch" style="background:var(--sunken)"></span>Closed</span>'
    + '<span class="legend-i"><span class="swatch" style="background:var(--accent);border-color:var(--accent)"></span>Has overdue findings</span>'
    + '<span class="legend-i dim">'+MONTHS[now]+' is the current month</span></div></div>'
    + '<div class="tl-wrap"><div class="tl">'+head+'<div class="tl-body">'+body+'</div></div></div>'
    + '<div class="tbl-foot">'+counts.map(c=>'<span class="t-small dim">'+c.s+' <span class="num strong">'+c.n+'</span></span>').join('')+'</div>'
    + '</div></section>';
}

    + '<h2>What this prototype deliberately does not do</h2><ul>'

let searchCursor = -1, searchHits = [];
function openSearch(){
  $('#searchScrim').hidden = false; $('#searchSheet').hidden = false;
  requestAnimationFrame(()=>{ $('#searchScrim').classList.add('on'); $('#searchSheet').classList.add('on'); $('#q').focus(); $('#q').select(); });
  runSearch();
}
function closeSearch(){
  $('#searchScrim').classList.remove('on'); $('#searchSheet').classList.remove('on');
  setTimeout(()=>{ $('#searchScrim').hidden = true; $('#searchSheet').hidden = true; }, 140);
  $('#searchBtn').focus();
}
function hl(text, q){
  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  if(i < 0) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i,i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
}
function runSearch(){
  const q = $('#q').value.trim().toLowerCase();
  searchCursor = -1;
  if(!q){
    searchHits = [];

    const g = hits.filter(h=>h.kind===kind).slice(0,6);

    html += '<div class="res-grp"><span class="t-micro">'+kind+(hits.filter(h=>h.kind===kind).length>6?' · first 6':'')+'</span></div>';

    + '<p class="t-sub">Search covers report numbers, audit titles and numbers, aircraft registrations and people.</p></div>';

function moveCursor(d){

/* ---- one delegated handler for the whole document ---- */
function handle(el, e){
  const act = el.getAttribute('data-act');
  if(act && BETA_ACT[act]){ BETA_ACT[act](el, e); return true; }
  if(act){
    if(act === 'sort'){
      const k = el.dataset.key, c = el.dataset.col, cur = state.sort[k];
      state.sort[k] = (cur && cur.k === c && cur.dir === 'asc') ? {k:c, dir:'desc'} : {k:c, dir:'asc'};
      state.page[k] = 1; render(); return true;
    }
    if(act === 'page'){ state.page[el.dataset.key] = Number(el.dataset.p); render(); return true; }
    if(act === 'selpavoi'){ state.sel.pavoi = el.dataset.id; render(); return true; }
    if(act === 'clearone'){
      const k = el.dataset.k;
      if(k === 'years')  state.filters.years  = [TODAY.getFullYear()];
      if(k === 'months') state.filters.months = [];
      if(k === 'q')     state.rowQuery = '';
      state.page = {}; render(); return true;
    }
    if(act === 'clearall'){
      state.filters = defaultFilters(); state.rowQuery = ''; state.cat = ''; state.page = {}; render(); return true;
    }
    if(act === 'clearcat'){ state.cat = ''; state.page = {}; render(); return true; }
    if(act === 'toast'){ toast(el.dataset.t, el.dataset.b); return true; }
    if(act === 'drawer'){ openDrawer(); return true; }
    if(act === 'seed'){ $('#q').value = el.dataset.s; runSearch(); $('#q').focus(); return true; }
    if(act === 'hit'){ openHit(searchHits[Number(el.dataset.i)]); return true; }
  }
  const screen = el.getAttribute('data-go');
  if(screen){
    closeDrawer();
    if(el.dataset.cat !== undefined) state.cat = el.dataset.cat; else state.cat = '';
    state.page = {};
    go(screen, el.dataset.tab || null, {
      id: el.dataset.id || null,
      q:  el.dataset.q  !== undefined ? el.dataset.q  : undefined
    });
    return true;
  }
  return false;
}

/* keep the popover inside the viewport: on a phone the Month field sits in the
   right-hand column, so a left-anchored panel would run off the screen edge */
function placePop(pop){
  pop.style.left = '0px';
  const r = pop.getBoundingClientRect(), gap = 12, vw = document.documentElement.clientWidth;
  let shift = 0;
  if(r.right > vw - gap) shift = (vw - gap) - r.right;
  if(r.left + shift < gap) shift = gap - r.left;
  pop.style.left = shift + 'px';
}

document.addEventListener('click', e=>{
  const mb = e.target.closest('.msel-b');
  if(mb){
    const m = mb.closest('.msel'), pop = m.querySelector('.msel-pop'), willOpen = pop.hidden;
    closePickers(m);
    pop.hidden = !willOpen;
    mb.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    if(willOpen) placePop(pop);
    if(willOpen){ const first = pop.querySelector('input,button'); if(first) first.focus(); }
    return;
  }
  const qb = e.target.closest('[data-msel-q]');
  if(qb){
    const q = Number(qb.dataset.mselQ), trio = [q*3, q*3+1, q*3+2], ms = state.filters.months;
    const full = trio.every(k=>ms.includes(k));
    state.filters.months = full ? ms.filter(k=>!trio.includes(k)) : [...new Set([...ms, ...trio])];
    periodChanged(); return;
  }
  const all = e.target.closest('[data-msel-all]');
  if(all){
    if(all.dataset.mselAll === 'year') state.filters.years = []; else state.filters.months = [];
    periodChanged(); return;
  }
  if(!e.target.closest('.msel')) closePickers();
  const el = e.target.closest('[data-act],[data-go]');
  if(el && handle(el, e)) e.preventDefault();
});
document.addEventListener('keydown', e=>{
  /* rows and timeline bars are focusable; Enter and Space activate them */
  if((e.key === 'Enter' || e.key === ' ') && document.activeElement){
    const el = document.activeElement.closest && document.activeElement.closest('[data-act],[data-go]');
    if(el && el.tagName !== 'BUTTON' && el.tabIndex === 0){ if(handle(el, e)) e.preventDefault(); return; }
  }
  const searchOpen = !$('#searchSheet').hidden;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); searchOpen ? closeSearch() : openSearch(); return; }
  if(e.key === 'Escape' && openPicker()){
    const b = openPicker(); closePickers(); b.focus(); return;
  }
  if(e.key === 'Escape'){
    if(searchOpen) closeSearch();
    else if(!$('#drawer').hidden) closeDrawer();
    return;
  }
  if(searchOpen){
    if(e.key === 'ArrowDown'){ e.preventDefault(); moveCursor(1); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); moveCursor(-1); }
    else if(e.key === 'Enter' && searchHits[searchCursor]){ e.preventDefault(); openHit(searchHits[searchCursor]); }
  }
});

/* ==========================================================================
   BETA · SCREENS ON THE MAIN DASHBOARD'S OWN LOADERS
   Every number below comes from a function or store of classic.html, reached through
   window.BETA_API (see the loader). Nothing is re-derived here except layout: where a
   main-dashboard function mixes its calculation with DOM writes, the calculation is
   repeated line for line and the source line range is cited next to it.
   ========================================================================== */
const API = () => window.BETA_API;
const BS = { pg:{}, ataLevel:'2', ataY:TODAY.getFullYear(), ataM:TODAY.getMonth()+1, k2g:'nature',
             rsTab:'f088', rsSF:'all', rsQ:'', osrForm:'', osrSF:'all', osrOu:'', afForm:'',
             docType:null, docSt:'', docRev:'', docQ:'', usersF:'all', fbMsg:'' };
const LAZY = {};
function betaResetLazy(){ Object.keys(LAZY).forEach(k => delete LAZY[k]); }
const IS_ADMIN = () => !!(REAL && REAL.user && REAL.user.role === 'admin');

/* Run a main-dashboard loader once; re-render the screen when it settles. The main loaders
   swallow their own errors (toast + flag stays false), so "settled but not ready" is an error
   too, and it is reported with the loader's own last error toast. */
function lazy(key, run, ready){
  if(ready()) return 'ready';
  const L = LAZY[key];
  if(L && L.err) return 'error';
  if(L) return 'loading';
  const here = location.hash;
  LAZY[key] = {};
  Promise.resolve().then(run).then(v => {
    LAZY[key].value = v;
    if(!ready()){
      const t = API().toasts().filter(x => x.kind === 'err').pop();
      LAZY[key].err = t ? t.m : 'The loader finished without data.';
    }
  }).catch(e => { LAZY[key].err = e && e.message ? e.message : String(e); })
    .then(() => { if(location.hash === here) render(); });
  return 'loading';
}
function lazyState(key, run, ready, what){
  const st = lazy(key, run, ready);
  if(st === 'ready') return null;
  if(st === 'error') return cardMsg('Could not load '+what, LAZY[key].err, key);
  return cardMsg('Loading '+what+'…', 'Fetching from Galileo through the main dashboard\'s own loader.', null, true);
}
function cardMsg(title, body, retryKey, spin){
  return '<section class="sec"><div class="card"><div class="empty">'
    + (spin ? '<div class="beta-boot-spin" aria-hidden="true"></div>' : ic('layers',28,'dim'))
    + '<h3>'+esc(title)+'</h3><p class="t-sub">'+esc(body || '')+'</p>'
    + (retryKey ? '<button class="btn" type="button" data-act="bretry" data-k="'+esc(retryKey)+'">Retry</button>' : '')
    + '</div></div></section>';
}

/* A plain table: cols = [{l, ar?}], rows = arrays of cell HTML. Paged like the design's lanes. */
/* opt.full: no height cap (whole table in one view) · opt.compact: tighter rows · col.ac: centred column · col.w: column width */
function plainTable(key, cols, rows, size, minW, opt){
  opt = opt || {};
  const al = c => c.ac ? 'ac' : c.ar ? 'ar' : '';
  size = size || 25;
  if(!rows.length) return '<div class="empty"><h3>No records</h3><p class="t-sub">Nothing matches the current filters.</p></div>';
  const pages = Math.max(1, Math.ceil(rows.length/size));
  const p = Math.min(BS.pg[key] || 1, pages);
  const head = cols.map(c => '<th scope="col"'+(al(c)?' class="'+al(c)+'"':'')+(c.w?' style="width:'+c.w+'"':'')+'>'+esc(c.l)+'</th>').join('');
  const body = rows.slice((p-1)*size, p*size).map(r => '<tr>'+r.map((cell,i) =>
    '<td data-l="'+esc(cols[i].l)+'"'+(i===0?' class="t-main"':(al(cols[i])?' class="'+al(cols[i])+'"':''))+'>'+cell+'</td>').join('')+'</tr>').join('');
  let pager = '';
  if(pages > 1){
    pager = '<div class="pg">'
      + '<button type="button" data-act="bpage" data-k="'+key+'" data-p="'+(p-1)+'"'+(p===1?' disabled':'')+' aria-label="Previous page">'+ic('chevron',14,'')+'</button>'
      + '<button type="button" disabled>'+p+' / '+pages+'</button>'
      + '<button type="button" data-act="bpage" data-k="'+key+'" data-p="'+(p+1)+'"'+(p===pages?' disabled':'')+' aria-label="Next page">'+ic('chevron',14,'')+'</button></div>';
  }
  /* many columns: keep a readable minimum and scroll inside the card (phones reflow to cards) */
  return '<div class="tbl-wrap'+(opt.full ? ' tbl-full' : '')+'"><table class="tbl'+(minW ? ' beta-minw' : '')+(opt.compact ? ' tbl-compact' : '')+'"'+(minW ? ' style="--beta-minw:'+minW+'px"' : '')+'><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>'
    + '<div class="tbl-foot"><span class="t-small dim">Showing '+((p-1)*size+1)+'–'+Math.min(p*size, rows.length)+' of '+rows.length+'</span>'+pager+'</div>';
}
function barList(items, hotKey){
  const max = Math.max(1, ...items.map(x => x.n));

    + '<span class="bar-track"><span class="bar-fill'+(x.k===hotKey?' hot':'')+'" style="width:'+(x.n/max*100)+'%"></span></span>'
    + '<span class="num strong od-nowrap">'+x.n+(x.sub?' <span class="dim t-small">'+esc(x.sub)+'</span>':'')+'</span></div>').join('') + '</div>';
}
/* main-dashboard date text: UTC date part (the fd() rule — T17:00Z is Vietnam midnight) */
function fdx(v){

      (grp[g] ||= { mcar:0, amo:0 })[r.type]++; }));

      .sort((a,b) => (grp[b].amo+grp[b].mcar) - (grp[a].amo+grp[a].mcar)).slice(0,12);
    /* headline = the same METRICS figure as the Overview tile; the table breaks it down by nature */
    k2body = '<div class="od-row" style="--od-gap:16px;align-items:baseline"><span class="kpi-val">'
      + (K.k2.amo > 0 ? K.k2.pct+'%' : 'N/A') + '</span><span class="t-small dim">MCAR '+K.k2.mcar+' ÷ AMO-ECAR '+K.k2.amo+'</span></div>'
      + plainTable('k2vol', [{l:'Nature group'},{l:'MCAR',ar:true},{l:'AMO-ECAR',ar:true},{l:'Rate',ar:true}],

  }

  /* KPI 7 by section, kpi7Stats 6191 + renderKpi7 6267 (rate withheld while any row is pending) */
  if(REAL.partial) return html + '<section class="sec cols cols-2">'
    + card('KPI 2 · MCAR ÷ AMO-ECAR', 'volume ratio by Nature of finding · '+esc(periodLabel()), k2body) + '</section>'
    + partialMsg('KPI 7 and the ATA comparison');
  const st = M.kpi7().stats;
  const rowRate = r => (r.total && !r.pending) ? A.kpi7Rate(r) : null;
  const k7rows = st.order.map(k => st.rows[k]).map(r => [
    '<span class="t-small">'+esc(r.key === '__unassigned__' ? 'Unassigned owner' : r.key)+'</span>',
    '<span class="num">'+r.assessed+'</span>', '<span class="num">'+r.notAssessed+'</span>',
    '<span class="num">'+r.closed+'</span>', '<span class="num">'+r.total+'</span>',
    '<span class="num strong">'+A.kpi7Fmt(rowRate(r))+'</span>']);
  k7rows.push(['<span class="strong">TOTAL — MQA</span>', '<span class="num strong">'+st.tot.assessed+'</span>',
    '<span class="num strong">'+st.tot.notAssessed+'</span>', '<span class="num strong">'+st.tot.closed+'</span>',
    '<span class="num strong">'+st.tot.total+'</span>', '<span class="num strong">'+A.kpi7Fmt(rowRate(st.tot))+'</span>']);
  const lags = st.tot.lags.slice().sort((a,b) => a-b);
  const k7note = st.tot.total ? st.tot.assessed+' / '+st.tot.total+' assessed · '+st.tot.notAssessed+' with no verification round'
    + (lags.length ? ' · median '+lags[Math.floor(lags.length/2)]+'d to first verification' : '')
    + (st.tot.withdrawn ? ' · '+st.tot.withdrawn+' withdrawn excluded' : '') : 'no PAVOI in this period';

  html += '<section class="sec cols cols-2">'
    + card('KPI 2 · MCAR ÷ AMO-ECAR', 'volume ratio by Nature of finding · '+esc(periodLabel()), k2body)
    + card('KPI 7 · PAVOI assessed', esc(k7note),
        plainTable('k7', [{l:'Section'},{l:'Assessed',ar:true},{l:'No verif.',ar:true},{l:'Closed',ar:true},{l:'Total',ar:true},{l:'KPI %',ar:true}], k7rows, 10))
    + '</section>';
  html += '<section class="sec">'+scrAta()+'</section>';
  return html;
}

/* KPI QC — ATA comparison, renderATACompare 4839–4978 */
function scrAta(){
  const A = API();
  const q = lazyState('qcs', () => A.loadQcs(), () => A.qcs().loaded, 'QC Spot Check findings');
  const years = [...new Set(A.cmrData().concat(A.ecarData()).map(r => r.raised_year).filter(Boolean).concat([TODAY.getFullYear()]))].sort((a,b)=>b-a);
  const ctl = '<div class="od-row" style="--od-gap:12px;flex-wrap:wrap">'
    + sel('ataLevel', [['2','ATA 2-digit'],['4','ATA 4-digit'],['6','ATA 6-digit']], BS.ataLevel, 'Level')
    + sel('ataY', years.map(y => [y, y]), BS.ataY, 'Year')
    + sel('ataM', MONTHS_SHORT.map((m,i) => [i+1, m]), BS.ataM, 'Month') + '</div>';
  if(q) return card('KPI QC · ATA comparison', 'internal findings (month N−1) ÷ ECAR (month N)', ctl + '<p class="t-sub dim">Loading QC Spot Check / QC PI findings…</p>');
  const Y = +BS.ataY, M = +BS.ataM, level = +BS.ataLevel, pad = n => String(n).padStart(2,'0');
  const denYM = Y+'-'+pad(M), numYM = M === 1 ? (Y-1)+'-12' : Y+'-'+pad(M-1);
  const ymOf = d => String(d || '').slice(0,7);
  const cmrQcRep = A.cmrData().filter(r => ymOf(r.raised_date) === numYM && r.category_id === A.QC_CAT_UUID);
  const ecarRep = A.ecarData().filter(r => ymOf(r.raised_date) === denYM);
  const num = {}, den = {};
  const add = (m, raw) => { const a = A.normalizeATA(raw, level); m[a] = (m[a] || 0) + 1; };
  cmrQcRep.forEach(r => (r.findingRows && r.findingRows.length) ? r.findingRows.forEach(fr => add(num, fr.ata || r.ata_chapter)) : add(num, r.ata_chapter));
  A.qcsFindingList().filter(f => f.title === A.QCPI_TITLE && f.ym === numYM).forEach(f => add(num, f.ata));
  ecarRep.forEach(r => (r.findingRows && r.findingRows.length) ? r.findingRows.forEach(fr => add(den, fr.ata || r.ata_chapter)) : add(den, r.ata_chapter));
  const keys = [...new Set(Object.keys(num).concat(Object.keys(den)))].filter(k => k !== 'Other')
    .sort((a,b) => ((num[b]||0)+(den[b]||0)) - ((num[a]||0)+(den[a]||0)));
  /* cell(), 4925 — headline and TOTAL row come from the same call (rule 11) */
  const cell = (n, d) => d > 0 ? { ratio:(n/d).toFixed(2), a: n >= d ? 'Effective' : n > 0 ? 'Under' : 'Missed' }
                               : { ratio: n > 0 ? '∞' : '0', a: n > 0 ? 'Over-detect' : 'no data' };
  const totN = keys.reduce((s,k) => s + (num[k]||0), 0), totD = keys.reduce((s,k) => s + (den[k]||0), 0);
  const tc = cell(totN, totD);
  const lab = k => level === 2 && A.ATA_LABELS[k] ? k+' · '+A.ATA_LABELS[k] : k;
  const rows = [['<span class="strong">TOTAL</span>', '<span class="num strong">'+totN+'</span>', '<span class="num strong">'+totD+'</span>',
                 '<span class="num strong">'+tc.ratio+'</span>', '<span class="tag">'+esc(tc.a)+'</span>']]
    .concat(keys.map(k => { const c = cell(num[k]||0, den[k]||0);
      return ['<span class="t-small">'+esc(lab(k))+'</span>', '<span class="num">'+(num[k]||0)+'</span>', '<span class="num">'+(den[k]||0)+'</span>',
              '<span class="num">'+c.ratio+'</span>', '<span class="tag">'+esc(c.a)+'</span>']; }));
  if((num.Other||0) + (den.Other||0) > 0)
    rows.push(['<span class="dim t-small">No-ATA / non-numeric</span>', '<span class="num dim">'+(num.Other||0)+'</span>', '<span class="num dim">'+(den.Other||0)+'</span>', '<span class="dim">—</span>', '<span class="dim">N/A</span>']);
  return card('KPI QC · ATA comparison', 'Internal '+totN+' ÷ ECAR '+totD+' = <span class="strong">'+tc.ratio+'</span> · '+numYM+' ÷ '+denYM
      + ' · sources: CMR-CAR QC '+cmrQcRep.length+', ECAR '+ecarRep.length,
    ctl + plainTable('ata', [{l:'ATA chapter'},{l:'Internal (N−1)',ar:true},{l:'ECAR (N)',ar:true},{l:'Ratio',ar:true},{l:'Assessment'}], rows, 15));
}

/* ==========================================================================
   ANALYTICS · SPI  (loadSPI 11467, spiEvaluate 11523, renderSPIPage 11570)
   ========================================================================== */
function spiChart(spi){
  const W = 320, H = 120, L = 28, R = 8, T = 10, B = 20;
  const rates = spi.months.map(m => m.rate), spt = spi.sptApproved;
  const vals = rates.filter(v => v != null).concat(spt != null ? [spt] : []);
  const max = Math.max(1, ...vals) * 1.15, iw = W-L-R, ih = H-T-B;
  const x = i => L + i/11*iw, y = v => T + ih - (v/max)*ih;
  let path = '', pts = '';
  rates.forEach((v,i) => {
    if(v == null) return;
    path += (path && rates[i-1] != null ? ' L ' : ' M ') + x(i).toFixed(1)+' '+y(v).toFixed(1);
    /* drawSPIChart 11633–11637: red when worse than SPT for the direction */
    const ok = spt == null ? true : spi.direction === 'higher' ? v >= spt : v <= spt;
    pts += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="3" fill="'+(ok ? 'var(--text-2)' : 'var(--accent)')+'"><title>Month '+(i+1)+': '+v+'</title></circle>';
  });
  const sptLine = spt != null ? '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(spt).toFixed(1)+'" y2="'+y(spt).toFixed(1)+'" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="4 3"/>' : '';
  const xl = [0,3,6,9,11].map(i => '<text x="'+x(i).toFixed(1)+'" y="'+(H-5)+'" font-size="10" text-anchor="middle" fill="var(--text-3)" font-family="ui-monospace,monospace">'+(i+1)+'</text>').join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Monthly SPI rate against the CAAV-approved SPT">'
    + '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ih)+'" y2="'+(T+ih)+'" stroke="var(--hairline)"/>' + sptLine
    + '<path d="'+path+'" fill="none" stroke="var(--text-2)" stroke-width="1.8"/>' + pts + xl + '</svg>';
}
function scrSpi(){
  const A = API();

  if(w) return w;
  const all = LAZY.spi.value || [];
  const f = state.filters;

  if(!list.length) return cardMsg('No SPI forms in the selected years', all.length ? all.length+' SPI forms exist in other years — widen the Year filter.' : 'No AMO - SPI report was found.');
  const ev = list.map(A.spiEvaluate);
  const tracking = list.filter(s => s.months.some(m => m.rate != null)).length;
  const cOn = ev.filter(e => e.status !== 'na' && e.currentLevel === 0).length;
  const c1 = ev.filter(e => e.currentLevel === 1).length, c2 = ev.filter(e => e.currentLevel === 2).length, c3 = ev.filter(e => e.currentLevel >= 3).length;
  const h1 = ev.reduce((s,e) => s+e.hist.l1, 0), h2 = ev.reduce((s,e) => s+e.hist.l2, 0), h3 = ev.reduce((s,e) => s+e.hist.l3, 0);
  const cards = list.map((spi, i) => {

      + '<div class="card-pad" style="display:grid;gap:8px"><span class="t-small dim">'+esc(spi.number)
      + ' · SPT (CAAV) '+esc(spi.sptApproved ?? '—')+' · previous year '+esc(spi.prevYear ?? '—')+' · '+(spi.direction === 'higher' ? 'higher' : 'lower')+' is better</span>'
      + spiChart(spi) + (spi.remark ? '<span class="t-small">'+esc(spi.remark)+'</span>' : '') + '</div></div>';

  return tiles([

      stat('Tracking', String(tracking), 'with monthly data'),
      stat('Current trigger', 'L1 '+c1+' · L2 '+c2+' · L3 '+c3, cOn+' on target · latest month', c1+c2+c3 > 0, true),
      stat('Trigger history', 'L1 '+h1+' · L2 '+h2+' · L3 '+h3, 'episodes in the year', false, true)
    ]) + '<section class="sec beta-cards">'+cards+'</section>';
}

/* ==========================================================================
   AUDIT PLAN · BOTTLENECK  (loadStageAggregate 7715, renderBottleneckPanel 7754)
   ========================================================================== */
function scrBottleneck(){
  const A = API();
  const w = lazyState('stages', () => A.loadStages(), () => !!A.stages(), 'audit workflow stages');
  if(w) return w;
  const agg = A.stages();
  const list = Object.entries(agg).filter(([,v]) => v.total > 0)
    .sort((a,b) => (b[1].inprogress + b[1].pendingSignOff) - (a[1].inprogress + a[1].pendingSignOff)).slice(0,12);
  const maxT = Math.max(1, ...list.map(([,v]) => v.total));
  const sumT = Object.values(agg).reduce((s,v) => s + v.total, 0);
  const rows = list.map(([k,v]) => {
    const p = x => v.total ? x / v.total * 100 : 0;
    const other = Math.max(0, 100 - p(v.completed) - p(v.inprogress) - p(v.notStarted));
    return '<div class="bar-row" style="cursor:default;grid-template-columns:minmax(140px,1.2fr) minmax(0,2fr) auto">'
      + '<span class="t-small od-truncate">'+esc(k)+'</span>'
      + '<span class="stack" style="width:'+(v.total/maxT*100)+'%" title="completed '+v.completed+' · in progress '+v.inprogress+' · not started '+v.notStarted+'">'
      + '<span style="width:'+p(v.completed)+'%;background:var(--text-3)"></span><span style="width:'+p(v.inprogress)+'%;background:var(--accent)"></span>'
      + '<span style="width:'+p(v.notStarted)+'%;background:var(--accent-28)"></span><span style="width:'+other+'%;background:var(--hairline)"></span></span>'
      + '<span class="num od-nowrap"><span class="strong">'+v.total+'</span> <span class="t-small dim">'+(v.inprogress + v.pendingSignOff)+' active</span></span></div>';
  }).join('');
  return '<section class="sec">' + card('Bottleneck analysis', list.length+' stages · '+sumT.toLocaleString('en-US')+' stage records · system-wide aggregate, not filtered by the Audit Plan filters',
    '<div class="bars">'+rows+'</div><div class="legend">'
    + '<span class="legend-i"><span class="swatch" style="background:var(--text-3)"></span>Completed</span>'
    + '<span class="legend-i"><span class="swatch" style="background:var(--accent)"></span>In progress</span>'
    + '<span class="legend-i"><span class="swatch" style="background:var(--accent-28)"></span>Not started</span>'
    + '<span class="legend-i"><span class="swatch" style="background:var(--hairline)"></span>Other</span></div>') + '</section>';
}

function scrDocs(){

  if(w) return w;
  const D = A.docs();
  const branch = A.getDocsInBranch(BS.docType);

  const rows = branch.filter(d => !q || (d.document_number+' '+d.document_revision_title+' '+d.owner_name).toLowerCase().includes(q))
    .filter(d => !BS.docSt || d.document_revision_status === BS.docSt)
    .filter(d => !BS.docRev || A.reviewDueCategory(d.review_date, today) === BS.docRev);
  const rev = c => branch.filter(d => A.reviewDueCategory(d.review_date, today) === c).length;
  /* type filter: a dropdown of the sub-types of the current level (full titles, main dashboard's order);
     picking one drills in, the path above the table steps back out */
  const node = BS.docType ? D.index[BS.docType] : null;
  const kids = (node ? node.children : D.tree).filter(n => n.doc_count > 0);
  const crumbs = [];
  for(let n = node; n; n = n.parent_id ? D.index[n.parent_id] : null) crumbs.unshift(n);

  return tiles([
      stat('Documents', String(branch.length), node ? node.title : 'all types'),
      stat('Active', String(branch.filter(d => d.document_revision_status === 'Active').length), 'current revision'),
      stat('Distributed', String(branch.filter(d => d.has_been_distributed).length), 'sent to copyholders'),

    + '<section class="sec beta-docs">'
    + card('Register', rows.length+' documents',
        path + '<div class="od-row" style="--od-gap:12px;flex-wrap:wrap">' + typeSel + searchBox('docQ', BS.docQ, 'Number, title or owner')
        + sel('docSt', [['','All statuses'],['Active','Active'],['Obsolete','Obsolete']], BS.docSt)
        + sel('docRev', [['','Any review date'],['overdue','Review overdue'],['30d','Due ≤ 30 days'],['90d','Due ≤ 90 days'],['ok','OK']], BS.docRev) + '</div>'
        + plainTable('docs', [{l:'Document'},{l:'Type'},{l:'Rev',ar:true},{l:'Status'},{l:'Owner'},{l:'Review date'},{l:'Distributed'}],
            rows.map(d => {
              const t = D.index[d.type_id];
              const rc = A.reviewDueCategory(d.review_date, today);
              return ['<span class="row-main"><button class="link-b row-id" type="button" data-act="bdoc" data-id="'+esc(d.document_revision_id)+'">'+esc(d.document_number)+'</button><span class="row-sub od-clamp-2">'+esc(d.document_revision_title)+'</span></span>',
                '<span class="t-small">'+esc(t ? A.lastTwoLevels(t.path || t.title) : (d.document_type || '—'))+'</span>',
                '<span class="num">'+esc(d.revision_number ?? '—')+'</span>',
                d.document_revision_status === 'Active' ? '<span class="tag">Active</span>' : '<span class="dim">'+esc(d.document_revision_status || '—')+'</span>',
                '<span class="t-small">'+esc(d.owner_name || '—')+'</span>',
                '<span class="num">'+fdx(d.review_date)+'</span>'+(rc === 'overdue' ? ' <span class="cat c3">overdue</span>' : rc === '30d' ? ' <span class="cat c1">≤30d</span>' : ''),

    + '</section>';

async function userAction(el){
  if(!IS_ADMIN() || !window.BETA_SB) return;
  const sb = window.BETA_SB, id = el.dataset.id, a = el.dataset.a;
  try{
    if(a === 'approve' || a === 'reject'){
      const { error } = await sb.from('users').update({ role: a === 'approve' ? 'approved' : 'rejected' }).eq('id', id); if(error) throw error;
    } else if(a === 'admin'){
      if(!confirm('Grant admin rights to this user?')) return;
      const { error } = await sb.from('users').update({ role:'admin' }).eq('id', id); if(error) throw error;
    } else if(a === 'delete'){
      if(!confirm('Delete '+el.dataset.email+' permanently? The account is removed from Supabase Auth and the profile table.')) return;
      /* same Edge Function as the main dashboard (deleteUser 8943): service_role stays server-side */
      const { data, error } = await sb.functions.invoke('delete-user', { body:{ target_id:id } });
      if(error || (data && data.error)) throw new Error((data && data.error) || error.message);
    }
    Object.keys(LAZY).filter(k => k.startsWith('users:')).forEach(k => delete LAZY[k]);
    toast('User updated', 'Change saved.'); render();
  }catch(e){ toast('Could not update user', e.message || String(e)); }
}

function scrMyDash(){
  if(!IS_ADMIN()) return adminOnly();
  let widgets = [];
  try{ widgets = JSON.parse(localStorage.getItem('db_widgets_' + (REAL.user && REAL.user.email)) || '[]'); }catch(e){ widgets = []; }
  if(!widgets.length) return cardMsg('No pinned widgets', 'Widgets pinned from the Query Builder in the main dashboard appear here. The Query Builder itself is not carried into the redesign.');
  const A = API();
  const cards = widgets.map(wd => {
    const key = 'w:'+wd.id;
    const st = lazy(key, async () => {
      const fl = (wd.filters || []).filter(f => f.field && f.value !== '').map(f => f.op === 'contains'
        ? 'contains('+f.field+",'"+String(f.value).replace(/'/g,"''")+"')"
        : f.field+' '+f.op+' '+(isNaN(f.value) ? "'"+String(f.value).replace(/'/g,"''")+"'" : f.value));
      let u = A.G_URL + wd.table + '?$select=' + encodeURIComponent((wd.fields || []).join(','));
      if(fl.length) u += '&$filter=' + encodeURIComponent(fl.join(' and '));
      if(wd.sortField) u += '&$orderby=' + encodeURIComponent(wd.sortField + ' ' + (wd.sortDir || 'asc'));
      u += '&$top=' + (wd.limit || 500);
      return A.fetchAll(u);
    }, () => !!(LAZY[key] && LAZY[key].value));
    let body;
    if(st === 'loading') body = '<p class="t-sub dim">Loading…</p>';
    else if(st === 'error') body = '<p class="t-sub red">'+esc(LAZY[key].err)+'</p>';
    else {
      const data = LAZY[key].value;
      if(wd.vizType === 'kpi') body = '<span class="kpi-val">'+data.length+'</span>';
      else if(wd.vizType === 'bar' || wd.vizType === 'pie'){
        const x = wd.chartX || (wd.fields || [])[0], y = wd.chartY, g = {};
        data.forEach(r => { const k = String(r[x] ?? '—'); g[k] = (g[k] || 0) + (y && y !== '__count__' ? (+r[y] || 0) : 1); });
        body = barList(Object.entries(g).sort((a,b) => b[1]-a[1]).slice(0,20).map(([k,n]) => ({ k, n:Math.round(n*100)/100 })));
      } else body = plainTable(key, (wd.fields || []).map(f => ({ l:f })), data.map(r => (wd.fields || []).map(f => '<span class="t-small">'+esc(r[f] ?? '—')+'</span>')), 10);
    }
    return card(wd.name || 'Widget', esc(wd.table)+' · '+esc(wd.vizType || 'table'), body);
  }).join('');
  return '<section class="sec beta-cards">'+cards+'</section>';
}

async function sendFeedback(){
  const ta = document.getElementById('betaFb'), msg = ta ? ta.value.trim() : '';
  if(!msg) return toast('Write a message first', '');
  if(!REAL.feedbackUrl || !window.BETA_SB) return toast('Feedback unavailable', 'Sign in on the main dashboard in this tab first.');
  try{
    const { data } = await window.BETA_SB.auth.getSession();
    const token = data && data.session && data.session.access_token;
    if(!token) throw new Error('session expired — sign in again');
    const r = await fetch(REAL.feedbackUrl, { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+token },
      body: JSON.stringify({ message: msg.slice(0,1500), name: REAL.user.full_name || '', role: REAL.user.role || '',
        page: 'beta · '+location.hash, rev: REAL.appRev + ' (beta)', ua: navigator.userAgent }) });
    if(!r.ok) throw new Error('HTTP '+r.status);
    BS.fbMsg = ''; if(ta) ta.value = '';
    closeModal();
    toast('Feedback sent', 'Thank you — it reached the dashboard owner.');
  }catch(e){ toast('Could not send feedback', e.message || String(e)); }
}

/* r169-i1 (Eric: "cần có màu sắc để dễ nhìn"): colour of a CA card and its Target / Completed pills by status */
const caDayN = (a, b) => Math.round((M.dayOf(a) - M.dayOf(b)) / 864e5);
function caTone(c){
  if(M.isOnTime(c))  return { card:'ca-ok',   target:'',     done:'ok' };
  if(M.isLate(c))    return { card:'ca-late', target:'warn', done:'warn' };
  if(M.isOverdue(c)) return { card:'ca-over', target:'over', done:'over' };
  if(M.isInTarget(c))return { card:'ca-open', target:'info', done:'' };
  return { card:'ca-none', target:'', done:'' };
}
function caMeta(c){
  const t = caTone(c);
  const note = M.isLate(c) ? ' · '+caDayN(c.completed, c.target)+'d late'
             : M.isOnTime(c) && c.target ? ' · on time'
             : M.isOverdue(c) ? ' · '+caDayN(TODAY, c.target)+'d overdue'
             : M.isInTarget(c) && c.target ? ' · '+caDayN(c.target, TODAY)+'d left' : '';
  const pill = (cls, label, val) => '<span class="ca-pill'+(cls ? ' '+cls : '')+'"><b>'+label+'</b>'+val+'</span>';
  return '<div class="ca-meta">' + pill(t.target, 'Target', fdx(c.target))
    + pill(t.done, 'Completed', (c.completed ? fdx(c.completed) : 'not yet') + note) + '</div>';

async function runExport(kind){

/* ---- AI Assistant (galileo-ai Worker; tools run in the browser on the loaded data) ---- */
const AI = { open:false, msgs:[], busy:false };
function aiPanelHTML(){
  const msgs = AI.msgs.filter(m => typeof m.content === 'string' || (Array.isArray(m.content) && m.content.some(c => c.type === 'text')));
  const bubble = m => {
    const txt = typeof m.content === 'string' ? m.content : m.content.filter(c => c.type === 'text').map(c => c.text).join('\n');
    return '<div class="beta-ai-msg '+m.role+'">'+(m.role === 'assistant' ? API().aiMd(txt) : esc(txt))+'</div>';
  };
  return '<div class="beta-ai-head"><span class="strong">AI Assistant</span><span class="tag">beta</span><span class="od-fill"></span>'
    + '<button class="link-b" type="button" data-act="baiclear">Clear</button><button class="icon-b" type="button" data-act="baitoggle" aria-label="Close">✕</button></div>'
    + '<div class="beta-ai-msgs" id="aiMsgs">' + (msgs.length ? msgs.map(bubble).join('')
      : '<p class="t-small dim">Ask about the loaded QA data, e.g. "How many PAVOI are overdue in 2026 by section?" Answers come from queries on the dashboard data; numbers are never invented.</p>')
    + (AI.busy ? '<div class="beta-ai-msg assistant dim">Querying the data…</div>' : '') + '</div>'
    + '<div class="beta-ai-in"><textarea class="ctl" id="aiIn" rows="2" placeholder="Ask a question"'+(AI.busy?' disabled':'')+'></textarea>'
    + '<button class="btn primary" type="button" data-act="baisend"'+(AI.busy?' disabled':'')+'>Send</button></div>';
}
function aiRender(){ const p = $('#betaAi'); if(!p) return; p.hidden = !AI.open; if(AI.open){ p.innerHTML = aiPanelHTML(); const b = $('#aiMsgs'); if(b) b.scrollTop = b.scrollHeight; const t = $('#aiIn'); if(t && !AI.busy) t.focus(); } }
async function aiSend(){
  const t = $('#aiIn'), q = t ? t.value.trim() : ''; if(!q || AI.busy) return;
  const A = API();
  AI.msgs.push({ role:'user', content:q });
  if(AI.msgs.length > 24){ AI.msgs = AI.msgs.slice(-16); while(AI.msgs.length && AI.msgs[0].role !== 'user') AI.msgs.shift(); }
  AI.busy = true; aiRender();
  try{
    for(let round = 0; round < 6; round++){
      const r = await fetch(A.AI_URL, { method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ system: A.aiSystem(), tools: A.AI_TOOLS, messages: AI.msgs }) });
      const data = await r.json().catch(() => ({}));
      if(!r.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + r.status));
      AI.msgs.push({ role:'assistant', content:data.content });
      if(data.stop_reason !== 'tool_use') break;
      AI.msgs.push({ role:'user', content: data.content.filter(c => c.type === 'tool_use').map(c => ({
        type:'tool_result', tool_use_id:c.id, content: JSON.stringify(A.aiRunTool(c.name, c.input)) })) });
    }
  }catch(e){
    AI.msgs.push({ role:'assistant', content:'The assistant could not answer: ' + (e.message || e) });
  }
  AI.busy = false; aiRender();
}

/* ---- refresh, data age, 12-hour auto refresh, LED wall (kiosk) ---- */
function ageText(){
  const ts = REAL.cacheTs || Date.parse(REAL.generatedAt);
  const m = Math.round((Date.now() - ts) / 60000);
  return m < 2 ? 'just loaded' : m < 60 ? m+'m ago' : Math.floor(m/60)+'h '+(m%60)+'m ago';
}
const KIOSK = { on:false, i:0, timer:null, sec:30 };
function kioskParam(){
  const v = new URLSearchParams(location.search).get('kiosk');
  if(v === null) return 0;
  const n = parseInt(v, 10);
  return (n >= 5 && n <= 600) ? n : 30;   /* ?kiosk, =1, =true → 30 s (classic kioskParam 3228) */
}
/* same five steps as classic KIOSK_STEPS 3215 */
const KIOSK_STEPS = [
  { l:'Overview', go:() => go('overview') },
  { l:'Report status · EIS', go:() => { BS.rsTab = 'eis'; go('analytics','status'); } },
  { l:'Report status · F-088', go:() => { BS.rsTab = 'f088'; go('analytics','status'); } },
  { l:'SPI', go:() => go('analytics','spi') },
  { l:'Safety · MSAG', go:() => go('analytics','safety') }
];
function startKiosk(){
  KIOSK.sec = kioskParam(); if(!KIOSK.sec) return;
  KIOSK.on = true; document.body.classList.add('kiosk');
  /* pre-warm the three lazy sources so the first cycle does not stall */
  const A = API();
  lazy('rs', () => A.loadRptStatus(), () => A.rptStatus().loaded);
  lazy('safety', () => A.loadSafety(), () => A.safety().loaded);
  lazy('spi', () => A.loadSPI(), () => !!(LAZY.spi && LAZY.spi.value));
  const show = () => { const st = KIOSK_STEPS[KIOSK.i]; st.go(); const c = $('#kioskChip'); if(c){ c.hidden = false; c.textContent = 'LED '+(KIOSK.i+1)+'/'+KIOSK_STEPS.length+' · '+st.l; } };
  show();
  KIOSK.timer = setInterval(() => { KIOSK.i = (KIOSK.i + 1) % KIOSK_STEPS.length; show(); }, KIOSK.sec * 1000);
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && KIOSK.on){ clearInterval(KIOSK.timer); KIOSK.on = false;
    document.body.classList.remove('kiosk'); const c = $('#kioskChip'); if(c) c.hidden = true; toast('LED mode off', ''); } });
}

/* Audit Plan KPI tiles — renderAuditKpi 7672–7712, on the MNT audits inside the Year × Month filter */
function auditKpiTiles(){
  const A = API();
  const data = A.auditData().filter(a => a.is_qa_amo_scope && M.auditInPeriod(a));
  const S = M.auditSummary(data);
  const stageT = s => A.normalizeStageTitle(s.stage_type);
  const inCar = data.filter(a => (a.audit_stages || []).some(s => ['Follow up CAR','Finding follow up'].includes(stageT(s)) && s.stage_status === 'InProgress')).length;
  const sc = {}; data.forEach(a => (a.audit_stages || []).forEach(s => { if(s.stage_status === 'InProgress'){ const t = stageT(s); sc[t] = (sc[t] || 0) + 1; } }));
  const top = Object.entries(sc).sort((a,b) => b[1] - a[1])[0];
  const years = [...new Set(data.map(a => a.sched_year).filter(Boolean))].sort();
  return tiles([stat('Total audits', String(S.total), 'MNT · '+periodLabel()), stat('Closed', String(S.closed), 'status Closed'),
    stat('Open', String(S.open), 'in progress, performed or scheduled'), stat('Closure rate', S.rate+'%', S.closed+' of '+S.total, S.total > 0 && S.rate < 50),
    stat('CAR follow-up', String(inCar), 'stage in progress'), stat('Bottleneck', top ? top[0] : '—', top ? top[1]+' audits in progress' : 'no stage in progress', false, true),
    stat('Years', years.length ? (years.length <= 3 ? years.join(', ') : years[0]+'–'+years[years.length-1]) : '—', years.length+' year(s)', false, true)]);
}

    '<p>Open the dashboard with <b>?kiosk=1</b> at the end of the address (or <b>?kiosk=60</b> for 60 seconds per page). The screen rotates Overview → Report status EIS → Report status F-088 → SPI → Safety (MSAG), without the navigation. Press Esc to stop. Use one browser window; the data refreshes itself every 12 hours without reloading the page.</p>')
  + sec('faq','Questions',
    '<p><b>The first opening is slow.</b> The first load of the day on a computer fetches everything from Galileo. Later openings use the saved copy.</p>'
    + '<p><b>I cannot see Admin screens.</b> They are for administrators. Ask an administrator to change your role.</p>'
    + '<p><b>How do I add a user?</b> The user chooses Request an account; an administrator approves it in Admin › User management.</p>'
    + '<p><b>Where is the previous dashboard?</b> It is kept as a backup at <b>/classic.html</b>.</p>'
    + '<p><b>How do I report a problem?</b> <b>Send feedback</b> (under your name in the sidebar, or in the More menu on a phone) sends your message to the dashboard owner, with the screen you are on.</p>');
}
BETA_ACT.bgoto = el => { const t = document.getElementById(el.dataset.id); if(t) t.scrollIntoView({ behavior:'smooth', block:'start' }); };
BETA_SCREENS['library/guide'] = scrGuideNew;

/* BETA-SCREENS:END */

/* ==========================================================================
   BOOT
   ========================================================================== */
(function boot(){
  $('#railBtn').innerHTML = ic('rail',20);
  paintThemeBtn();
  $('#searchBtnIc').innerHTML = ic('search',18);
  $('#searchSheetIc').innerHTML = ic('search',18);
  $('#drawerClose').innerHTML = ic('x',20);
  $('#stamp').textContent = fmtDate(TODAY);
  if(REAL){
    const tag = document.querySelector('.demo-tag');
    if(tag){
      tag.textContent = 'Beta';
      tag.title = 'Live Galileo data via classic.html '+REAL.appRev+(REAL.source === 'cache'
        ? ' · from the main dashboard cache, saved '+new Date(REAL.cacheTs).toLocaleString()
        : ' · loaded from Galileo '+new Date(REAL.generatedAt).toLocaleString());
    }
    /* the mock sidebar profile is an invented person — never show it next to real records */
    const un = document.querySelector('.user-name'), ur = document.querySelector('.user-role'), av = document.querySelector('.user .avatar');
    const nm = (REAL.user && (REAL.user.full_name || REAL.user.email)) || 'Signed in';
    if(un) un.textContent = nm;
    if(ur) ur.textContent = (REAL.user && REAL.user.role === 'admin' ? 'Admin' : 'Viewer')+' · '+REAL.appRev;
    if(av) av.textContent = nm.split(/\s+/).filter(Boolean).slice(-2).map(w=>w[0]).join('').toUpperCase() || '·';
    if(REAL.loadWarnings && REAL.loadWarnings.length)
      setTimeout(()=> toast('Some data did not load', REAL.loadWarnings.join(' · ')), 400);
    $('#betaAccount').hidden = false;
    $('#betaAiBtn').hidden = false;
  }

  $('#themeBtn').addEventListener('click', ()=> setTheme(currentTheme() === 'light' ? 'dark' : 'light'));
  if(window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    const onOS = e=>{
      let saved = null;
      try{ saved = localStorage.getItem('qa-amo-theme'); }catch(err){}
      if(saved !== 'light' && saved !== 'dark'){
        document.documentElement.setAttribute('data-theme', e.matches ? 'light' : 'dark');
        paintThemeBtn();
      }
    };
    mq.addEventListener ? mq.addEventListener('change', onOS) : mq.addListener(onOS);
  }

  $('#railBtn').addEventListener('click', ()=>{ railPref = effRail() ? 'wide' : 'rail'; applyRail(); });
  window.addEventListener('resize', applyRail);
  applyRail();

  buildPeriodPicker();
  document.addEventListener('change', e=>{
    const c = e.target.closest && e.target.closest('input[data-msel]');
    if(!c) return;
    const key = c.dataset.msel === 'year' ? 'years' : 'months', v = Number(c.value);
    const cur = state.filters[key];
    state.filters[key] = c.checked ? [...new Set([...cur, v])] : cur.filter(x=>x !== v);
    periodChanged();
  });

  $('#searchBtn').addEventListener('click', openSearch);
  $('#searchScrim').addEventListener('click', closeSearch);
  $('#drawerScrim').addEventListener('click', closeDrawer);
  $('#drawerClose').addEventListener('click', closeDrawer);
  $('#q').addEventListener('input', runSearch);

  state.cat = '';
  if(!location.hash) location.hash = '#/overview';
  route();
  if(REAL && typeof startKiosk === 'function') startKiosk();
})();
</script>
</body>
</html>
