<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QA AMO Dashboard — Beta · VietJet Air</title>
<meta name="description" content="Beta of the redesigned QA AMO dashboard, running on the live dashboard's Galileo data logic.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ============================================================
   DESIGN TOKENS — one place. Dark neutral ground, VietJet red as
   the only accent hue. Every colour, size, spacing step, radius
   and duration used anywhere in this document resolves here.
   ============================================================ */
:root{
  /* ground + surfaces */
  --bg:#0B0D10;
  --sunken:#101317;
  --surface:#14171C;
  --raised:#1A1E24;
  --raised-2:#22272F;
  --border:#262B33;
  --border-strong:#39414E;
  --hairline:#1B1F25;

  /* text ramp — all three clear 4.5:1 on --bg */
  --text:#E8EBF0;
  --text-2:#9BA5B4;
  --text-3:#7D8797;

  /* the single accent: VietJet red.
     --accent is the brand value, used for fills, bars, rules and marks.
     --accent-fg / --accent-fg-2 are the same hue lightened so small text
     on the dark ground clears 4.5:1 (#E30613 itself reaches only 3.99:1). */
  --accent:#E30613;
  --accent-fg:#FF6B6F;
  --accent-fg-2:#FFB3B5;
  --accent-08:rgba(227,6,19,.08);
  --accent-12:rgba(227,6,19,.12);
  --accent-20:rgba(227,6,19,.20);
  --accent-28:rgba(227,6,19,.28);
  --accent-34:rgba(227,6,19,.34);
  --accent-62:rgba(227,6,19,.62);

  /* spacing rhythm — multiples of 4 only */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;

  /* radii */
  --r-card:10px; --r-ctl:8px; --r-chip:999px;

  /* motion */
  --dur-in:180ms; --dur-out:120ms;
  --ease-out:cubic-bezier(0,0,.2,1);
  --ease-in:cubic-bezier(.4,0,1,1);

  /* type */
  --font:system-ui,"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace;

  /* chrome */
  --nav-w:248px;
  --topbar-h:60px;

  /* ---- theme-dependent semantics ----------------------------------------
     Everything below flips wholesale in the light theme. Kept apart from the
     ground and text ramps above so a theme is one block, never a hunt through
     rules. --on-* is always the foreground that belongs to the fill named
     after it; the pair is declared together so a state can never invert into
     light-on-light or dark-on-dark. */
  color-scheme:dark;

  --accent-press:#C00511;      /* solid accent, hovered / pressed */
  --on-accent:#FFFFFF;         /* text on a solid --accent fill */
  --on-wash:#FFFFFF;           /* text on the --accent-34 wash: mark, selection */

  /* neutral data ramp: four steps that stay mutually legible on --surface */
  --data-1:#39414E;  --on-data-1:#FFFFFF;
  --data-2:#2B313B;  --on-data-2:#E8EBF0;
  --data-3:#4C5563;
  --hatch:#1A1E24;             /* diagonal hatch for "scheduled" */

  /* depth */
  --scrim:rgba(4,6,9,.74);
  --shadow-1:0 24px 64px rgba(0,0,0,.6);
  --shadow-2:0 12px 32px rgba(0,0,0,.5);
}

/* ============================================================
   LIGHT THEME — the same structure on a cool paper ground.
   Not an inversion: the surfaces re-stack (cards go white, the
   page and filter bar recede to grey) and the accent darkens to
   #AA040F, because #E30613 only just clears 4.5:1 on white and
   fails it over its own tinted washes.
   ============================================================ */
html[data-theme="light"]{
  color-scheme:light;

  --bg:#F6F7F9;
  --sunken:#ECEFF3;
  --surface:#FFFFFF;
  --raised:#F1F3F6;
  --raised-2:#E4E8EE;
  --border:#DDE2E9;
  --border-strong:#B3BCC9;
  --hairline:#E8ECF1;

  --text:#12161C;
  --text-2:#4C5663;
  --text-3:#5E6875;

  --accent:#E30613;
  --accent-fg:#AA040F;
  --accent-fg-2:#8C0209;

  --on-wash:#8C0209;

  --data-1:#A4AFBE;  --on-data-1:#12161C;
  --data-2:#CBD3DE;  --on-data-2:#12161C;
  --data-3:#8593A4;
  --hatch:#D3DAE3;

  --scrim:rgba(18,22,28,.46);
  --shadow-1:0 24px 64px rgba(16,22,34,.20);
  --shadow-2:0 12px 32px rgba(16,22,34,.16);
}

/* Colour-only crossfade while switching, so the flip reads as one move
   rather than a flash. Removed again 220ms later; the reduced-motion rule
   at the foot of this sheet cancels it outright. */
html.theming,html.theming *,html.theming *::before,html.theming *::after{
  transition:background-color 180ms var(--ease-out),border-color 180ms var(--ease-out),
             color 180ms var(--ease-out),fill 180ms var(--ease-out),stroke 180ms var(--ease-out) !important;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:650;letter-spacing:-.01em}
h1{font-size:20px}
h2{font-size:18px}
h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
a{color:var(--accent-fg);text-decoration:none}
a:hover{text-decoration:underline}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-34);color:var(--on-wash)}
svg{display:block;flex:none}

/* scrollbars */
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid var(--bg)}

/* ---------- type helpers ---------- */
.t-micro{font-size:13px;line-height:1.45;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:650}
.t-sub{font-size:15px;line-height:1.6;color:var(--text-2)}
.t-small{font-size:14px;line-height:1.5;color:var(--text-2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-size:.94em;letter-spacing:-.01em}
.strong{color:var(--text);font-weight:650}
.dim{color:var(--text-3)}
.red{color:var(--accent-fg)}

.skip{position:fixed;top:8px;left:8px;z-index:200;padding:10px 14px;background:var(--raised);border:1px solid var(--accent);border-radius:var(--r-ctl);transform:translateY(-300%)}
.skip:focus{transform:none}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);height:100dvh}
.main{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-width:0;min-height:0}

/* ---------- sidebar ---------- */
.sidebar{
  background:var(--surface);border-right:1px solid var(--border);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;
}
.brand{display:flex;align-items:center;gap:10px;padding:var(--s4);border-bottom:1px solid var(--border)}
.brand-mark{width:34px;height:34px;flex:none;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--on-accent);letter-spacing:-.03em}
.brand-text{display:grid;gap:1px;min-width:0}
.brand-name{font-size:15px;font-weight:700;letter-spacing:-.01em;display:block}
.brand-sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:650;display:block}
.sb-nav{padding:var(--s3) var(--s3) var(--s4);overflow-y:auto;min-height:0}
.sb-foot{border-top:1px solid var(--border);padding:var(--s3)}

.nav-b{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  padding:10px 12px;border-radius:var(--r-ctl);min-height:44px;
  color:var(--text-2);font-size:15px;font-weight:550;text-align:left;
  transition:background var(--dur-in) var(--ease-out),color var(--dur-in) var(--ease-out);
}
.nav-b:hover{background:var(--raised);color:var(--text)}
.nav-b[aria-current="page"]{background:var(--accent-12);color:var(--text);font-weight:700}
.nav-b[aria-current="page"]::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--accent);
}
.nav-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-count{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent-fg);background:var(--accent-20);border-radius:var(--r-chip);padding:2px 7px;flex:none}
.nav-sep{height:1px;background:var(--border);margin:var(--s3) 12px}

.user{display:flex;align-items:center;gap:10px;padding:6px 6px 10px}
.avatar{width:32px;height:32px;flex:none;border-radius:50%;background:var(--raised-2);border:1px solid var(--border-strong);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--text-2)}
.user-name{font-size:14px;font-weight:650;display:block}
.user-role{font-size:12px;color:var(--text-3);display:block}

/* ---------- icon-rail mode (manual toggle) ---------- */
body.rail{--nav-w:72px}
body.rail .nav-label,body.rail .brand-text,body.rail .nav-count,body.rail .user-meta{display:none}
body.rail .nav-b{justify-content:center;padding:10px 0}
body.rail .brand,body.rail .user{justify-content:center}
body.rail .sb-nav{padding-inline:10px}
body.rail .nav-b::after{
  content:attr(data-label);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);
  background:var(--raised-2);border:1px solid var(--border-strong);color:var(--text);
  font-size:14px;font-weight:600;white-space:nowrap;padding:6px 10px;border-radius:6px;
  opacity:0;pointer-events:none;z-index:60;transition:opacity var(--dur-out) var(--ease-out);
}
body.rail .nav-b:hover::after,body.rail .nav-b:focus-visible::after{opacity:1}

/* ---------- topbar ---------- */
.topbar{
  display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s5);min-height:var(--topbar-h);
  border-bottom:1px solid var(--border);background:var(--bg);
}
.icon-b{
  width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:var(--r-ctl);
  border:1px solid var(--border);color:var(--text-2);
  transition:background var(--dur-in) var(--ease-out),color var(--dur-in) var(--ease-out),border-color var(--dur-in) var(--ease-out);
}
.icon-b:hover{background:var(--raised);color:var(--text);border-color:var(--border-strong)}
.search-b{
  display:flex;align-items:center;gap:var(--s2);min-height:40px;flex:1 1 240px;max-width:420px;
  padding:0 var(--s3);border:1px solid var(--border);border-radius:var(--r-ctl);
  background:var(--sunken);color:var(--text-3);font-size:15px;
  transition:border-color var(--dur-in) var(--ease-out),color var(--dur-in) var(--ease-out);
}
.search-b:hover{border-color:var(--border-strong);color:var(--text-2)}
.search-b .od-fill{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--border-strong);border-radius:5px;padding:1px 5px;color:var(--text-3);flex:none}
.stamp{font-family:var(--mono);font-size:13px;color:var(--text-3);white-space:nowrap}
.demo-tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-fg);border:1px solid var(--accent-34);background:var(--accent-08);border-radius:var(--r-chip);padding:3px 9px;white-space:nowrap}

/* ---------- persistent filter bar ---------- */
.filterbar{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--s4);
  padding:var(--s3) var(--s5);border-bottom:1px solid var(--border);background:var(--sunken);
}
.fb-field{display:grid;gap:var(--s1)}
/* the bar sets its own display, which outranks the UA's [hidden] rule;
   restate it so renderFilterBar() can actually hide it */
.filterbar[hidden]{display:none}
.fb-field>label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:650}
.ctl{
  background:var(--raised);border:1px solid var(--border);color:var(--text);
  border-radius:var(--r-ctl);padding:8px 10px;font-size:15px;min-height:40px;font-family:inherit;
}
.ctl:hover{border-color:var(--border-strong)}
select.ctl{min-width:168px;cursor:pointer}
/* ---------- month / year multi-select ----------
   Replaces the single "Date range" select: QA reports are read by calendar
   month and year, and people compare several at once (Jul-Sep, or 2025 vs 2026). */
.msel{position:relative}
.msel-b{display:inline-flex;align-items:center;justify-content:space-between;gap:var(--s2);min-width:168px;text-align:left;cursor:pointer}
.msel-b .ic{transform:rotate(90deg);color:var(--text-3);flex:none;transition:transform .15s}
.msel-b[aria-expanded="true"]{border-color:var(--border-strong)}
.msel-b[aria-expanded="true"] .ic{transform:rotate(-90deg)}
.msel-v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.msel-pop{
  position:absolute;top:calc(100% + 6px);left:0;z-index:60;min-width:100%;
  background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-card);
  box-shadow:var(--shadow-2);padding:var(--s2);
}
.msel-pop[hidden]{display:none}
.msel-list{display:grid;gap:2px}
.msel-months{grid-template-columns:repeat(3,minmax(0,1fr));min-width:276px}
.msel-opt{display:flex;align-items:center;gap:var(--s2);min-height:36px;padding:0 var(--s2);border-radius:6px;cursor:pointer;font-size:15px;white-space:nowrap;color:var(--text)}
.msel-opt:hover{background:var(--raised)}
.msel-opt input{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none;cursor:pointer}
.msel-q{display:flex;gap:var(--s1);padding:0 0 var(--s2);margin-bottom:var(--s2);border-bottom:1px solid var(--border)}
.msel-qb{flex:1;min-height:32px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-weight:650;color:var(--text-2)}
.msel-qb:hover{border-color:var(--border-strong);color:var(--text)}
.msel-qb[aria-pressed="true"]{background:var(--accent-08);border-color:var(--accent-34);color:var(--accent-fg)}
.msel-ft{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);margin-top:var(--s2);padding-top:var(--s2);border-top:1px solid var(--border)}
.fb-chips{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);margin-left:auto}
.fchip{
  display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 6px 0 10px;
  border:1px solid var(--accent-34);background:var(--accent-08);border-radius:var(--r-chip);
  font-size:13px;font-weight:600;color:var(--accent-fg-2);
}
.fchip button{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;color:var(--accent-fg)}
.fchip button:hover{background:var(--accent-20)}
.link-b{font-size:14px;font-weight:650;color:var(--accent-fg);padding:6px 4px;border-radius:6px}
.link-b:hover{text-decoration:underline}

/* ---------- content ---------- */
.content{overflow-y:auto;min-height:0;padding:var(--s5)}
.wrap{max-width:1560px;margin:0 auto}
.page-head{margin-bottom:var(--s5)}
.page-head h1{font-size:22px}
.page-head .t-sub{margin-top:var(--s1);max-width:76ch}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--border);margin-top:var(--s4);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:10px 14px;min-height:44px;font-size:15px;font-weight:550;color:var(--text-2);
  border-bottom:2px solid transparent;white-space:nowrap;
  transition:color var(--dur-in) var(--ease-out),border-color var(--dur-in) var(--ease-out);
}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:700}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card)}
.card-pad{padding:var(--s4)}
.card-head{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;padding:var(--s4);border-bottom:1px solid var(--hairline)}
.card-head h2{font-size:16px}
.sec{margin-bottom:var(--s6)}
.sec-head{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s3)}
.cols{display:grid;gap:var(--s3)}
@media (min-width:1024px){
  .cols-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cols-32{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
}

/* ---------- KPI tile ---------- */
.kpi-grid{display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fit,minmax(228px,1fr))}
.kpi{
  display:grid;gap:var(--s2);align-content:start;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--s4);
  transition:background var(--dur-in) var(--ease-out),border-color var(--dur-in) var(--ease-out);
}
.kpi:hover{background:var(--raised);border-color:var(--border-strong)}
.kpi>*{display:block}
.kpi-lbl{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:650}
.kpi-val{font-family:var(--mono);font-size:clamp(28px,3vw,38px);font-weight:700;line-height:1.05;letter-spacing:-.03em;color:var(--text)}
.kpi.alarm .kpi-val{color:var(--accent-fg)}
.kpi-foot{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.trend{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:13px;font-weight:700;white-space:nowrap}
.trend.bad{color:var(--accent-fg)}
.trend.good{color:var(--text)}
.trend.flat{color:var(--text-3)}
.kpi-note{font-size:13px;color:var(--text-3)}
.spark{width:100%;height:32px;overflow:visible}

/* ---------- status chips: hue-free, red reserved for breach ---------- */
.chip{
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  border-radius:var(--r-chip);padding:3px 10px 3px 8px;font-size:13px;font-weight:650;
  border:1px solid transparent;
}
.chip.s-open    {border-color:var(--border-strong);color:var(--text-2);background:transparent}
.chip.s-progress{border-color:var(--raised-2);color:var(--text);background:var(--raised-2)}
.chip.s-ontime  {border-color:transparent;color:var(--text-3);background:var(--sunken)}
.chip.s-late    {border-style:dashed;border-color:var(--border-strong);color:var(--text-3);background:transparent}
.chip.s-overdue {border-color:var(--accent);color:var(--on-accent);background:var(--accent);font-weight:700}
.chip.s-neutral {border-color:var(--border);color:var(--text-2);background:var(--sunken)}

/* CAT severity: one red at three strengths, plus the numeral itself */
.cat{display:inline-flex;align-items:center;border-radius:var(--r-chip);padding:2px 9px;font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap;border:1px solid}
.cat.c1{background:var(--accent-12);border-color:var(--accent-28);color:var(--accent-fg)}
.cat.c2{background:var(--accent-34);border-color:var(--accent-62);color:var(--accent-fg-2)}
.cat.c3{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tag{display:inline-flex;align-items:center;border:1px solid var(--border);background:var(--sunken);color:var(--text-2);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:650;white-space:nowrap}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;max-height:min(62vh,740px)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{
  position:sticky;top:0;z-index:2;text-align:left;background:var(--surface);
  font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:700;
  padding:0;border-bottom:1px solid var(--border);white-space:nowrap;
}
.tbl th>button,.tbl th>span{display:flex;align-items:center;gap:5px;width:100%;padding:11px 12px;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;text-align:left}
.tbl th>button:hover{color:var(--text)}
.tbl th[aria-sort]>button{color:var(--text)}
.sort-ic{opacity:.4}
.tbl th[aria-sort] .sort-ic{opacity:1;color:var(--accent-fg)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.tbl tbody tr{transition:background var(--dur-out) var(--ease-out)}
.tbl tbody tr:hover{background:var(--raised);cursor:pointer}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl td.ar{text-align:right}
.row-main{display:grid;gap:2px}
.row-main>*{display:block}
.row-id{font-family:var(--mono);font-size:13.5px;font-weight:700;color:var(--text)}
.row-sub{font-size:13.5px;color:var(--text-3)}
.tbl-foot{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-top:1px solid var(--border)}
.pg{display:flex;gap:4px;margin-left:auto}
.pg button{min-width:36px;min-height:36px;padding:0 8px;border:1px solid var(--border);border-radius:6px;font-family:var(--mono);font-size:13px;color:var(--text-2)}
.pg button:hover:not(:disabled){background:var(--raised);color:var(--text)}
.pg button[aria-current="true"]{background:var(--accent-12);border-color:var(--accent-34);color:var(--accent-fg);font-weight:700}
.pg button:disabled{opacity:.35;cursor:not-allowed}

/* ---------- empty state ---------- */
.empty{display:grid;gap:var(--s3);justify-items:center;text-align:center;padding:var(--s8) var(--s5);max-width:54ch;margin:0 auto}
.empty h3{font-size:17px}

/* ---------- bars / charts ---------- */
.bars{display:grid;gap:var(--s2)}
.bar-row{display:grid;grid-template-columns:minmax(96px,128px) minmax(0,1fr) auto;gap:var(--s3);align-items:center;width:100%;text-align:left;padding:6px var(--s2);border-radius:6px}
.bar-row:hover{background:var(--raised)}
.bar-track{height:12px;border-radius:var(--r-chip);background:var(--sunken);border:1px solid var(--hairline);overflow:hidden}
.bar-fill{height:100%;border-radius:var(--r-chip);background:var(--data-1)}
.bar-fill.hot{background:var(--accent)}
.stack{display:flex;height:16px;border-radius:var(--r-chip);overflow:hidden;background:var(--sunken);border:1px solid var(--hairline)}
.stack>span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4)}
.legend-i{display:inline-flex;align-items:center;gap:var(--s2);font-size:13.5px;color:var(--text-2)}
.swatch{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid var(--border-strong)}
.chart{width:100%;height:auto}

/* ---------- activity ---------- */
.act{display:grid;gap:2px}
.act-i{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s3);align-items:start;width:100%;text-align:left;padding:var(--s3);border-radius:var(--r-ctl)}
.act-i:hover{background:var(--raised)}
.act-dot{width:8px;height:8px;border-radius:50%;background:var(--data-1);margin-top:8px}
.act-dot.hot{background:var(--accent)}
.act-body{display:grid;gap:2px}
.act-body>*{display:block}

/* ---------- audit timeline ---------- */
.tl-wrap{overflow-x:auto}
.tl{min-width:960px}
.tl-row{display:grid;grid-template-columns:minmax(230px,1.5fr) repeat(12,minmax(46px,1fr));align-items:stretch}
.tl-head{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--border)}
.tl-head>div{padding:9px 6px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:700;text-align:center;border-left:1px solid var(--hairline)}
.tl-head>div:first-child{text-align:left;padding-left:var(--s4);border-left:none}
.tl-head>div.now{color:var(--accent-fg);box-shadow:inset 0 -2px 0 0 var(--accent)}
.tl-body .tl-row{border-bottom:1px solid var(--hairline)}
.tl-body .tl-row:last-child{border-bottom:none}
.tl-body .tl-row:hover{background:var(--raised)}
.tl-lbl{display:grid;gap:2px;padding:10px var(--s3) 10px var(--s4);min-width:0}
.tl-lbl>*{display:block}
.tl-cell{border-left:1px solid var(--hairline);margin:9px 0;display:flex;align-items:center}
.tl-cell.now{border-left:1px dashed var(--accent-62)}
.tl-cell.on{border-left-color:transparent}
.tl-bar{height:26px;width:100%;display:flex;align-items:center;padding-inline:8px;font-family:var(--mono);font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap}
.tl-cell.start .tl-bar{border-radius:6px 0 0 6px}
.tl-cell.end .tl-bar{border-radius:0 6px 6px 0}
.tl-bar.k-closed{background:var(--sunken);border-top:1px solid var(--border);border-bottom:1px solid var(--border);color:var(--text-3)}
.tl-cell.start .tl-bar.k-closed{border-left:1px solid var(--border)}
.tl-cell.end .tl-bar.k-closed{border-right:1px solid var(--border)}
.tl-bar.k-performed{background:var(--data-2);color:var(--on-data-2)}
.tl-bar.k-progress{background:var(--data-1);color:var(--on-data-1)}
.tl-bar.k-scheduled{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);border:1px dashed var(--border-strong);color:var(--text-2)}
.tl-bar.k-overdue{background:var(--accent);color:var(--on-accent)}

/* ---------- split view (PAVOI) ---------- */
.split{display:grid;grid-template-columns:minmax(300px,356px) minmax(0,1fr);gap:var(--s3);align-items:start}
.rec-list{display:grid;gap:2px;max-height:min(68vh,840px);overflow-y:auto;padding:var(--s2)}
.rec{display:grid;gap:var(--s2);width:100%;text-align:left;padding:var(--s3);border-radius:var(--r-ctl);border:1px solid transparent}
.rec:hover{background:var(--raised)}
.rec[aria-current="true"]{background:var(--accent-08);border-color:var(--accent-34)}
.rec-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.meta{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fit,minmax(146px,1fr))}
.meta-i{display:grid;gap:2px}
.meta-i>*{display:block}
.meta-k{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:650}
.meta-v{font-size:15px;color:var(--text)}
.note{display:grid;gap:var(--s2);padding:var(--s3);border-radius:var(--r-ctl);border:1px solid var(--border);background:var(--sunken)}
.note.warn{border-color:var(--accent-34);background:var(--accent-08)}
.note-hd{display:flex;align-items:center;gap:var(--s2);font-size:14px;font-weight:700}
.vt{display:grid}
.vt-i{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s3)}
.vt-rail{display:grid;grid-template-rows:auto 1fr;justify-items:center}
.vt-pip{width:11px;height:11px;border-radius:50%;border:2px solid var(--border-strong);background:var(--bg);margin-top:7px}
.vt-pip.done{background:var(--text-2);border-color:var(--text-2)}
.vt-pip.hot{background:var(--accent);border-color:var(--accent)}
.vt-line{width:1px;background:var(--border);min-height:14px;margin-top:4px}
.vt-i:last-child .vt-line{background:transparent}
.vt-body{display:grid;gap:2px;padding-bottom:var(--s4)}
.vt-body>*{display:block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;padding:0 var(--s4);border-radius:var(--r-ctl);font-size:15px;font-weight:650;border:1px solid var(--border-strong);color:var(--text);transition:background var(--dur-in) var(--ease-out),border-color var(--dur-in) var(--ease-out)}
.btn:hover{background:var(--raised);border-color:var(--text-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-press);border-color:var(--accent-press)}

/* ---------- search overlay ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;opacity:0;pointer-events:none;transition:opacity var(--dur-out) var(--ease-out)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;top:9vh;transform:translate(-50%,-8px);width:min(680px,calc(100vw - 32px));
  z-index:90;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;
  box-shadow:var(--shadow-1);overflow:hidden;
  opacity:0;pointer-events:none;transition:opacity var(--dur-out) var(--ease-out),transform var(--dur-in) var(--ease-out);
}
.sheet.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.sheet-top{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--border)}
#q{flex:1 1 auto;min-width:0;background:none;border:none;color:var(--text);font-size:17px;font-family:inherit;min-height:40px}
#q::placeholder{color:var(--text-3)}
#q:focus{outline:none}
.res{max-height:min(56vh,520px);overflow-y:auto;padding:var(--s2)}
.res-grp{padding:var(--s3) var(--s3) var(--s1)}
.res-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:center;width:100%;text-align:left;padding:var(--s3);border-radius:var(--r-ctl)}
.res-i:hover,.res-i.cursor{background:var(--raised)}
.res-i.cursor{box-shadow:inset 0 0 0 1px var(--accent-34)}
.res-body{display:grid;gap:2px;min-width:0}
.res-body>*{display:block}
mark{background:var(--accent-34);color:var(--on-wash);border-radius:3px;padding:0 1px}

/* ---------- mobile nav ---------- */
.botnav{display:none}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--surface);border-top:1px solid var(--border-strong);border-radius:14px 14px 0 0;padding:var(--s4) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));transform:translateY(101%);transition:transform var(--dur-in) var(--ease-out);max-height:80vh;overflow-y:auto}
.drawer.on{transform:none}
.drawer-hd{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}

/* ---------- toast ---------- */
.toast{position:fixed;right:var(--s5);bottom:var(--s5);z-index:120;max-width:min(380px,calc(100vw - 32px));display:grid;gap:4px;padding:var(--s3) var(--s4);background:var(--raised-2);border:1px solid var(--border-strong);border-left:3px solid var(--accent);border-radius:var(--r-ctl);box-shadow:var(--shadow-2);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity var(--dur-out) var(--ease-out),transform var(--dur-in) var(--ease-out)}
.toast.on{opacity:1;transform:none}
.toast>*{display:block}

/* ---------- rationale page ---------- */
.prose{max-width:84ch;display:grid;gap:var(--s4)}
.prose p{font-size:16px;color:var(--text-2)}
.prose h2{margin-top:var(--s4)}
.prose ul{display:grid;gap:var(--s2)}
.prose li{position:relative;padding-left:18px;font-size:16px;color:var(--text-2)}
.prose li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:50%;background:var(--accent-62)}
.map{width:100%;border-collapse:collapse;font-size:15px}
.map th{text-align:left;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border)}
.map td{padding:10px 12px;border-bottom:1px solid var(--hairline);vertical-align:top}
.map tr:last-child td{border-bottom:none}
.map td:first-child{white-space:nowrap}

/* ============================================================
   RESPONSIVE — 1440 / 1024 / 768 / 375.
   Content reorganises; the page never scales down, never
   scrolls sideways, and zoom is never disabled.
   ============================================================ */
@media (max-width:1279px){
  body:not(.rail-off){--nav-w:72px}
  body:not(.rail-off) .nav-label,
  body:not(.rail-off) .brand-text,
  body:not(.rail-off) .nav-count,
  body:not(.rail-off) .user-meta{display:none}
  body:not(.rail-off) .nav-b{justify-content:center;padding:10px 0}
  body:not(.rail-off) .brand,body:not(.rail-off) .user{justify-content:center}
  body:not(.rail-off) .sb-nav{padding-inline:10px}
  body:not(.rail-off) .nav-b::after{
    content:attr(data-label);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);
    background:var(--raised-2);border:1px solid var(--border-strong);color:var(--text);
    font-size:14px;font-weight:600;white-space:nowrap;padding:6px 10px;border-radius:6px;
    opacity:0;pointer-events:none;z-index:60;transition:opacity var(--dur-out) var(--ease-out);
  }
  body:not(.rail-off) .nav-b:hover::after,body:not(.rail-off) .nav-b:focus-visible::after{opacity:1}
  .split{grid-template-columns:minmax(0,1fr)}
  .rec-list{max-height:360px}
}
@media (max-width:1023px){
  .content{padding:var(--s4)}
  .topbar,.filterbar{padding-inline:var(--s4)}
  .tbl-wrap{max-height:none}
}
@media (max-width:767px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .content{padding:var(--s4) var(--s4) calc(76px + env(safe-area-inset-bottom))}
  .topbar{flex-wrap:wrap;gap:var(--s2);padding-block:var(--s2)}
  .topbar h1{order:3;flex:1 1 100%;font-size:19px}
  .search-b{flex:1 1 auto;max-width:none}
  .stamp,.demo-tag,.rail-toggle{display:none}
  .filterbar{gap:var(--s3)}
  .filterbar select.ctl,.filterbar .msel-b{min-width:0;width:100%}
  .msel-months{min-width:0;width:min(276px,calc(100vw - 2 * var(--s4)))}
  .fb-field{flex:1 1 140px}
  .fb-chips{margin-left:0;flex:1 1 100%}
  .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
  .kpi-val{font-size:clamp(24px,7vw,30px)}

  /* tables reflow into cards — same DOM, no horizontal scroll */
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block}
  .tbl tr{border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface);padding:var(--s3);margin-bottom:var(--s3)}
  .tbl td{border-bottom:none;padding:5px 0;display:grid;grid-template-columns:112px minmax(0,1fr);gap:var(--s3);align-items:center;text-align:left}
  .tbl td::before{content:attr(data-l);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:650}
  .tbl td.t-main{grid-template-columns:minmax(0,1fr);padding-bottom:var(--s2)}
  .tbl td.t-main::before{display:none}
  .tbl td.ar{text-align:left}
  .tbl-wrap{overflow:visible}
  .botnav{
    display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);
  }
  .bn-b{display:grid;justify-items:center;align-content:center;gap:3px;min-height:60px;padding:6px 2px;color:var(--text-3);font-size:11px;font-weight:650}
  .bn-b[aria-current="page"]{color:var(--accent-fg)}
  .bn-b span{display:block;text-align:center;line-height:1.2}
  .toast{left:var(--s4);right:var(--s4);bottom:calc(76px + env(safe-area-inset-bottom));max-width:none}
  .sheet{top:0;left:0;transform:none;width:100vw;border-radius:0;border:none;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}
  .sheet.on{transform:none}
  .res{max-height:none}
  .bar-row{grid-template-columns:minmax(84px,1fr) minmax(0,1.3fr) auto}
  .meta{grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}
/* ---------- beta boot screen (shown until data is ready) ---------- */
.beta-boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg);padding:var(--s4)}
.beta-boot[hidden]{display:none}
.beta-boot-card{max-width:440px;display:grid;gap:var(--s3);text-align:center}
.beta-boot-spin{width:28px;height:28px;margin:0 auto;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:betaspin 1s linear infinite}
.beta-boot.is-error .beta-boot-spin{display:none}
.beta-boot-msg{font-size:18px;font-weight:650;color:var(--text)}
.beta-boot-sub{font-size:14px;color:var(--text-2)}
.beta-boot-link{color:var(--accent-fg);font-weight:650}
@keyframes betaspin{to{transform:rotate(360deg)}}
.beta-guide{max-width:96ch}
.beta-sel{min-width:0;max-width:100%}
.beta-sel select.ctl{min-width:0;width:min(280px,100%);text-overflow:ellipsis}
.tbl.beta-minw{min-width:var(--beta-minw)}
@media (max-width:767px){.tbl.beta-minw{min-width:0}}
.beta-cards{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr))}
.beta-cards > .card, .cols > .card{min-width:0}
.kpi-val.beta-wrap{white-space:normal;font-size:clamp(18px,4.5vw,28px)}
.beta-docs{grid-template-columns:minmax(0,1fr) minmax(0,2.2fr)}
@media (max-width:1100px){.beta-docs{grid-template-columns:minmax(0,1fr)}}
.beta-guide h1,.beta-guide h2,.beta-guide h3{margin:var(--s4) 0 var(--s2)}
.beta-guide p,.beta-guide li{color:var(--text-2);font-size:15px;line-height:1.6}
.beta-guide table{border-collapse:collapse;width:100%;font-size:14px}
.beta-guide th,.beta-guide td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
.beta-guide a{color:var(--accent-fg)}
.beta-guide [style*="background"]{background:transparent !important}
</style>
<script>
/* Resolve the theme before first paint: a stored choice wins, otherwise the
   operating system's. Runs ahead of <body> so the page never flashes the
   wrong ground. */
(function(){
  var t = 'dark';
  try{
    var saved = localStorage.getItem('qa-amo-theme');
    if(saved === 'light' || saved === 'dark') t = saved;
    else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
  }catch(e){}
  document.documentElement.setAttribute('data-theme', t);
})();
</script>

<body>
<a class="skip" href="#main-content">Skip to content</a>

<div class="app">

  <!-- ============ PRIMARY NAV — 7 entries, grouped by task ============ -->

/* ── 1. Sign-in: the same Supabase session as the main dashboard (sessionStorage, per tab) ── */
async function signedInUser(SRC){

  if(DEV) return { full_name:'Local preview', email:'', role: qs.get('role') === 'admin' ? 'admin' : 'viewer' };

/* ── 2. Extraction — same brace scanner as snapshot.mjs (skips strings and comments) ── */
/* A '/' starts a regex literal (not a division) when the last significant character is one of
   these, e.g. `.replace(/'/g, …)` — without this, the quote inside the regex opens a "string". */
const RE_BEFORE = '(,=:[!&|?{};+-*%<>~^';
function skipRegex(t, k){          /* k at the opening '/'; returns index of the closing '/' */
  let cls = false;
  for(let j = k + 1; j < t.length; j++){
    const c = t[j];
    if(c === '\\'){ j++; continue; }
    if(c === '\n') return k;       /* not a regex after all */
    if(cls){ if(c === ']') cls = false; continue; }
    if(c === '[') cls = true; else if(c === '/') return j;
  }
  return k;
}
function scanTo(SRC, i, open, close, stopAtSemicolon){
  let d = 0, q = null, prev = '';
  for(let k = i; k < SRC.length; k++){
    const c = SRC[k], n = SRC[k+1];
    if(q){ if(c === '\\'){ k++; continue; } if(c === q) q = null; continue; }
    if(c === '/' && n === '/'){ k = SRC.indexOf('\n', k); continue; }
    if(c === '/' && n === '*'){ k = SRC.indexOf('*/', k) + 1; continue; }
    if(c === '/' && (prev === '' || RE_BEFORE.includes(prev))){ k = skipRegex(SRC, k); prev = '/'; continue; }
    if(c === "'" || c === '"' || c === '`'){ q = c; prev = c; continue; }
    if(!/\s/.test(c)) prev = c;
    if(open.includes(c)) d++;
    else if(close.includes(c)){ d--; if(!stopAtSemicolon && d === 0) return k + 1; }
    else if(stopAtSemicolon && c === ';' && d === 0) return k + 1;
  }

}
function grabFn(SRC, name){
  const m = SRC.match(new RegExp('^(async )?function ' + name + '\\(', 'm'));
  if(!m) throw new Error('function not found in index.html: ' + name);
  /* skip the parameter list first: a default like `opts={}` (loadData since r165) is not the body */
  const paramsEnd = scanTo(SRC, SRC.indexOf('(', m.index), '(', ')', false);
  return SRC.slice(m.index, scanTo(SRC, SRC.indexOf('{', paramsEnd), '{', '}', false));
}
function grabDecl(SRC, name){
  const m = SRC.match(new RegExp('^(const|let)\\s+' + name + '\\s*=', 'm'));
  if(!m) throw new Error('declaration not found in index.html: ' + name);
  return SRC.slice(m.index, scanTo(SRC, m.index, '([{', ')]}', true));
}
function grabStr(SRC, name){
  const m = SRC.match(new RegExp('^const\\s+' + name + "\\s*=\\s*'([^']*)'", 'm'));
  if(!m) throw new Error('constant not found in index.html: ' + name);
  return m[1];
}
/* Code without comments, so words inside comments do not pull in unrelated names. */
function stripComments(t){
  let out = '', q = null, prev = '';
  for(let k = 0; k < t.length; k++){
    const c = t[k], n = t[k+1];
    if(q){ out += c; if(c === '\\'){ out += t[++k] || ''; continue; } if(c === q) q = null; continue; }
    if(c === '/' && n === '/'){ const e = t.indexOf('\n', k); k = e < 0 ? t.length : e - 1; continue; }
    if(c === '/' && n === '*'){ const e = t.indexOf('*/', k + 2); k = e < 0 ? t.length : e + 1; out += ' '; continue; }
    if(c === '/' && (prev === '' || RE_BEFORE.includes(prev))){ const e = skipRegex(t, k); out += ' '; k = e; prev = '/'; continue; }
    if(c === "'" || c === '"' || c === '`') q = c;
    if(!/\s/.test(c)) prev = c;
    out += c;
  }
  return out;
}
/* Entry points the beta calls. Everything they need is found by following names, so a helper
   added to loadData in a later rev is picked up without editing this file. (A fixed list broke
   at r165, which gave loadData resetLazyStores / lov / bgLoad / fetchCustomFieldRows.) */
const ROOTS = ['loadData','loadCmr','loadEcar','loadKpi7Tasks','kpi7Withdrawn','kpi7Stats','kpi7Rate','kpi7Fmt',
               'dDay','ymd','fetchAll','G_URL','ORG_UNIT_IDS'];
/* Names the beta provides itself (PRELUDE): state it owns, UI it does not draw, and every write
   into the main dashboard's storage. Never extracted, even when referenced. */
const STUBS = new Set(['g','s','setOv','toast','showLoadError','renderAll','cacheSave','renderCmr','renderEcar',
  'kpi7RenderAll','renderPavoi','runSelfChecks','kpi7CacheSave','kpi7CacheLoad','ymHas',
  'idbGet','idbSet','idbDel','idbTx','idbOpen','wfWatermark','cfWatermark','resetLazyStores','updateCacheAge','ageLabel',
  'allData','auditData','cmrData','ecarData','loadFailures','isLoading','cmrLoaded','ecarLoaded',
  'kpi7Loaded','kpi7Busy','kpi7Cnt','kpi7Ver','kpi7Done','pavoiRfiLoaded','pavoiRfiMap','pavoiRfiDone',
  'eisLoaded','eisCAMap','eisDescMap','qcsLoaded','qcsMap','localStorage','sessionStorage']);
/* Main-dashboard functions that draw its own DOM (render*, show*, *Chart…). A loader reached
   through the closure often ends by calling one of them; in the beta that call becomes a no-op,
   because the beta draws its own screens. A name listed in ROOTS is always extracted for real. */
const AUTO_STUB = /^(render|show|open|close|draw|paint|populate|init|toggle|update|set)[A-Z]|Charts?$|Modal$|Panel$/;
/* Every top-level declaration, including the 2nd+ names of `let a = 1, b = 2;` */
function indexSource(SRC){
  const index = {};
  const re = /^(?:(async )?function\s+([A-Za-z_$][\w$]*)\s*\(|(const|let|var)\s+([A-Za-z_$][\w$]*)\s*=)/gm;
  let m;
  while((m = re.exec(SRC))){
    if(m[2]){ if(!(m[2] in index)) index[m[2]] = { pos:m.index, fn:true }; continue; }
    /* A statement the scanner cannot close (e.g. a regex literal holding a quote) is indexed
       under its first name only and grabbed on demand — it fails loudly only if it is needed. */
    let end;
    try{ end = scanTo(SRC, m.index, '([{', ')]}', true); }
    catch(e){ if(!(m[4] in index)) index[m[4]] = { pos:m.index, fn:false, stmt:null }; continue; }
    const stmt = SRC.slice(m.index, end);
    /* names at depth 0 after a comma: `, name =` */
    let d = 0, q = null;
    const names = [m[4]];
    for(let k = 0; k < stmt.length; k++){
      const c = stmt[k], n = stmt[k+1];
      if(q){ if(c === '\\'){ k++; continue; } if(c === q) q = null; continue; }
      if(c === '/' && n === '/'){ const e = stmt.indexOf('\n', k); k = e < 0 ? stmt.length : e; continue; }
      if(c === '/' && n === '*'){ const e = stmt.indexOf('*/', k + 2); k = e < 0 ? stmt.length : e + 1; continue; }
      if(c === "'" || c === '"' || c === '`'){ q = c; continue; }
      if('([{'.includes(c)) d++; else if(')]}'.includes(c)) d--;
      else if(c === ',' && d === 0){ const mm = stmt.slice(k + 1).match(/^\s*([A-Za-z_$][\w$]*)\s*=/); if(mm) names.push(mm[1]); }
    }
    names.forEach(nm => { if(!(nm in index)) index[nm] = { pos:m.index, fn:false, stmt }; });
  }
  return index;
}
function extractClosure(SRC, extraRoots){
  const index = indexSource(SRC);
  /* anything the DRIVER names that exists in index.html is a root too (the screen API) */
  const extra = [...new Set((extraRoots || []).filter(n => index[n]))];
  const take = {}, autoStubs = new Set(), todo = ROOTS.concat(extra);
  while(todo.length){
    const n = todo.pop();
    if(take[n] || STUBS.has(n) || autoStubs.has(n)) continue;
    if(!index[n]) throw new Error('not found in index.html: ' + n);
    if(index[n].fn && AUTO_STUB.test(n) && !ROOTS.includes(n)){ autoStubs.add(n); continue; }
    const code = index[n].fn ? grabFn(SRC, n) : (index[n].stmt || grabDecl(SRC, n));
    take[n] = { pos:index[n].pos, code };
    (stripComments(code).match(/(?<![\w.$])[A-Za-z_$][\w$]*/g) || []).forEach(id => {
      if(index[id] && !take[id] && !STUBS.has(id) && !autoStubs.has(id)) todo.push(id);
    });
  }
  /* source order: a const initialiser may read an earlier const (TDZ otherwise). One
     multi-name statement is emitted once, however many of its names were needed. */
  const names = Object.keys(take).sort((a, b) => take[a].pos - take[b].pos);
  const seen = new Set(), parts = [];
  names.forEach(n => { if(!seen.has(take[n].pos)){ seen.add(take[n].pos); parts.push(take[n].code); } });
  parts.push([...autoStubs].map(n => 'function ' + n + '(){}').join('\n'));
  /* every name the emitted statements declare, so the PRELUDE does not declare it twice */
  const declared = new Set(Object.keys(index).filter(n => !index[n].fn && seen.has(index[n].pos)));
  return { code: parts.join('\n\n'), names, autoStubs: [...autoStubs], declared };
}
/* State the beta owns. Declared in the PRELUDE unless an extracted statement already declares it
   (a `let a = …, b = …` pulled in for `a` also declares `b` — declaring it again is a SyntaxError). */
const STATE = {
  loadFailures:'[]', allData:'[]', auditData:'[]', cmrData:'[]', ecarData:'[]', isLoading:'false',
  cmrLoaded:'false', ecarLoaded:'false', pavoiRfiLoaded:'false', pavoiRfiMap:'{}', pavoiRfiDone:'new Set()',
  kpi7Loaded:'false', kpi7Busy:'false', kpi7Cnt:'{}', kpi7Ver:'{}', kpi7Done:'new Set()',
  eisLoaded:'false', eisCAMap:'{}', eisDescMap:'{}', qcsLoaded:'false', qcsMap:'{}'
};
const stateDecls = declared => Object.keys(STATE).filter(n => !declared.has(n)).map(n => 'let ' + n + ' = ' + STATE[n] + ';').join('\n');
const idents = t => stripComments(t).match(/(?<![\w.$])[A-Za-z_$][\w$]*/g) || [];

/* ── 3. Read the main dashboard's IndexedDB cache — READ ONLY ── */
function readMainStore(SRC, KEY){
  const DB = grabStr(SRC, 'CACHE_DB'), STORE = grabStr(SRC, 'CACHE_STORE');
  return new Promise(res => {
    if(!self.indexedDB) return res(null);
    const rq = indexedDB.open(DB, 1);
    /* DB does not exist yet: create it exactly as idbOpen() in index.html does, so the
       main dashboard's own open(…, 1) later finds the store it expects. */
    rq.onupgradeneeded = () => { if(!rq.result.objectStoreNames.contains(STORE)) rq.result.createObjectStore(STORE); };
    rq.onerror = rq.onblocked = () => res(null);
    rq.onsuccess = () => {
      const db = rq.result;
      try{
        const g = db.transaction(STORE, 'readonly').objectStore(STORE).get(KEY);
        g.onsuccess = () => { db.close(); res(g.result || null); };
        g.onerror   = () => { db.close(); res(null); };
      }catch(e){ db.close(); res(null); }
    };
  });
}

/* ── 4. Stubs: only DOM / overlay / writes are replaced, never logic ── */
const PRELUDE = `
const TOASTS = [], LOAD_ERRORS = [];
const localStorage = { getItem(){ return null; }, setItem(){}, removeItem(){} };
const _el = { textContent: '', style: {}, innerHTML: '', classList: { contains(){ return false; }, add(){}, remove(){} } };
function g(){ return _el; }

function showLoadError(m){ LOAD_ERRORS.push(m); }
function renderAll(){} function cacheSave(){} function renderCmr(){} function renderEcar(){}
function kpi7RenderAll(){} function renderPavoi(){} function runSelfChecks(){}
function kpi7CacheSave(){} function kpi7CacheLoad(){ return false; }

const DRIVER = `

  if(LOAD_ERRORS.length || !allData.length) throw new Error(LOAD_ERRORS.join(' | ') || 'no reports returned');

  if(HOOK.background && loadFailures.length) throw new Error(loadFailures.length + ' source(s) failed');

HOOK.say('Loading CMR-CAR, ECAR and PAVOI verification…', allData.length + ' reports ready');
const VER_URL = G_URL + 'dwanalytics_report_field' +

const pavIds = new Set(allData.filter(r => r.report_title === 'PAVOI').map(r => r.report_id));
const secMap = {};
verRaw.forEach(f => {
  if(!f.section_id || !pavIds.has(f.report_id)) return;
  const s = ((secMap[f.report_id] ||= {})[f.section_id] ||= { date: null, by: null, result: null });
  if(f.field_name === 'Date verified' && f.value_text) s.date = String(f.value_text).slice(0, 10);
  if(f.field_name === 'Verified by (auditor)' && f.value_text) s.by = f.value_text;

function localDay(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

async function run(){
  const t0 = Date.now();
  say('Loading the dashboard code…');
  let SRC;
  try{
    const r = await fetch('index.html', { cache:'no-cache' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    SRC = await r.text();
  }catch(e){ return fail('Could not load the dashboard.', 'index.html: ' + e.message); }
  const REV = grabStr(SRC, 'APP_REV');
  let FB = null; try{ FB = grabStr(SRC, 'FB_URL'); }catch(e){ console.warn('[beta] FB_URL not found:', e.message); }
  /* User Guide: the main dashboard's own static page, with every inline handler removed */
  let HELP = '';
  { const a = SRC.indexOf('<div class="page" id="page-help"');
    const b = a < 0 ? -1 : SRC.indexOf('<div class="page" id=', a + 10);
    if(a >= 0 && b > a) HELP = SRC.slice(SRC.indexOf('>', a) + 1, b)
      .replace(/<script[\s\S]*?<\/script>/gi, '').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi, ''); }

  say('Checking your sign-in…');
  let user;
  try{ user = await signedInUser(SRC); }
  catch(e){ return fail('Could not check your sign-in.', e.message, true); }
  if(!user) return fail('Sign in first.', 'Open the main dashboard in this tab, sign in, then come back to /beta.html. The beta uses the same session.', true);

  let EXTRACTED;
  try{
    const ex = extractClosure(SRC, idents(DRIVER));
    EXTRACTED = stateDecls(ex.declared) + '\n' + ex.code;
    console.log('[beta] extracted ' + ex.names.length + ' names from index.html ' + REV + ':', ex.names.join(', '));
    /* Local preview only: the proxy accepts the site's Origin, so a local relay stands in. */
    if(DEV && qs.get('relay')) EXTRACTED = EXTRACTED.replace(/^const G_URL\s*=\s*'[^']*'/m, "const G_URL = '" + qs.get('relay').replace(/'/g,'') + "'");
  }catch(e){ return fail('The beta does not match this dashboard build.', e.message + ' (index.html ' + REV + ')'); }

  say('Reading cached data…');
  const c = await readMainStore(SRC, grabStr(SRC, 'CACHE_KEY'));
  const cache = c && c.rev === REV && Array.isArray(c.a) && c.a.length ? c : null;
  /* [r165] same rule as cacheLoad(): a same-rev cache older than CACHE_TTL is still shown at
     once, then refreshed in the background. TTL is read from index.html, not copied. */
  let TTL = 4 * 3600e3;
  try{ TTL = new Function(grabDecl(SRC, 'CACHE_TTL') + '\nreturn CACHE_TTL;')(); }catch(e){ console.warn('[beta] CACHE_TTL not read, using 4h:', e.message); }
  const stale = !!cache && Date.now() - cache.ts > TTL;

  /* One extraction, one fresh scope per load: a background refresh cannot see or disturb the
     state of the load that is on screen. */
  const body = PRELUDE + EXTRACTED + '\nreturn (async () => {\n' + DRIVER + '\n})();';
  const load = opts => (new Function('HOOK', body))(Object.assign({
    say, dev: DEV, readStore: k => readMainStore(SRC, k) }, opts));
  const payload = (res, src, ts) => {
    const now = new Date();
    return { asOf: localDay(now), generatedAt: now.toISOString(), appRev: REV, source: src, cacheTs: ts,
      helpHtml: HELP, feedbackUrl: FB,
      user, loadWarnings: res.loadWarnings.concat(res.checks), kpi7: res.kpi7,
      depts: res.depts, reports: res.reports, audits: res.audits };
  };
  const done = (res, how) => {
    if(res.checks.length) console.warn('[beta] cross-check failed:', res.checks);
    if(DEV) window.__betaRaw = Object.assign({ rev: REV }, res.raw);   /* local preview: lets a test seed the cache path */
    console.log('[beta] ' + res.reports.length + ' reports · ' + res.audits.length + ' audits · ' + how +
                ' · ' + ((Date.now() - t0) / 1000).toFixed(1) + 's');
  };

  /* With a cache: paint at once from it (lite pass), then complete CMR-CAR / ECAR / KPI 7 /
     verification rounds in a second pass — from Galileo when the cache is stale (r165), else from
     the same cache. Without a cache: one full load before the first paint, as before. */
  let res;
  try{ res = await load({ cache, lite: !!cache }); }
  catch(e){ console.error('[beta] load failed', e); return fail('Could not load data from Galileo.', e.message); }
  done(res, cache ? (stale ? 'first paint from STALE cache' : 'first paint from cache') : 'from Galileo');

  window.QA_REAL_DATA = payload(res, cache ? 'cache' : 'galileo', cache ? cache.ts : null);
  window.QA_REAL_DATA.partial = res.partial;
  window.BETA_API = res.api;   /* lazy screens call the main dashboard's loaders through this */
  const app = document.createElement('script');
  app.textContent = document.getElementById('beta-app').textContent;
  bootEl.hidden = true;
  document.body.appendChild(app);
  if(!cache) return;

  /* ── second pass ── */
  const tag = document.querySelector('.demo-tag');
  const hours = Math.round((Date.now() - cache.ts) / 3600e3);
  if(tag) tag.textContent = stale ? 'Beta · refreshing…' : 'Beta · loading more…';
  if(stale) toast('Showing data from ' + hours + 'h ago', 'Refreshing from Galileo in the background.');
  let full = null, how = stale ? 'background refresh' : 'completed from cache', note = '';
  try{
    full = await load(stale ? { cache: null, background: true } : { cache });
    /* [r165] a refresh swaps only when every source succeeded */
    if(stale && (full.loadWarnings.length || full.checks.length)) throw new Error(full.loadWarnings.concat(full.checks).join(' · '));
  }catch(e){
    console.warn('[beta] second pass failed:', e);
    full = null;
    if(stale){
      /* keep the cached reports, but still complete CMR-CAR / ECAR / KPI 7 on top of them */
      note = 'Still showing data from ' + hours + 'h ago (' + e.message + ').';
      try{ full = await load({ cache }); how = 'completed from STALE cache'; }catch(e2){ note += ' ' + e2.message; }
    } else note = e.message;
  }
  if(!full){
    window.QA_REAL_DATA.partialError = note || 'loading failed';
    if(tag) tag.textContent = 'Beta · incomplete';
    toast('Some data could not be loaded', note + ' Reload to retry.');
    render();
    return;
  }
  done(full, how);
  /* one object for the whole session: the UI holds REAL by reference */
  Object.assign(window.QA_REAL_DATA, payload(full, how === 'background refresh' ? 'galileo' : 'cache', how === 'background refresh' ? null : cache.ts),
                { partial: false, partialError: null });
  window.BETA_API = full.api;
  betaSwap(window.QA_REAL_DATA);
  if(tag){ tag.textContent = note ? 'Beta · ' + hours + 'h old' : 'Beta';
    tag.title = 'Live Galileo data via index.html ' + REV + ' · ' + how + ' · ' + new Date().toLocaleString(); }
  if(note) toast('Background refresh incomplete', note + ' Reload to retry.');
  else if(stale) toast('Data refreshed', full.reports.length + ' reports from Galileo.');
  if(!note && full.loadWarnings.length) toast('Some data did not load', full.loadWarnings.join(' · '));
}
run();
})();

/* ---- report register ---- */
let SEQ = {};
function reportNumber(code){
  SEQ[code] = (SEQ[code]||0) + 1;
  return code + '-26-' + String(SEQ[code]*7 + 21).padStart(4,'0');
}
function buildReports(){
  const out = [];
  FORMS.forEach(f=>{
    for(let i=0;i<f.n;i++){
      const targetDays = pick([30,45,60,90]);
      const state = weighted([['ontime',32],['late',11],['open',22],['progress',16],['overdue',19]]);
      let raisedOff, closedOff = null;
      if(state==='open' || state==='progress'){ raisedOff = ri(1, targetDays-2); }
      else if(state==='overdue'){ raisedOff = targetDays + ri(2, 110); }
      else if(state==='ontime'){ const c = ri(6, targetDays); raisedOff = c + ri(2, 300); closedOff = raisedOff - c; }
      else { const c = targetDays + ri(2, 70); raisedOff = c + ri(2, 230); closedOff = raisedOff - c; }

      const raised = addDays(TODAY, -raisedOff);
      const target = addDays(raised, targetDays);
      const closed = closedOff === null ? null : addDays(TODAY, -closedOff);
      const owner  = pick(PEOPLE);
      const ac     = rnd() < 0.66 ? pick(FLEET) : null;
      const audit  = pick(AUDIT_TITLES);

      const r = {
        id: f.id + '-' + i,
        form: f.id,
        code: f.code,
        number: reportNumber(f.code),
        auditTitle: audit[0],
        location: audit[1],
        finding: pick(FINDINGS_TEXT),
        owner: owner.n,
        dept: owner.d,
        acReg: ac ? ac.reg : null,
        acType: ac ? ac.t : null,
        raised, target, closed,
        targetDays,
        progress: state === 'progress',
        level: weighted([['Level 1',18],['Level 2',49],['Observation',33]]),
        repetitive: rnd() < 0.16,
        rounds: []
      };

      /* PAVOI records carry verification rounds. KPI 7 in the current
         dashboard counts a PAVOI as assessed once it has at least one. */
      if(f.id === 'pavoi' && rnd() < 0.64){
        const nRounds = weighted([[1,58],[2,29],[3,13]]);
        let cursor = addDays(raised, ri(8, 52));
        for(let k=0;k<nRounds;k++){
          if(cursor > TODAY) break;
          r.rounds.push({
            date: cursor,
            by: pick(PEOPLE).n,
            result: k === nRounds-1 ? weighted([['Satisfactory',62],['Evidence requested',22],['Not satisfactory — re-verify',16]])
                                    : pick(['Evidence requested','Not satisfactory — re-verify'])
          });
          cursor = addDays(cursor, ri(12, 40));
        }
      }
      out.push(r);
    }
  });
  return out;
}
function fromReal(r){
  return Object.assign({}, r, {
    raised: realDay(r.raised), target: realDay(r.target), closed: realDay(r.closed),
    firstVerified: r.form === 'pavoi' ? realDay(r.firstVerified) : undefined,
    rounds: (r.rounds || []).map(v => Object.assign({}, v, { date: realDay(v.date) }))
  });
}

function refLists(depts){

  PEOPLE.length = 0; Object.keys(people).sort().forEach(n => PEOPLE.push({ n, d: people[n] }));
  const regs = new Set(REPORTS.map(r => r.acReg).filter(Boolean));

/* ---- derived report facts ---- */
function semantic(r){
  if(r.closed) return r.closed <= r.target ? 'On-time Closed' : 'Lately Closed';
  if(TODAY > r.target) return 'Overdue';
  return r.progress ? 'In Progress' : 'Open';
}
function daysToDue(r){ return dayDiff(r.target, TODAY); }
function catOf(r){
  if(semantic(r) !== 'Overdue') return null;
  const d = -daysToDue(r);
  return d <= 30 ? 'I' : d <= 60 ? 'II' : 'III';
}
/* Real records carry isClosed from the live status: a Closed report may have no close date. */
function isOpen(r){ return r.isClosed === undefined ? !r.closed : !r.isClosed; }
function assessed(r){ return r.rounds.length > 0; }
/* First verification date. Real data: the live kpi7Ver (earliest Date verified); a round
   can exist without a date, which is null here and must not be graded. */
function firstVerDate(r){ return r.firstVerified !== undefined ? r.firstVerified : (r.rounds[0] ? r.rounds[0].date : null); }
function verifiedIn30(r){
  const f = firstVerDate(r);
  if(!r.rounds.length || !f || !r.raised) return false;
  return dayDiff(f, r.raised) <= 30;
}
if(!REAL) REPORTS.forEach(r=>{ r.status = semantic(r); r.cat = catOf(r); r.dtd = daysToDue(r); });

/* ---- audit programme ---- */
function buildAudits(){
  return AUDIT_TITLES.map((a,i)=>{
    const start = i < 15 ? Math.min(11, Math.floor(i*0.78)) : ri(8,11);
    const span  = weighted([[1,64],[2,28],[3,8]]);
    const end   = Math.min(11, start + span - 1);
    let status;
    if(end < 8) status = weighted([['Closed',72],['Performed',28]]);
    else if(start <= 8 && end >= 8) status = weighted([['In Progress',66],['Performed',34]]);
    else status = 'Scheduled';
    const findings = status === 'Scheduled' ? 0 : ri(0, 11);
    const open     = status === 'Closed' ? 0 : Math.min(findings, ri(0, 5));
    const overdue  = Math.min(open, rnd() < 0.34 ? ri(1,2) : 0);
    return {
      id:'aud-'+i,
      number:'QA-AMO-26-'+String(i*3+7).padStart(3,'0'),
      title:a[0], location:a[1],
      type: /inspection/i.test(a[0]) ? 'Inspection' : 'Audit',
      status, start, end, findings, open, overdue,
      lead: pick(PEOPLE).n
    };
  });
}

/* ---- 12-month series, computed from the register (never invented) ---- */
function monthsBack(n){
  const out = [];
  for(let i=n-1;i>=0;i--){
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth()-i, 1);
    out.push({ y:d.getFullYear(), m:d.getMonth(), label:MONTHS[d.getMonth()], end:new Date(d.getFullYear(), d.getMonth()+1, 0, 23, 59) });
  }
  return out;
}
const SERIES_MONTHS = monthsBack(12);
function seriesFor(rows){
  const raised = [], closed = [], open = [], overdue = [];
  SERIES_MONTHS.forEach(mo=>{
    const start = new Date(mo.y, mo.m, 1);
    raised.push(rows.filter(r=> r.raised >= start && r.raised <= mo.end).length);
    closed.push(rows.filter(r=> r.closed && r.closed >= start && r.closed <= mo.end).length);
    const live = rows.filter(r=> r.raised && r.raised <= mo.end && (r.closed ? r.closed > mo.end : isOpen(r)));
    open.push(live.length);
    overdue.push(live.filter(r=> r.target && r.target < mo.end).length);
  });
  return { raised, closed, open, overdue };
}

/* Period filter = calendar years x calendar months, both multi-select.
   Empty list means "all". Default: the current year, every month. */
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const dataYears = () => [...new Set(REPORTS.filter(r=>r.raised).map(r=>r.raised.getFullYear()))].sort((a,b)=>b-a);

function monthsLabel(ms){
  if(!ms.length) return 'All months';
  const m = [...ms].sort((a,b)=>a-b);
  const run = m.length > 2 && m[m.length-1] - m[0] === m.length - 1;   /* contiguous: Jul–Sep */
  if(run) return MONTHS_SHORT[m[0]]+'–'+MONTHS_SHORT[m[m.length-1]];
  return m.length <= 3 ? m.map(k=>MONTHS_SHORT[k]).join(', ') : m.length+' months';
}
function yearsLabel(ys){
  if(!ys.length) return 'All years';
  return [...ys].sort((a,b)=>a-b).join(', ');
}
function periodLabel(){
  const f = state.filters;
  return (f.months.length ? monthsLabel(f.months)+' · ' : '') + yearsLabel(f.years);
}

function applyFilters(rows){
  const f = state.filters;
  return rows.filter(r=>{
    /* a report with no raised date cannot be placed in a period: it only shows with no period filter */
    if((f.years.length || f.months.length) && !r.raised) return false;
    if(f.years.length && !f.years.includes(r.raised.getFullYear())) return false;
    if(f.months.length && !f.months.includes(r.raised.getMonth())) return false;
    if(f.dept && r.dept !== f.dept) return false;

  });

/* ---- routing: real hash routes, so Back and deep links behave ---- */
let pendingId = null;
function go(screen, tab, opts){
  opts = opts || {};
  if(opts.dept !== undefined) state.filters.dept = opts.dept;
  if(opts.years !== undefined)  state.filters.years  = opts.years;
  if(opts.months !== undefined) state.filters.months = opts.months;
  state.rowQuery = opts.q !== undefined ? opts.q : (opts.keepQuery ? state.rowQuery : '');
  if(opts.id) pendingId = opts.id;
  const t = tab || state.tab[screen];
  const next = '#/' + screen + (t ? '/' + t : '');
  if(location.hash === next) route();   /* same route, filters changed */
  else location.hash = next;            /* hashchange drives the render */
}
function route(){
  const parts = location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  let screen = parts[0] || 'overview';
  if(screen !== 'rationale' && !NAV_BY_ID[screen]) screen = 'overview';
  const nav = NAV_BY_ID[screen];
  let tab = parts[1];
  if(nav && nav.tabs){
    if(!nav.tabs.some(t=>t.id===tab)) tab = state.tab[screen] || nav.tabs[0].id;
    state.tab[screen] = tab;

/* 'Closed' = live semCalc's verdict for a closed report with no target or no close date,
   so timeliness cannot be graded. It is real, so it gets a chip rather than vanishing. */
const SCLASS = {'Open':'s-open','In Progress':'s-progress','On-time Closed':'s-ontime','Lately Closed':'s-late','Overdue':'s-overdue','Closed':'s-ontime'};
/* Status is carried by shape + label + luminance — never by hue alone.
   Red is spent only on breach (Overdue) and on CAT severity. */
const MARK = {
  'Open':'<circle cx="6" cy="6" r="4.2"/>',
  'In Progress':'<circle cx="6" cy="6" r="4.2"/><path d="M6 1.8a4.2 4.2 0 0 1 0 8.4z" fill="currentColor" stroke="none"/>',
  'On-time Closed':'<path d="M2.1 6.3l2.7 2.7L10 3.3"/>',
  'Closed':'<path d="M2.1 6.3l2.7 2.7L10 3.3"/><path d="M1.5 10.5h9"/>',
  'Lately Closed':'<circle cx="6" cy="6" r="4.2"/><path d="M6 3.5V6l1.9 1.2"/>',
  'Overdue':'<path d="M6 1.5L11.2 10.5H0.8z"/><path d="M6 5.1v2"/><path d="M6 8.7h.01"/>'
};
function mark(s){
  return '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(MARK[s]||'')+'</svg>';
}
function chip(s){ return '<span class="chip '+(SCLASS[s]||'s-neutral')+'">'+mark(s)+esc(s)+'</span>'; }
function catChip(c){ return c ? '<span class="cat c'+({'I':1,'II':2,'III':3}[c])+'">CAT '+c+'</span>' : '<span class="dim">—</span>'; }
function dueCell(r){
  if(r.closed) return '<span class="num dim">'+fmtShort(r.closed)+'</span>';
  if(!isOpen(r)) return '<span class="dim od-nowrap">closed · no date</span>';
  const d = r.dtd;
  if(d === null || d === undefined) return '<span class="dim od-nowrap">no target</span>';
  if(d < 0)  return '<span class="num red strong od-nowrap">'+Math.abs(d)+'d over</span>';
  if(d <= 7) return '<span class="num strong od-nowrap">'+d+'d left</span>';
  return '<span class="num dim od-nowrap">'+d+'d left</span>';
}

/* ---- hand-drawn charts: sparkline, line pair, donut, stacked bar ---- */
function spark(vals, hot){
  if(!vals.length) return '';
  const w = 120, h = 30, min = Math.min(...vals), max = Math.max(...vals), rng = (max-min) || 1;
  const pts = vals.map((v,i)=>[ (i/(vals.length-1))*w, h - ((v-min)/rng)*(h-6) - 3 ]);
  const line = 'M' + pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');
  const area = line + ' L '+w+' '+h+' L 0 '+h+' Z';
  const col  = hot ? 'var(--accent)' : 'var(--text-2)';
  const last = pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="12-month trend">'
    + '<path d="'+area+'" fill="'+col+'" opacity=".13"/>'
    + '<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
    + '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.4" fill="'+col+'"/></svg>';
}
function trendTag(now, prev, goodDir, unit){
  if(prev === null || prev === undefined) return '';
  const d = now - prev;
  if(Math.abs(d) < 0.5) return '<span class="trend flat">'+ic('more',13)+' no change</span>';
  const up  = d > 0;
  const good = goodDir === 'up' ? up : !up;
  const val = (up?'+':'−') + Math.abs(Math.round(d*10)/10) + (unit||'');
  return '<span class="trend '+(good?'good':'bad')+'">'+ic(up?'arrowUp':'arrowDown',13)+val+'</span>';
}
function linePair(a, b, labels){
  const W = 640, H = 210, L = 34, R = 10, T = 14, B = 30;
  const max = Math.max(4, ...a, ...b), iw = W-L-R, ih = H-T-B;
  const x = i => L + (i/(labels.length-1))*iw;
  const y = v => T + ih - (v/max)*ih;
  const path = arr => 'M' + arr.map((v,i)=>x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' L ');
  let grid = '', ticks = '';
  for(let g=0; g<=3; g++){
    const gv = Math.round(max*g/3), gy = y(gv);
    grid  += '<line x1="'+L+'" y1="'+gy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+gy.toFixed(1)+'" stroke="var(--hairline)" stroke-width="1"/>';
    ticks += '<text x="'+(L-8)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end" font-size="11" font-family="ui-monospace,monospace" fill="var(--text-3)">'+gv+'</text>';
  }
  const xlab = labels.map((l,i)=> '<text x="'+x(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--text-3)">'+l+'</text>').join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Findings raised versus closed over the last twelve months">'
    + grid + ticks + xlab
    + '<path d="'+path(b)+'" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/>'
    + '<path d="'+path(a)+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'
    + a.map((v,i)=>'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="2.6" fill="var(--accent)"/>').join('')
    + '</svg>';
}
function donut(parts){
  const total = parts.reduce((s,p)=>s+p.v,0) || 1;
  const R = 54, C = 2*Math.PI*R;
  let off = 0;
  const segs = parts.map(p=>{
    const len = (p.v/total)*C;
    const s = '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+p.c+'" stroke-width="18" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 70 70)"/>';
    off += len; return s;
  }).join('');
  return '<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Status mix"><circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--hairline)" stroke-width="18"/>'+segs
    + '<text x="70" y="66" text-anchor="middle" font-size="26" font-weight="700" font-family="ui-monospace,monospace" fill="var(--text)">'+total+'</text>'
    + '<text x="70" y="86" text-anchor="middle" font-size="11" letter-spacing="1.2" fill="var(--text-3)">IN SCOPE</text></svg>';
}
