function pct(a,b){ return b ? Math.round(a/b*1000)/10 : 0; }
function kpiTile(o){
  return '<button class="kpi'+(o.alarm?' alarm':'')+'" type="button" data-go="'+o.go+'" data-tab="'+(o.tab||'')+'"'
    + ' aria-label="'+esc(o.label+': '+o.value+'. '+o.note)+'">'
    + '<span class="kpi-lbl">'+esc(o.label)+'</span>'
    + '<span class="kpi-val od-nowrap">'+esc(o.value)+'</span>'
    + '<span class="kpi-foot">'+(o.trend||'')+'<span class="kpi-note">'+esc(o.note)+'</span></span>'
    + spark(o.series, !!o.alarm) + '</button>';
}
function renderOverview(){
  const rows = scoped();
  const s = seriesFor(rows);
  const open = rows.filter(isOpen);
  const overdue = rows.filter(r=>r.status==='Overdue');
  const closedRows = rows.filter(r=>r.closed && r.raised);
  const onTime = closedRows.filter(r=>r.status==='On-time Closed').length;
  const rate = pct(onTime, closedRows.length);
  const avgClose = closedRows.length ? Math.round(closedRows.reduce((t,r)=>t+dayDiff(r.closed,r.raised),0)/closedRows.length) : 0;
  const mcar = rows.filter(r=>r.form==='mcar').length;
  const amo  = rows.filter(r=>r.form==='amoecar').length;
  /* KPI 7 excludes PAVOI currently Withdrawn from both numerator and denominator (live r152). */
  const pav  = rows.filter(r=>r.form==='pavoi' && !r.withdrawn);
  const pavAssessed = pav.filter(assessed).length;

  /* monthly series for the rate-style KPIs, computed the same way as the headline */
  const rateSeries = SERIES_MONTHS.map(mo=>{
    const st = new Date(mo.y,mo.m,1);
    const c = rows.filter(r=>r.closed && r.closed>=st && r.closed<=mo.end);
    return c.length ? pct(c.filter(r=>r.status==='On-time Closed').length, c.length) : 0;
  });
  const closeSeries = SERIES_MONTHS.map(mo=>{
    const st = new Date(mo.y,mo.m,1);
    const c = rows.filter(r=>r.closed && r.closed>=st && r.closed<=mo.end);
    return c.length ? Math.round(c.reduce((t,r)=>t+dayDiff(r.closed,r.raised),0)/c.length) : 0;
  });
  const k2Series = SERIES_MONTHS.map(mo=>{
    const a = rows.filter(r=>r.form==='mcar' && r.raised && r.raised<=mo.end).length;
    const b = rows.filter(r=>r.form==='amoecar' && r.raised && r.raised<=mo.end).length;
    return pct(a,b);
  });
  const k7Series = SERIES_MONTHS.map(mo=>{
    const p = rows.filter(r=>r.form==='pavoi' && !r.withdrawn && r.raised && r.raised<=mo.end);
    return pct(p.filter(assessed).length, p.length);
  });

  const tiles = [
    kpiTile({label:'Open findings', value:String(open.length), note:REAL ? 'across every report type' : 'across all five forms', go:'work', tab:'open',
             series:s.open, trend:trendTag(s.open[11], s.open[10], 'down','')}),
    kpiTile({label:'Overdue', value:String(overdue.length), note:'past target date', go:'work', tab:'overdue',
             series:s.overdue, alarm:overdue.length>0, trend:trendTag(s.overdue[11], s.overdue[10], 'down','')}),
    kpiTile({label:'On-time closure', value:rate+'%', note:'target ≥ 70%', go:'analytics', tab:'kpi',
             series:rateSeries, alarm:rate<70, trend:trendTag(rateSeries[11], rateSeries[10], 'up','pt')}),
    kpiTile({label:'Avg days to close', value:String(avgClose), note:'raised to closed', go:'analytics', tab:'kpi',
             series:closeSeries, trend:trendTag(closeSeries[11], closeSeries[10], 'down','d')}),
    /* Same formula as the main dashboard's KPI 2 card on KPI Charts (buildKPI2 5257–5259):
       MCAR count ÷ AMO-ECAR count in the period. The early-detection rate is its own screen. */
    kpiTile({label:'KPI 2 · MCAR ÷ AMO-ECAR', value:pct(mcar,amo)+'%', note:mcar+' MCAR ÷ '+amo+' AMO-ECAR', go:'analytics', tab:'kpi',
             series:k2Series, trend:trendTag(k2Series[11], k2Series[10], 'up','pt')}),
    (REAL && REAL.partial)
      ? kpiTile({label:'KPI 7 · PAVOI assessed', value:'—', note:REAL.partialError ? 'verification rounds not loaded' : 'loading verification rounds…', go:'findings', tab:'pavoi', series:[]}) :
    kpiTile({label:'KPI 7 · PAVOI assessed', value:pct(pavAssessed, pav.length)+'%', note:pavAssessed+' of '+pav.length+' verified', go:'findings', tab:'pavoi',
             series:k7Series, alarm:pct(pavAssessed,pav.length)<70, trend:trendTag(k7Series[11], k7Series[10], 'up','pt')})
  ].join('');

  /* ---- overdue at a glance ---- */
  const cats = ['I','II','III'].map(c=>({ c, n:overdue.filter(r=>r.cat===c).length }));
  const catTotal = overdue.length || 1;
  const stack = cats.map((x,i)=>'<span style="width:'+(x.n/catTotal*100)+'%;background:'+['var(--accent-28)','var(--accent-62)','var(--accent)'][i]+'"></span>').join('');
  const catRows = cats.map((x,i)=>
    '<button class="bar-row" type="button" data-go="work" data-tab="overdue" data-cat="'+x.c+'">'
    + '<span class="od-row" style="--od-gap:8px">'+catChip(x.c)+'</span>'
    + '<span class="bar-track"><span class="bar-fill'+(i===2?' hot':'')+'" style="width:'+(catTotal?x.n/catTotal*100:0)+'%;background:'+['var(--accent-28)','var(--accent-62)','var(--accent)'][i]+'"></span></span>'
    + '<span class="num strong od-nowrap">'+x.n+'</span></button>').join('');
  const oldest = overdue.slice().sort((a,b)=>a.dtd-b.dtd).slice(0,3).map(r=>
    '<button class="act-i" type="button" data-go="findings" data-tab="'+r.form+'" data-id="'+r.id+'">'
    + '<span class="act-dot hot"></span>'
    + '<span class="act-body"><span class="row-id">'+esc(r.number)+'</span>'
    + '<span class="row-sub od-truncate">'+esc(r.auditTitle)+' · '+esc(r.owner)+'</span></span>'
    + '<span class="num red strong od-nowrap">'+Math.abs(r.dtd)+'d</span></button>').join('');

  /* ---- open by form type ---- */
  const byForm = FORMS.map(f=>({ f, n: open.filter(r=>r.form===f.id).length }));
  if(REAL) byForm.push({ f:{ id:'all', code:'Other forms' }, n: open.filter(r=>r.form==='other').length });
  const maxForm = Math.max(1, ...byForm.map(x=>x.n));
  const formBars = byForm.map(x=>
    '<button class="bar-row" type="button" data-go="findings" data-tab="'+x.f.id+'">'
    + '<span class="mono strong">'+esc(x.f.code)+'</span>'
    + '<span class="bar-track"><span class="bar-fill" style="width:'+(x.n/maxForm*100)+'%"></span></span>'
    + '<span class="num strong od-nowrap">'+x.n+'</span></button>').join('');

  /* ---- status mix ---- */
  const mixDefs = [
    ['Open','var(--data-1)'], ['In Progress','var(--data-2)'], ['Overdue','var(--accent)'],
    ['On-time Closed','var(--text-3)'], ['Lately Closed','var(--data-3)'], ['Closed','var(--hairline)']
  ].filter(m => m[0] !== 'In Progress' || !REAL);   /* live status has no In Progress */
  const mix = mixDefs.map(m=>({ k:m[0], c:m[1], v:rows.filter(r=>r.status===m[0]).length }));

  /* ---- recent activity, derived from the register ---- */
  const acts = [];
  rows.forEach(r=>{
    acts.push({ t:r.raised, hot:false, txt:'raised', r });
    if(r.closed) acts.push({ t:r.closed, hot:false, txt:'closed '+(r.status==='On-time Closed'?'on time':'late'), r });
    r.rounds.forEach(v=> { if(v.date) acts.push({ t:v.date, hot:v.result!=='Satisfactory', txt:'verification — '+v.result.toLowerCase(), r }); });
  });
  overdue.forEach(r=> { if(r.target) acts.push({ t:r.target, hot:true, txt:'passed its target date', r }); });
  const feed = acts.filter(a=>a.t<=TODAY).sort((a,b)=>b.t-a.t).slice(0,9).map(a=>{
    const d = dayDiff(TODAY, a.t);
    const when = d === 0 ? 'today' : d === 1 ? 'yesterday' : d < 30 ? d+'d ago' : fmtShort(a.t);
    return '<button class="act-i" type="button" data-go="findings" data-tab="'+a.r.form+'" data-id="'+a.r.id+'">'
      + '<span class="act-dot'+(a.hot?' hot':'')+'"></span>'
      + '<span class="act-body"><span class="row-id">'+esc(a.r.number)+' <span class="dim" style="font-weight:400">'+esc(a.txt)+'</span></span>'
      + '<span class="row-sub od-truncate">'+esc(a.r.auditTitle)+'</span></span>'
      + '<span class="num dim od-nowrap">'+when+'</span></button>';
  }).join('');

  const liveAudits = AUDITS.filter(a=>a.status==='In Progress').length;
  const sched = AUDITS.filter(a=>a.status==='Scheduled').length;

  return '<section class="sec">'
    + '<div class="sec-head"><h2>Right now</h2><span class="t-small dim">'+esc(periodLabel())
    + (state.filters.dept?' · '+esc(state.filters.dept):'')
    + ' · every tile opens the list behind it</span></div>'
    + '<div class="kpi-grid">'+tiles+'</div></section>'

    + '<section class="sec cols cols-32">'
    + '<div class="card"><div class="card-head"><h2>Overdue at a glance</h2>'
    + '<span class="t-small dim od-fill">'+overdue.length+' past target · CAT follows the current 30 / 60-day bands</span></div>'
    + '<div class="card-pad" style="display:grid;gap:16px">'
    + (overdue.length ? '<div class="stack" role="img" aria-label="Overdue split by CAT band">'+stack+'</div><div class="bars">'+catRows+'</div>'
        + '<div style="display:grid;gap:6px"><span class="t-micro">Longest running</span>'+oldest+'</div>'
        : '<div class="empty"><h3>Nothing overdue in this range</h3><p class="t-sub">Every finding raised in the selected period is still inside its target date.</p></div>')
    + '</div></div>'
    + '<div class="card"><div class="card-head"><h2>Open by form type</h2></div>'
    + '<div class="card-pad" style="display:grid;gap:16px">'
    + '<div class="bars">'+formBars+'</div>'
    + '<div class="od-row" style="--od-gap:20px;flex-wrap:wrap">'+donut(mix)
    + '<div class="legend" style="flex-direction:column;gap:8px">'
    + mix.map(m=>'<span class="legend-i"><span class="swatch" style="background:'+m.c+'"></span>'+esc(m.k)+' <span class="num strong">'+m.v+'</span></span>').join('')
    + '</div></div></div></div></section>'

    + '<section class="sec cols cols-2">'
    + '<div class="card"><div class="card-head"><h2>Raised vs closed</h2><span class="t-small dim">last 12 months</span></div>'
    + '<div class="card-pad" style="display:grid;gap:12px">'+linePair(s.raised, s.closed, SERIES_MONTHS.map(m=>m.label))
    + '<div class="legend"><span class="legend-i"><span class="swatch" style="background:var(--accent);border-color:var(--accent)"></span>Raised</span>'
    + '<span class="legend-i"><span class="swatch" style="background:repeating-linear-gradient(90deg,var(--text-2) 0 4px,transparent 4px 7px)"></span>Closed</span>'
    + '<span class="legend-i dim">'+liveAudits+' audits running · '+sched+' scheduled</span></div></div></div>'
    + '<div class="card"><div class="card-head"><h2>Recent activity</h2><span class="t-small dim">newest first</span></div>'
    + '<div class="card-pad"><div class="act">'+(feed || '<p class="t-sub dim">No activity in this range.</p>')+'</div></div></div>'
    + '</section>';
}

/* ==========================================================================

const PAGE_SIZE = 12;

const COL = {

  owner:{ l:'Owner', v:r=>r.owner, c:r=>'<span class="od-truncate">'+esc(r.owner)+'</span>' },

  raised:{ l:'Raised', v:r=>r.raised ? r.raised.getTime() : 0, c:r=>'<span class="num dim od-nowrap">'+fmtShort(r.raised)+'</span>' },

const LANES = {
  'work/open':    { cols:['number','form','status','owner','raised','target','dtd','level'],
                    rows:rs=>rs.filter(isOpen), title:'Open reports', lead:'Everything still to be actioned, newest target first.' },
  'work/overdue': { cols:['number','form','cat','dtd','owner','dept','target','level'],
                    rows:rs=>rs.filter(r=>r.status==='Overdue'), title:'Overdue', lead:'Past the target date. CAT bands follow the existing 30 and 60-day rule.' },
  'work/verify':  { cols:['number','status','owner','raised','verified','dtd'],
                    rows:rs=>rs.filter(r=>r.form==='pavoi' && isOpen(r) && !assessed(r)),
                    title:'Awaiting verification', lead:'Open PAVOI with no verification round yet — the numerator KPI 7 is missing.' },
  'findings/all':     { cols:['number','form','status','owner','aircraft','raised','dtd','cat'], rows:rs=>rs },
  'findings/cmrcar':  { cols:['number','aircraft','status','dept','raised','target','dtd'], rows:rs=>rs.filter(r=>r.form==='cmrcar') },
  'findings/ecar':    { cols:['number','aircraft','status','finding','raised','dtd'], rows:rs=>rs.filter(r=>r.form==='ecar') },
  'findings/amoecar': { cols:['number','status','raised','target','dtd','cat','audit'], rows:rs=>rs.filter(r=>r.form==='amoecar') },
  'findings/mcar':    { cols:['number','status','raised','owner','target','dtd','cat','repetitive'], rows:rs=>rs.filter(r=>r.form==='mcar') }
};

function sortRows(rows, key){
  const st = state.sort[key];
  if(!st) return rows.slice().sort((a,b)=>{
    const ao = isOpen(a)?0:1, bo = isOpen(b)?0:1;
    if(ao!==bo) return ao-bo;
    return a.dtd - b.dtd;
  });
  const col = COL[st.k];
  return rows.slice().sort((a,b)=>{
    const av = col.v(a), bv = col.v(b);
    const r = av < bv ? -1 : av > bv ? 1 : 0;
    return st.dir === 'asc' ? r : -r;
  });
}
function tableHTML(key, cfg, rows){
  const st = state.sort[key];
  const head = cfg.cols.map(c=>{
    const col = COL[c], on = st && st.k === c;
    const icName = on ? (st.dir==='asc'?'sortUp':'sortDown') : 'sortNone';
    return '<th scope="col"'+(on?' aria-sort="'+(st.dir==='asc'?'ascending':'descending')+'"':'')+(col.ar?' class="ar"':'')+'>'
      + '<button type="button" data-act="sort" data-key="'+key+'" data-col="'+c+'">'+esc(col.l)+ic(icName,13,'sort-ic')+'</button></th>';
  }).join('');

  const sorted = sortRows(rows, key);
  const pages = Math.max(1, Math.ceil(sorted.length/PAGE_SIZE));
  let p = Math.min(state.page[key]||1, pages);
  const slice = sorted.slice((p-1)*PAGE_SIZE, p*PAGE_SIZE);

  const body = slice.map(r=>'<tr tabindex="0" data-go="findings" data-tab="'+(r.form==='other'?'all':r.form)+'" data-id="'+r.id+'">'
    + cfg.cols.map(c=>{
        const col = COL[c];
        return '<td data-l="'+esc(col.l)+'"'+(col.main?' class="t-main"':(col.ar?' class="ar"':''))+'>'+col.c(r)+'</td>';
      }).join('') + '</tr>').join('');

  let pager = '';
  if(pages > 1){
    const btns = [];
    btns.push('<button type="button" data-act="page" data-key="'+key+'" data-p="'+(p-1)+'"'+(p===1?' disabled':'')+' aria-label="Previous page">'+ic('chevron',14,'')+'</button>');
    for(let i=1;i<=pages;i++){
      if(pages > 7 && i>2 && i<pages-1 && Math.abs(i-p)>1){ if(i===3) btns.push('<button type="button" disabled>…</button>'); continue; }
      btns.push('<button type="button" data-act="page" data-key="'+key+'" data-p="'+i+'"'+(i===p?' aria-current="true"':'')+'>'+i+'</button>');
    }
    btns.push('<button type="button" data-act="page" data-key="'+key+'" data-p="'+(p+1)+'"'+(p===pages?' disabled':'')+' aria-label="Next page">'+ic('chevron',14,'')+'</button>');
    pager = '<div class="pg">'+btns.join('')+'</div>';
  }

  if(!sorted.length) return emptyState();

  return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>'
    + '<div class="tbl-foot"><span class="t-small dim">Showing '+((p-1)*PAGE_SIZE+1)+'–'+Math.min(p*PAGE_SIZE, sorted.length)+' of '+sorted.length+'</span>'+pager+'</div>';
}
function emptyState(){

function renderLane(screen, tab){
  const key = screen+'/'+tab;
  const cfg = LANES[key];
  const nav = NAV_BY_ID[screen];
  const tabDef = nav.tabs.find(t=>t.id===tab);

  if(screen === 'findings' && tab === 'pavoi') return renderPavoi();
  if(!cfg) return placeholder(nav, tabDef);

  let rows = cfg.rows(scoped());
  if(state.cat) rows = rows.filter(r=>r.cat === state.cat);

    ? (form.desc ? form.desc + '.' : 'Register of ' + form.code + ' records.') + ' Columns follow what this form actually carries.'

   ========================================================================== */
function renderPavoi(){
  const rows = scoped().filter(r=>r.form==='pavoi')
    .sort((a,b)=>{ const ao=isOpen(a)?0:1, bo=isOpen(b)?0:1; return ao-bo || a.dtd-b.dtd; });
  if(!rows.length) return '<section class="sec"><div class="card">'+emptyState()+'</div></section>';

  if(!state.sel.pavoi || !rows.some(r=>r.id===state.sel.pavoi)) state.sel.pavoi = rows[0].id;
  const r = rows.find(x=>x.id===state.sel.pavoi);

  const kpiRows = rows.filter(x=>!x.withdrawn);
  const total = kpiRows.length, done = kpiRows.filter(assessed).length, wd = rows.length - kpiRows.length;
  const list = rows.map(x=>
    '<button class="rec" type="button" data-act="selpavoi" data-id="'+x.id+'"'+(x.id===r.id?' aria-current="true"':'')+'>'
    + '<span class="rec-top"><span class="row-id">'+esc(x.number)+'</span>'+(x.withdrawn?'<span class="tag">Withdrawn</span>':'')+chip(x.status)+'</span>'
    + '<span class="row-sub od-truncate">'+esc(x.auditTitle)+'</span>'
    + '<span class="od-row" style="--od-gap:8px">'
      + (assessed(x) ? '<span class="tag">'+x.rounds.length+' round'+(x.rounds.length>1?'s':'')+'</span>'
                     : '<span class="cat c1">Not assessed</span>')
      + (x.closed ? '' : '<span class="t-small dim od-nowrap">'+(x.dtd<0 ? Math.abs(x.dtd)+'d over' : x.dtd+'d left')+'</span>')
    + '</span></button>').join('');

  const fv = firstVerDate(r);
  const sinceIssue = dayDiff(TODAY, r.raised);
  const flag = r.withdrawn
    ? { cls:'warn', t:'Withdrawn — outside KPI 7',
        b:'This PAVOI has a Withdrawn stage and no completed accept/reject stage, so it is excluded from both the numerator and the denominator until it is closed properly.' }
    : !assessed(r)
    ? { cls:'warn', t:'No verification round recorded',
        b: sinceIssue > 30
          ? 'This PAVOI counts against KPI 7. The 30-day rule agreed on 07 Sep 2026 expired '+(sinceIssue-30)+' days ago.'
          : 'This PAVOI counts against KPI 7 until a round is recorded. '+(30-sinceIssue)+' days remain inside the 30-day window.' }
    : !fv
      ? { cls:'warn', t:'Verification round recorded without a date',
          b:'A round exists, so the record counts as assessed for KPI 7, but Date verified is empty — the 30-day window cannot be checked.' }
    : verifiedIn30(r)
      ? { cls:'', t:'First verification inside 30 days',
          b:'Verified '+dayDiff(fv, r.raised)+' days after issue, within the agreed window.' }
      : { cls:'warn', t:'First verification after the 30-day window',
          b:'Verified '+dayDiff(fv, r.raised)+' days after issue. The record still counts as assessed for KPI 7 — the flag is advisory only.' };

  const rounds = r.rounds.length ? r.rounds.map((v,i)=>
    '<div class="vt-i"><div class="vt-rail"><span class="vt-pip '+(v.result==='Satisfactory'?'done':'hot')+'"></span><span class="vt-line"></span></div>'
    + '<div class="vt-body"><span class="strong">Round '+(i+1)+' · '+esc(v.result)+'</span>'
    + '<span class="t-small dim">'+fmtDate(v.date)+' · '+esc(v.by)+'</span></div></div>').join('')
    : '<p class="t-sub dim">No verification round has been recorded against this report yet.</p>';

  const meta = [
    ['Form','PAVOI'], ['Status', null], ['Owner section', r.dept], ['Owner', r.owner],
    ['Raised', fmtDate(r.raised)], ['Target', fmtDate(r.target)],
    ['Days to due', r.closed ? 'closed '+fmtDate(r.closed) : (r.dtd<0 ? Math.abs(r.dtd)+' days over' : r.dtd+' days left')],
    ['Aircraft', r.acReg ? r.acReg+(r.acType?' · '+r.acType:'') : (REAL ? '—' : 'Fleet-wide')],
    ['Finding level', r.level], ['Audit', r.auditTitle+' · '+r.location]
  ].map(m=>'<div class="meta-i"><span class="meta-k">'+esc(m[0])+'</span>'
    + (m[1]===null ? '<span class="meta-v">'+chip(r.status)+'</span>' : '<span class="meta-v od-truncate">'+esc(m[1])+'</span>')+'</div>').join('');

  return '<section class="sec"><div class="split">'
    + '<div class="card"><div class="card-head"><h2>PAVOI register</h2>'
      + '<span class="t-small dim od-fill">'+done+' of '+total+' assessed'+(wd?' · '+wd+' withdrawn excluded':'')+'</span></div>'
      + '<div class="rec-list">'+list+'</div></div>'
    + '<div class="card"><div class="card-head">'
      + '<h2 class="mono">'+esc(r.number)+'</h2>'+chip(r.status)
      + (r.repetitive?'<span class="cat c1">Repeat finding</span>':'')
      + '<span class="od-fill"></span>'
      + '<button class="btn" type="button" data-act="toast" data-t="Verification requested" data-b="A request for verification would be raised against '+esc(r.number)+' in Coruson. This prototype records the intent only.">Request verification</button>'
      + '<button class="btn primary" type="button" data-act="toast" data-t="Opens in Coruson" data-b="The live dashboard deep-links to the source record. Nothing is sent from this prototype.">Open source record</button>'
      + '</div>'
      + '<div class="card-pad" style="display:grid;gap:24px">'
      + '<div class="meta">'+meta+'</div>'
      + '<div class="note '+flag.cls+'"><span class="note-hd">'+(flag.cls?ic('alert',16):ic('check',16))+esc(flag.t)+'</span>'
        + '<span class="t-small">'+esc(flag.b)+'</span></div>'
      + '<div style="display:grid;gap:8px"><span class="t-micro">Finding</span><p class="t-sub">'+esc(r.finding)+'</p></div>'
      + '<div style="display:grid;gap:12px"><span class="t-micro">Verification history</span><div class="vt">'+rounds+'</div></div>'
      + '</div></div></div></section>';
}

const AUD_KIND = {'Closed':'k-closed','Performed':'k-performed','In Progress':'k-progress','Scheduled':'k-scheduled','Cancelled':'k-closed'};
function renderAudit(tab){
  if(tab === 'list') return renderAuditList();

  const now = TODAY.getMonth();

    + '<span class="legend-i"><span class="swatch" style="background:var(--sunken)"></span>Closed</span>'
    + '<span class="legend-i"><span class="swatch" style="background:var(--accent);border-color:var(--accent)"></span>Has overdue findings</span>'
    + '<span class="legend-i dim">'+MONTHS[now]+' is the current month</span></div></div>'
    + '<div class="tl-wrap"><div class="tl">'+head+'<div class="tl-body">'+body+'</div></div></div>'

let searchCursor = -1, searchHits = [];
function openSearch(){

function hl(text, q){
  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  if(i < 0) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i,i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
}
function runSearch(){
  const q = $('#q').value.trim().toLowerCase();
  searchCursor = -1;
  if(!q){
    searchHits = [];
    $('#res').innerHTML = '<div class="res-grp"><span class="t-micro">Try</span></div>'
      + ['PAVOI','VN-A812','overdue','Tran Thi Mai','tooling'].map(s=>
        '<button class="res-i" type="button" data-act="seed" data-s="'+esc(s)+'"><span class="res-body">'
        + '<span class="strong">'+esc(s)+'</span><span class="t-small dim">example search</span></span>'
        + ic('arrowRight',16,'dim')+'</button>').join('');
    return;
  }
  const hits = INDEX.filter(x=>x.hay.includes(q));
  searchHits = [];
  let html = '';
  ['Report','Audit','Aircraft','Person'].forEach(kind=>{
    const g = hits.filter(h=>h.kind===kind).slice(0,6);
    if(!g.length) return;
    html += '<div class="res-grp"><span class="t-micro">'+kind+(hits.filter(h=>h.kind===kind).length>6?' · first 6':'')+'</span></div>';
    g.forEach(h=>{
      const i = searchHits.length; searchHits.push(h);
      html += '<button class="res-i" type="button" role="option" data-act="hit" data-i="'+i+'">'
        + '<span class="res-body"><span class="strong mono">'+hl(h.key,q)+'</span>'
        + '<span class="t-small dim od-truncate">'+esc(h.sub)+'</span></span>'
        + '<span class="tag">'+esc(h.meta)+'</span></button>';
    });
  });
  $('#res').innerHTML = html || '<div class="empty" style="padding:40px 24px"><h3>No match for “'+esc($('#q').value.trim())+'”</h3>'
    + '<p class="t-sub">Search covers report numbers, audit titles and numbers, aircraft registrations and people.</p></div>';
  moveCursor(0);
}
function moveCursor(d){
  const items = Array.from(document.querySelectorAll('.res-i[data-act="hit"]'));
  if(!items.length) return;
  searchCursor = Math.max(0, Math.min(items.length-1, searchCursor + d));
  items.forEach((el,i)=> el.classList.toggle('cursor', i === searchCursor));
  items[searchCursor].scrollIntoView({block:'nearest'});
}
function openHit(h){
  closeSearch();
  go(h.go.screen, h.go.tab, { id:h.go.id, q:h.go.q });
}

      + '<p class="t-sub">What changed against the current information architecture, and the reasoning for each move.</p></div>'

/* ---- one delegated handler for the whole document ---- */
function handle(el, e){
  const act = el.getAttribute('data-act');
  if(act && BETA_ACT[act]){ BETA_ACT[act](el, e); return true; }
  if(act){
    if(act === 'sort'){
      const k = el.dataset.key, c = el.dataset.col, cur = state.sort[k];
      state.sort[k] = (cur && cur.k === c && cur.dir === 'asc') ? {k:c, dir:'desc'} : {k:c, dir:'asc'};
      state.page[k] = 1; render(); return true;
    }
    if(act === 'page'){ state.page[el.dataset.key] = Number(el.dataset.p); render(); return true; }
    if(act === 'selpavoi'){ state.sel.pavoi = el.dataset.id; render(); return true; }
    if(act === 'clearone'){
      const k = el.dataset.k;
      if(k === 'years')  state.filters.years  = [TODAY.getFullYear()];
      if(k === 'months') state.filters.months = [];
      if(k === 'dept')  state.filters.dept = '';
      if(k === 'q')     state.rowQuery = '';
      state.page = {}; render(); return true;
    }
    if(act === 'clearall'){
      state.filters = defaultFilters(); state.rowQuery = ''; state.cat = ''; state.page = {}; render(); return true;
    }
    if(act === 'clearcat'){ state.cat = ''; state.page = {}; render(); return true; }
    if(act === 'toast'){ toast(el.dataset.t, el.dataset.b); return true; }
    if(act === 'drawer'){ openDrawer(); return true; }
    if(act === 'seed'){ $('#q').value = el.dataset.s; runSearch(); $('#q').focus(); return true; }
    if(act === 'hit'){ openHit(searchHits[Number(el.dataset.i)]); return true; }
  }
  const screen = el.getAttribute('data-go');
  if(screen){
    closeDrawer();
    if(el.dataset.cat !== undefined) state.cat = el.dataset.cat; else state.cat = '';
    state.page = {};
    go(screen, el.dataset.tab || null, {
      id: el.dataset.id || null,
      q:  el.dataset.q  !== undefined ? el.dataset.q  : undefined
    });
    return true;
  }
  return false;
}

/* keep the popover inside the viewport: on a phone the Month field sits in the
   right-hand column, so a left-anchored panel would run off the screen edge */
function placePop(pop){
  pop.style.left = '0px';
  const r = pop.getBoundingClientRect(), gap = 12, vw = document.documentElement.clientWidth;
  let shift = 0;
  if(r.right > vw - gap) shift = (vw - gap) - r.right;
  if(r.left + shift < gap) shift = gap - r.left;
  pop.style.left = shift + 'px';
}
function periodChanged(){ state.page = {}; render(); }

document.addEventListener('click', e=>{
  const mb = e.target.closest('.msel-b');
  if(mb){
    const m = mb.closest('.msel'), pop = m.querySelector('.msel-pop'), willOpen = pop.hidden;
    closePickers(m);
    pop.hidden = !willOpen;
    mb.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    if(willOpen) placePop(pop);
    if(willOpen){ const first = pop.querySelector('input,button'); if(first) first.focus(); }
    return;
  }
  const qb = e.target.closest('[data-msel-q]');
  if(qb){
    const q = Number(qb.dataset.mselQ), trio = [q*3, q*3+1, q*3+2], ms = state.filters.months;
    const full = trio.every(k=>ms.includes(k));
    state.filters.months = full ? ms.filter(k=>!trio.includes(k)) : [...new Set([...ms, ...trio])];
    periodChanged(); return;
  }
  const all = e.target.closest('[data-msel-all]');
  if(all){
    if(all.dataset.mselAll === 'year') state.filters.years = []; else state.filters.months = [];
    periodChanged(); return;
  }
  if(!e.target.closest('.msel')) closePickers();
  const el = e.target.closest('[data-act],[data-go]');
  if(el && handle(el, e)) e.preventDefault();
});
document.addEventListener('keydown', e=>{
  /* rows and timeline bars are focusable; Enter and Space activate them */
  if((e.key === 'Enter' || e.key === ' ') && document.activeElement){
    const el = document.activeElement.closest && document.activeElement.closest('[data-act],[data-go]');
    if(el && el.tagName !== 'BUTTON' && el.tabIndex === 0){ if(handle(el, e)) e.preventDefault(); return; }
  }
  const searchOpen = !$('#searchSheet').hidden;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); searchOpen ? closeSearch() : openSearch(); return; }
  if(e.key === 'Escape' && openPicker()){
    const b = openPicker(); closePickers(); b.focus(); return;
  }
  if(e.key === 'Escape'){
    if(searchOpen) closeSearch();
    else if(!$('#drawer').hidden) closeDrawer();
    return;
  }
  if(searchOpen){
    if(e.key === 'ArrowDown'){ e.preventDefault(); moveCursor(1); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); moveCursor(-1); }
    else if(e.key === 'Enter' && searchHits[searchCursor]){ e.preventDefault(); openHit(searchHits[searchCursor]); }
  }
});

/* ==========================================================================
   BETA · SCREENS ON THE MAIN DASHBOARD'S OWN LOADERS
   Every number below comes from a function or store of index.html, reached through
   window.BETA_API (see the loader). Nothing is re-derived here except layout: where a
   main-dashboard function mixes its calculation with DOM writes, the calculation is
   repeated line for line and the source line range is cited next to it.
   ========================================================================== */
const API = () => window.BETA_API;
const BS = { pg:{}, ataLevel:'2', ataY:TODAY.getFullYear(), ataM:TODAY.getMonth()+1, k2g:'nature',
             rsTab:'f088', rsSF:'all', rsQ:'', osrForm:'', osrSF:'all', osrOu:'', afForm:'',
             docType:null, docSt:'', docRev:'', docQ:'', usersF:'all', fbMsg:'' };
const LAZY = {};
function betaResetLazy(){ Object.keys(LAZY).forEach(k => delete LAZY[k]); }
const IS_ADMIN = () => !!(REAL && REAL.user && REAL.user.role === 'admin');

/* Run a main-dashboard loader once; re-render the screen when it settles. The main loaders
   swallow their own errors (toast + flag stays false), so "settled but not ready" is an error
   too, and it is reported with the loader's own last error toast. */
function lazy(key, run, ready){
  if(ready()) return 'ready';
  const L = LAZY[key];
  if(L && L.err) return 'error';
  if(L) return 'loading';
  const here = location.hash;
  LAZY[key] = {};
  Promise.resolve().then(run).then(v => {
    LAZY[key].value = v;
    if(!ready()){
      const t = API().toasts().filter(x => x.kind === 'err').pop();
      LAZY[key].err = t ? t.m : 'The loader finished without data.';
    }
  }).catch(e => { LAZY[key].err = e && e.message ? e.message : String(e); })
    .then(() => { if(location.hash === here) render(); });
  return 'loading';
}
function lazyState(key, run, ready, what){
  const st = lazy(key, run, ready);
  if(st === 'ready') return null;
  if(st === 'error') return cardMsg('Could not load '+what, LAZY[key].err, key);
  return cardMsg('Loading '+what+'…', 'Fetching from Galileo through the main dashboard\'s own loader.', null, true);
}
function cardMsg(title, body, retryKey, spin){
  return '<section class="sec"><div class="card"><div class="empty">'
    + (spin ? '<div class="beta-boot-spin" aria-hidden="true"></div>' : ic('layers',28,'dim'))
    + '<h3>'+esc(title)+'</h3><p class="t-sub">'+esc(body || '')+'</p>'
    + (retryKey ? '<button class="btn" type="button" data-act="bretry" data-k="'+esc(retryKey)+'">Retry</button>' : '')
    + '</div></div></section>';
}

/* A plain table: cols = [{l, ar?}], rows = arrays of cell HTML. Paged like the design's lanes. */
function plainTable(key, cols, rows, size, minW){
  size = size || 25;
  if(!rows.length) return '<div class="empty"><h3>No records</h3><p class="t-sub">Nothing matches the current filters.</p></div>';
  const pages = Math.max(1, Math.ceil(rows.length/size));
  const p = Math.min(BS.pg[key] || 1, pages);
  const head = cols.map(c => '<th scope="col"'+(c.ar?' class="ar"':'')+'>'+esc(c.l)+'</th>').join('');
  const body = rows.slice((p-1)*size, p*size).map(r => '<tr>'+r.map((cell,i) =>
    '<td data-l="'+esc(cols[i].l)+'"'+(i===0?' class="t-main"':(cols[i].ar?' class="ar"':''))+'>'+cell+'</td>').join('')+'</tr>').join('');
  let pager = '';
  if(pages > 1){
    pager = '<div class="pg">'
      + '<button type="button" data-act="bpage" data-k="'+key+'" data-p="'+(p-1)+'"'+(p===1?' disabled':'')+' aria-label="Previous page">'+ic('chevron',14,'')+'</button>'
      + '<button type="button" disabled>'+p+' / '+pages+'</button>'
      + '<button type="button" data-act="bpage" data-k="'+key+'" data-p="'+(p+1)+'"'+(p===pages?' disabled':'')+' aria-label="Next page">'+ic('chevron',14,'')+'</button></div>';
  }
  /* many columns: keep a readable minimum and scroll inside the card (phones reflow to cards) */
  return '<div class="tbl-wrap"><table class="tbl'+(minW ? ' beta-minw' : '')+'"'+(minW ? ' style="--beta-minw:'+minW+'px"' : '')+'><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>'
    + '<div class="tbl-foot"><span class="t-small dim">Showing '+((p-1)*size+1)+'–'+Math.min(p*size, rows.length)+' of '+rows.length+'</span>'+pager+'</div>';
}
function barList(items, hotKey){
  const max = Math.max(1, ...items.map(x => x.n));
  return '<div class="bars">' + items.map(x =>
    '<div class="bar-row" style="cursor:default"><span class="od-truncate t-small">'+esc(x.k)+'</span>'
    + '<span class="bar-track"><span class="bar-fill'+(x.k===hotKey?' hot':'')+'" style="width:'+(x.n/max*100)+'%"></span></span>'
    + '<span class="num strong od-nowrap">'+x.n+(x.sub?' <span class="dim t-small">'+esc(x.sub)+'</span>':'')+'</span></div>').join('') + '</div>';
}
/* main-dashboard date text: UTC date part (the fd() rule — T17:00Z is Vietnam midnight) */
function fdx(v){
  if(!v) return '—';
  const s = String(v); const d = /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0,10) : '';
  if(!d) return esc(s);
  return fmtDate(new Date(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10)));
}
/* The global Year × Month filter, applied to a raw date string (raised_date) */
function inPeriod(v){
  const f = state.filters;
  if(!f.years.length && !f.months.length) return true;
  if(!v) return false;
  /* local calendar, like raised_year = new Date(raised_date).getFullYear() in loadData */
  const d = new Date(v); if(isNaN(d)) return false;
  const y = d.getFullYear(), m = d.getMonth();
  if(f.years.length && !f.years.includes(y)) return false;
  if(f.months.length && !f.months.includes(m)) return false;
  return true;
}
const statusChip = s => chip(s || '—');
/* Second pass not finished (or failed): screens that need CMR-CAR / ECAR / KPI 7 say so
   instead of showing zeros — "not loaded is not zero" (index.html 6272–6277). */
function partialMsg(what){
  return REAL.partialError
    ? cardMsg(what+' could not be loaded', REAL.partialError+' Reload the page to retry.')
    : cardMsg('Loading '+what+'…', 'The rest of the dashboard is ready; this part is still coming from Galileo.', null, true);
}

   ANALYTICS · KPI CHARTS  (index.html page-kpi)
   ========================================================================== */
function scrKpi(){
  const A = API();
  const data = A.allData().filter(r => inPeriod(r.raised_date));
  /* buildKPICharts, index.html 4754–4768 */
  const CLOSED_S = ['On-time Closed','Lately Closed'];
  const tot = data.length;
  const open = data.filter(r => r.semantic_status === 'Open').length;
  const over = data.filter(r => r.semantic_status === 'Overdue').length;
  const onTime = data.filter(r => r.semantic_status === 'On-time Closed').length;
  const closed = data.filter(r => CLOSED_S.includes(r.semantic_status)).length;
  const cat3 = data.filter(r => r.overdue_cat === 'CAT III').length;
  const audits = new Set(data.map(r => r.audit_id).filter(Boolean)).size;
  let html = tiles([
    stat('Total records', String(tot), periodLabel()),
    stat('Open', String(open), 'semantic status Open'),
    stat('Overdue', String(over), 'past target date', over > 0),
    stat('On-time rate', closed > 0 ? Math.round(onTime/closed*100)+'%' : '—', onTime+' of '+closed+' closed'),
    stat('CAT III', String(cat3), 'overdue > 60 days', cat3 > 0),
    stat('Audits', String(audits), 'distinct audits behind these records')
  ]);

  /* KPI 2 volume card, buildKPI2 5227–5277 (kpi2Rows = MCAR + AMO ECAR of allData) */
  const k2 = lazyState('kpi2', () => A.loadKpi2(), () => A.kpi2().loaded, 'KPI 2 data');
  let k2body;
  if(k2) k2body = '<p class="t-sub dim">Loading Nature of finding…</p>';
  else {
    const rows = A.kpi2().rows.filter(r => inPeriod(r.raised_date));
    const grp = {};
    rows.forEach(r => (r.natureGroups.length ? r.natureGroups : ['(none)']).forEach(g => {
      (grp[g] ||= { mcar:0, amo:0 })[r.type]++; }));
    const keys = Object.keys(grp).filter(g => g !== '(none)')
      .sort((a,b) => (grp[b].amo+grp[b].mcar) - (grp[a].amo+grp[a].mcar)).slice(0,12);
    const totM = rows.filter(r => r.type === 'mcar').length, totA = rows.filter(r => r.type === 'amo').length;
    k2body = '<div class="od-row" style="--od-gap:16px;align-items:baseline"><span class="kpi-val">'
      + (totA > 0 ? Math.round(totM/totA*100)+'%' : 'N/A') + '</span><span class="t-small dim">MCAR '+totM+' ÷ AMO-ECAR '+totA+'</span></div>'
      + plainTable('k2vol', [{l:'Nature group'},{l:'MCAR',ar:true},{l:'AMO-ECAR',ar:true},{l:'Rate',ar:true}],
          keys.map(g => ['<span class="t-small">'+esc(g)+'</span>', '<span class="num">'+grp[g].mcar+'</span>',
            '<span class="num">'+grp[g].amo+'</span>', '<span class="num strong">'+(grp[g].amo > 0 ? Math.round(grp[g].mcar/grp[g].amo*100)+'%' : '—')+'</span>']), 12);
  }

  /* KPI 7 by section, kpi7Stats 6191 + renderKpi7 6267 (rate withheld while any row is pending) */
  if(REAL.partial) return html + '<section class="sec cols cols-2">'
    + card('KPI 2 · MCAR ÷ AMO-ECAR', 'volume ratio by Nature of finding · '+esc(periodLabel()), k2body) + '</section>'
    + partialMsg('KPI 7 and the ATA comparison');
  const st = A.kpi7Stats(r => inPeriod(r.raised_date));
  const rowRate = r => (r.total && !r.pending) ? A.kpi7Rate(r) : null;
  const k7rows = st.order.map(k => st.rows[k]).map(r => [
    '<span class="t-small">'+esc(r.key === '__unassigned__' ? 'Unassigned owner' : r.key)+'</span>',
    '<span class="num">'+r.assessed+'</span>', '<span class="num">'+r.notAssessed+'</span>',
    '<span class="num">'+r.closed+'</span>', '<span class="num">'+r.total+'</span>',
    '<span class="num strong">'+A.kpi7Fmt(rowRate(r))+'</span>']);
  k7rows.push(['<span class="strong">TOTAL — MQA</span>', '<span class="num strong">'+st.tot.assessed+'</span>',
    '<span class="num strong">'+st.tot.notAssessed+'</span>', '<span class="num strong">'+st.tot.closed+'</span>',
    '<span class="num strong">'+st.tot.total+'</span>', '<span class="num strong">'+A.kpi7Fmt(rowRate(st.tot))+'</span>']);
  const lags = st.tot.lags.slice().sort((a,b) => a-b);
  const k7note = st.tot.total ? st.tot.assessed+' / '+st.tot.total+' assessed · '+st.tot.notAssessed+' with no verification round'
    + (lags.length ? ' · median '+lags[Math.floor(lags.length/2)]+'d to first verification' : '')
    + (st.tot.withdrawn ? ' · '+st.tot.withdrawn+' withdrawn excluded' : '') : 'no PAVOI in this period';

  html += '<section class="sec cols cols-2">'
    + card('KPI 2 · MCAR ÷ AMO-ECAR', 'volume ratio by Nature of finding · '+esc(periodLabel()), k2body)
    + card('KPI 7 · PAVOI assessed', esc(k7note),
        plainTable('k7', [{l:'Section'},{l:'Assessed',ar:true},{l:'No verif.',ar:true},{l:'Closed',ar:true},{l:'Total',ar:true},{l:'KPI %',ar:true}], k7rows, 10))
    + '</section>';
  html += '<section class="sec">'+scrAta()+'</section>';
  return html;
}

/* KPI QC — ATA comparison, renderATACompare 4839–4978 */
function scrAta(){
  const A = API();
  const q = lazyState('qcs', () => A.loadQcs(), () => A.qcs().loaded, 'QC Spot Check findings');
  const years = [...new Set(A.cmrData().concat(A.ecarData()).map(r => r.raised_year).filter(Boolean).concat([TODAY.getFullYear()]))].sort((a,b)=>b-a);
  const ctl = '<div class="od-row" style="--od-gap:12px;flex-wrap:wrap">'
    + sel('ataLevel', [['2','ATA 2-digit'],['4','ATA 4-digit'],['6','ATA 6-digit']], BS.ataLevel, 'Level')
    + sel('ataY', years.map(y => [y, y]), BS.ataY, 'Year')
    + sel('ataM', MONTHS_SHORT.map((m,i) => [i+1, m]), BS.ataM, 'Month') + '</div>';
  if(q) return card('KPI QC · ATA comparison', 'internal findings (month N−1) ÷ ECAR (month N)', ctl + '<p class="t-sub dim">Loading QC Spot Check / QC PI findings…</p>');
  const Y = +BS.ataY, M = +BS.ataM, level = +BS.ataLevel, pad = n => String(n).padStart(2,'0');
  const denYM = Y+'-'+pad(M), numYM = M === 1 ? (Y-1)+'-12' : Y+'-'+pad(M-1);
  const ymOf = d => String(d || '').slice(0,7);
  const cmrQcRep = A.cmrData().filter(r => ymOf(r.raised_date) === numYM && r.category_id === A.QC_CAT_UUID);
  const ecarRep = A.ecarData().filter(r => ymOf(r.raised_date) === denYM);
  const num = {}, den = {};
  const add = (m, raw) => { const a = A.normalizeATA(raw, level); m[a] = (m[a] || 0) + 1; };
  cmrQcRep.forEach(r => (r.findingRows && r.findingRows.length) ? r.findingRows.forEach(fr => add(num, fr.ata || r.ata_chapter)) : add(num, r.ata_chapter));
  A.qcsFindingList().filter(f => f.title === A.QCPI_TITLE && f.ym === numYM).forEach(f => add(num, f.ata));
  ecarRep.forEach(r => (r.findingRows && r.findingRows.length) ? r.findingRows.forEach(fr => add(den, fr.ata || r.ata_chapter)) : add(den, r.ata_chapter));
  const keys = [...new Set(Object.keys(num).concat(Object.keys(den)))].filter(k => k !== 'Other')
    .sort((a,b) => ((num[b]||0)+(den[b]||0)) - ((num[a]||0)+(den[a]||0)));
  /* cell(), 4925 — headline and TOTAL row come from the same call (rule 11) */
  const cell = (n, d) => d > 0 ? { ratio:(n/d).toFixed(2), a: n >= d ? 'Effective' : n > 0 ? 'Under' : 'Missed' }
                               : { ratio: n > 0 ? '∞' : '0', a: n > 0 ? 'Over-detect' : 'no data' };
  const totN = keys.reduce((s,k) => s + (num[k]||0), 0), totD = keys.reduce((s,k) => s + (den[k]||0), 0);
  const tc = cell(totN, totD);
  const lab = k => level === 2 && A.ATA_LABELS[k] ? k+' · '+A.ATA_LABELS[k] : k;
  const rows = [['<span class="strong">TOTAL</span>', '<span class="num strong">'+totN+'</span>', '<span class="num strong">'+totD+'</span>',
                 '<span class="num strong">'+tc.ratio+'</span>', '<span class="tag">'+esc(tc.a)+'</span>']]
    .concat(keys.map(k => { const c = cell(num[k]||0, den[k]||0);
      return ['<span class="t-small">'+esc(lab(k))+'</span>', '<span class="num">'+(num[k]||0)+'</span>', '<span class="num">'+(den[k]||0)+'</span>',
              '<span class="num">'+c.ratio+'</span>', '<span class="tag">'+esc(c.a)+'</span>']; }));
  if((num.Other||0) + (den.Other||0) > 0)
    rows.push(['<span class="dim t-small">No-ATA / non-numeric</span>', '<span class="num dim">'+(num.Other||0)+'</span>', '<span class="num dim">'+(den.Other||0)+'</span>', '<span class="dim">—</span>', '<span class="dim">N/A</span>']);
  return card('KPI QC · ATA comparison', 'Internal '+totN+' ÷ ECAR '+totD+' = <span class="strong">'+tc.ratio+'</span> · '+numYM+' ÷ '+denYM
      + ' · sources: CMR-CAR QC '+cmrQcRep.length+', ECAR '+ecarRep.length,
    ctl + plainTable('ata', [{l:'ATA chapter'},{l:'Internal (N−1)',ar:true},{l:'ECAR (N)',ar:true},{l:'Ratio',ar:true},{l:'Assessment'}], rows, 15));
}

function scrEarly(){
  const A = API();

  const den = ecarRows.length, num = early.size;

  return tiles([
      stat('Early-detection rate', den > 0 ? Math.round(num/den*100)+'%' : 'N/A', 'AMO-ECAR already found by an earlier MCAR'),

              '<span class="num">'+groups[k].tot+'</span>', '<span class="num strong">'+Math.round(groups[k].m/groups[k].tot*100)+'%</span>']))) + '</section>';
}

/* ==========================================================================
   ANALYTICS · SPI  (loadSPI 11467, spiEvaluate 11523, renderSPIPage 11570)
   ========================================================================== */
function spiChart(spi){
  const W = 320, H = 120, L = 28, R = 8, T = 10, B = 20;
  const rates = spi.months.map(m => m.rate), spt = spi.sptApproved;
  const vals = rates.filter(v => v != null).concat(spt != null ? [spt] : []);
  const max = Math.max(1, ...vals) * 1.15, iw = W-L-R, ih = H-T-B;
  const x = i => L + i/11*iw, y = v => T + ih - (v/max)*ih;
  let path = '', pts = '';
  rates.forEach((v,i) => {
    if(v == null) return;
    path += (path && rates[i-1] != null ? ' L ' : ' M ') + x(i).toFixed(1)+' '+y(v).toFixed(1);
    /* drawSPIChart 11633–11637: red when worse than SPT for the direction */
    const ok = spt == null ? true : spi.direction === 'higher' ? v >= spt : v <= spt;
    pts += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="3" fill="'+(ok ? 'var(--text-2)' : 'var(--accent)')+'"><title>Month '+(i+1)+': '+v+'</title></circle>';
  });
  const sptLine = spt != null ? '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(spt).toFixed(1)+'" y2="'+y(spt).toFixed(1)+'" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="4 3"/>' : '';
  const xl = [0,3,6,9,11].map(i => '<text x="'+x(i).toFixed(1)+'" y="'+(H-5)+'" font-size="10" text-anchor="middle" fill="var(--text-3)" font-family="ui-monospace,monospace">'+(i+1)+'</text>').join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Monthly SPI rate against the CAAV-approved SPT">'
    + '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ih)+'" y2="'+(T+ih)+'" stroke="var(--hairline)"/>' + sptLine
    + '<path d="'+path+'" fill="none" stroke="var(--text-2)" stroke-width="1.8"/>' + pts + xl + '</svg>';
}
function scrSpi(){
  const A = API();
  const w = lazyState('spi', () => A.loadSPI(), () => !!(LAZY.spi && LAZY.spi.value), 'SPI forms');
  if(w) return w;
  const all = LAZY.spi.value || [];
  const f = state.filters;
  const list = all.filter(s => !f.years.length || f.years.includes(s.raised_year));
  if(!list.length) return cardMsg('No SPI forms in the selected years', all.length ? all.length+' SPI forms exist in other years — widen the Year filter.' : 'No AMO - SPI report was found.');
  const ev = list.map(A.spiEvaluate);
  const tracking = list.filter(s => s.months.some(m => m.rate != null)).length;
  const cOn = ev.filter(e => e.status !== 'na' && e.currentLevel === 0).length;
  const c1 = ev.filter(e => e.currentLevel === 1).length, c2 = ev.filter(e => e.currentLevel === 2).length, c3 = ev.filter(e => e.currentLevel >= 3).length;
  const h1 = ev.reduce((s,e) => s+e.hist.l1, 0), h2 = ev.reduce((s,e) => s+e.hist.l2, 0), h3 = ev.reduce((s,e) => s+e.hist.l3, 0);
  const cards = list.map((spi, i) => {
    const e = ev[i];
    const badge = e.status === 'na' ? '<span class="tag">No data</span>'
      : e.currentLevel >= 1 ? '<span class="cat c'+Math.min(3, e.currentLevel)+'">Trigger level '+Math.min(3, e.currentLevel)+'</span>'
      : '<span class="chip s-ontime">'+mark('On-time Closed')+'On target</span>';
    return '<div class="card"><div class="card-head"><h2 class="od-truncate">'+esc(spi.title || spi.number)+'</h2>'+badge+'</div>'
      + '<div class="card-pad" style="display:grid;gap:8px"><span class="t-small dim">'+esc(spi.number)
      + ' · SPT (CAAV) '+esc(spi.sptApproved ?? '—')+' · previous year '+esc(spi.prevYear ?? '—')+' · '+(spi.direction === 'higher' ? 'higher' : 'lower')+' is better</span>'
      + spiChart(spi) + (spi.remark ? '<span class="t-small">'+esc(spi.remark)+'</span>' : '') + '</div></div>';
  }).join('');
  return tiles([
      stat('Total SPIs', String(list.length), 'all indicators'),
      stat('Tracking', String(tracking), 'with monthly data'),
      stat('Current trigger', 'L1 '+c1+' · L2 '+c2+' · L3 '+c3, cOn+' on target · latest month', c1+c2+c3 > 0, true),
      stat('Trigger history', 'L1 '+h1+' · L2 '+h2+' · L3 '+h3, 'episodes in the year', false, true)
    ]) + '<section class="sec beta-cards">'+cards+'</section>';
}

/* ==========================================================================
   AUDIT PLAN · BOTTLENECK  (loadStageAggregate 7715, renderBottleneckPanel 7754)
   ========================================================================== */
function scrBottleneck(){
  const A = API();
  const w = lazyState('stages', () => A.loadStages(), () => !!A.stages(), 'audit workflow stages');
  if(w) return w;
  const agg = A.stages();
  const list = Object.entries(agg).filter(([,v]) => v.total > 0)
    .sort((a,b) => (b[1].inprogress + b[1].pendingSignOff) - (a[1].inprogress + a[1].pendingSignOff)).slice(0,12);
  const maxT = Math.max(1, ...list.map(([,v]) => v.total));
  const sumT = Object.values(agg).reduce((s,v) => s + v.total, 0);
  const rows = list.map(([k,v]) => {
    const p = x => v.total ? x / v.total * 100 : 0;
    const other = Math.max(0, 100 - p(v.completed) - p(v.inprogress) - p(v.notStarted));
    return '<div class="bar-row" style="cursor:default;grid-template-columns:minmax(140px,1.2fr) minmax(0,2fr) auto">'
      + '<span class="t-small od-truncate">'+esc(k)+'</span>'
      + '<span class="stack" style="width:'+(v.total/maxT*100)+'%" title="completed '+v.completed+' · in progress '+v.inprogress+' · not started '+v.notStarted+'">'
      + '<span style="width:'+p(v.completed)+'%;background:var(--text-3)"></span><span style="width:'+p(v.inprogress)+'%;background:var(--accent)"></span>'
      + '<span style="width:'+p(v.notStarted)+'%;background:var(--accent-28)"></span><span style="width:'+other+'%;background:var(--hairline)"></span></span>'
      + '<span class="num od-nowrap"><span class="strong">'+v.total+'</span> <span class="t-small dim">'+(v.inprogress + v.pendingSignOff)+' active</span></span></div>';
  }).join('');
  return '<section class="sec">' + card('Bottleneck analysis', list.length+' stages · '+sumT.toLocaleString('en-US')+' stage records · system-wide aggregate, not filtered by the Audit Plan filters',
    '<div class="bars">'+rows+'</div><div class="legend">'
    + '<span class="legend-i"><span class="swatch" style="background:var(--text-3)"></span>Completed</span>'
    + '<span class="legend-i"><span class="swatch" style="background:var(--accent)"></span>In progress</span>'
    + '<span class="legend-i"><span class="swatch" style="background:var(--accent-28)"></span>Not started</span>'
    + '<span class="legend-i"><span class="swatch" style="background:var(--hairline)"></span>Other</span></div>') + '</section>';
}

function scrDocs(){
  const A = API();
  const w = lazyState('docs', () => A.loadDocs(), () => A.docs().data.length > 0, 'controlled documents');
  if(w) return w;
  const D = A.docs();
  const branch = A.getDocsInBranch(BS.docType);
  const today = new Date();
  const q = BS.docQ.trim().toLowerCase();
  const rows = branch.filter(d => !q || (d.document_number+' '+d.document_revision_title+' '+d.owner_name).toLowerCase().includes(q))
    .filter(d => !BS.docSt || d.document_revision_status === BS.docSt)
    .filter(d => !BS.docRev || A.reviewDueCategory(d.review_date, today) === BS.docRev);
  const rev = c => branch.filter(d => A.reviewDueCategory(d.review_date, today) === c).length;
  /* type tree: roots in the main dashboard's order, children of the selected node */
  const node = BS.docType ? D.index[BS.docType] : null;
  const kids = (node ? node.children : D.tree).filter(n => n.doc_count > 0);
  const crumbs = [];
  for(let n = node; n; n = n.parent_id ? D.index[n.parent_id] : null) crumbs.unshift(n);
  const tree = '<div class="od-row t-small" style="--od-gap:6px;flex-wrap:wrap">'
    + '<button class="link-b" type="button" data-act="bset" data-k="docType" data-v="">All documents</button>'
    + crumbs.map(n => ' › <button class="link-b" type="button" data-act="bset" data-k="docType" data-v="'+esc(n.type_id)+'">'+esc(n.title)+'</button>').join('') + '</div>'
    + (kids.length ? '<div class="bars">' + kids.slice(0,40).map(n =>
        '<button class="bar-row" type="button" data-act="bset" data-k="docType" data-v="'+esc(n.type_id)+'">'
        + '<span class="od-truncate t-small">'+esc(n.title)+'</span>'
        + '<span class="bar-track"><span class="bar-fill" style="width:'+(n.doc_count/Math.max(1, ...kids.map(n => n.doc_count))*100)+'%"></span></span>'
        + '<span class="num strong od-nowrap">'+n.doc_count+'</span></button>').join('') + '</div>'
      : '<p class="t-small dim">No sub-types.</p>');
  return tiles([
      stat('Documents', String(branch.length), node ? node.title : 'all types'),
      stat('Active', String(branch.filter(d => d.document_revision_status === 'Active').length), 'current revision'),
      stat('Distributed', String(branch.filter(d => d.has_been_distributed).length), 'sent to copyholders'),
      stat('Review overdue', String(rev('overdue')), 'review date passed', rev('overdue') > 0),
      stat('Review ≤ 30 days', String(rev('30d')), 'due soon'),
      stat('Owners', String(new Set(branch.map(d => d.owner_name).filter(Boolean)).size), 'distinct owners')
    ])
    + '<section class="sec cols cols-2 beta-docs">'
    + card('Document types', 'by type_id — titles can be edited by admins', tree)
    + card('Register', rows.length+' documents',
        '<div class="od-row" style="--od-gap:12px;flex-wrap:wrap">' + searchBox('docQ', BS.docQ, 'Number, title or owner')
        + sel('docSt', [['','All statuses'],['Active','Active'],['Obsolete','Obsolete']], BS.docSt)
        + sel('docRev', [['','Any review date'],['overdue','Review overdue'],['30d','Due ≤ 30 days'],['90d','Due ≤ 90 days'],['ok','OK']], BS.docRev) + '</div>'
        + plainTable('docs', [{l:'Document'},{l:'Type'},{l:'Rev',ar:true},{l:'Status'},{l:'Owner'},{l:'Review date'},{l:'Distributed'}],
            rows.map(d => {
              const t = D.index[d.type_id];
              const rc = A.reviewDueCategory(d.review_date, today);
              return ['<span class="row-main"><span class="row-id">'+esc(d.document_number)+'</span><span class="row-sub od-clamp-2">'+esc(d.document_revision_title)+'</span></span>',
                '<span class="t-small">'+esc(t ? A.lastTwoLevels(t.path || t.title) : (d.document_type || '—'))+'</span>',
                '<span class="num">'+esc(d.revision_number ?? '—')+'</span>',
                d.document_revision_status === 'Active' ? '<span class="tag">Active</span>' : '<span class="dim">'+esc(d.document_revision_status || '—')+'</span>',
                '<span class="t-small">'+esc(d.owner_name || '—')+'</span>',
                '<span class="num">'+fdx(d.review_date)+'</span>'+(rc === 'overdue' ? ' <span class="cat c3">overdue</span>' : rc === '30d' ? ' <span class="cat c1">≤30d</span>' : ''),
                d.has_been_distributed ? 'Yes' : '<span class="dim">—</span>'];
            }), 25, 860))
    + '</section>';
}

async function userAction(el){
  if(!IS_ADMIN() || !window.BETA_SB) return;
  const sb = window.BETA_SB, id = el.dataset.id, a = el.dataset.a;
  try{
    if(a === 'approve' || a === 'reject'){
      const { error } = await sb.from('users').update({ role: a === 'approve' ? 'approved' : 'rejected' }).eq('id', id); if(error) throw error;
    } else if(a === 'admin'){
      if(!confirm('Grant admin rights to this user?')) return;
      const { error } = await sb.from('users').update({ role:'admin' }).eq('id', id); if(error) throw error;
    } else if(a === 'delete'){
      if(!confirm('Delete '+el.dataset.email+' permanently? The account is removed from Supabase Auth and the profile table.')) return;
      /* same Edge Function as the main dashboard (deleteUser 8943): service_role stays server-side */
      const { data, error } = await sb.functions.invoke('delete-user', { body:{ target_id:id } });
      if(error || (data && data.error)) throw new Error((data && data.error) || error.message);
    }
    Object.keys(LAZY).filter(k => k.startsWith('users:')).forEach(k => delete LAZY[k]);
    toast('User updated', 'Change saved.'); render();
  }catch(e){ toast('Could not update user', e.message || String(e)); }
}

function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error('could not load the Excel library'));
    document.head.appendChild(s);
  });
}
async function doExport(){
  if(!IS_ADMIN()) return toast('Only admins can export', '');
  try{
    const XLSX = await loadXlsx();
    const rows = scoped().filter(r => !BS.afForm || r.code === BS.afForm);
    const d = v => v ? fmtDate(v) : '';
    const cnt = s => rows.filter(r => r.status === s).length;
    const kpi = [['Metric','Value'],['Total',rows.length],['Open',cnt('Open')],['Overdue',cnt('Overdue')],['On-time Closed',cnt('On-time Closed')],
      ['Lately Closed',cnt('Lately Closed')],['Closed (no target)',cnt('Closed')],['Repetitive',rows.filter(r => r.repetitive).length],
      ['CAT I',rows.filter(r => r.cat === 'I').length],['CAT II',rows.filter(r => r.cat === 'II').length],['CAT III',rows.filter(r => r.cat === 'III').length]];
    const forms = [...new Set(rows.map(r => r.code))].sort();
    const fs = [['Form','Open','Overdue','On-time','Lately','Closed','Total']].concat(forms.map(f => {
      const x = rows.filter(r => r.code === f), c = s => x.filter(r => r.status === s).length;
      return [f, c('Open'), c('Overdue'), c('On-time Closed'), c('Lately Closed'), c('Closed'), x.length]; }));
    const det = [['Report No','Form','Status','Raised','Target','Days to due','CAT','Finding level','Repetitive','Owner','Department','Audit']]
      .concat(rows.slice().sort((a,b) => a.code.localeCompare(b.code) || (a.raised||0) - (b.raised||0)).map(r =>
        [r.number, r.code, r.status, d(r.raised), d(r.target), r.dtd ?? '', r.cat ? 'CAT '+r.cat : '', r.level, r.repetitive ? 'Yes' : 'No', r.owner, r.dept, r.auditTitle]));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(kpi), 'KPI Summary');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(fs), 'Form Summary');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(det), 'Detail Data');
    XLSX.writeFile(wb, 'QA_AMO_'+periodLabel().replace(/[^\w-]+/g,'_')+'_'+REAL.asOf+'.xlsx');
  }catch(e){ console.warn('[beta] export failed', e); toast('Export failed', e.message || String(e)); }
}

function scrMyDash(){
  if(!IS_ADMIN()) return adminOnly();
  let widgets = [];
  try{ widgets = JSON.parse(localStorage.getItem('db_widgets_' + (REAL.user && REAL.user.email)) || '[]'); }catch(e){ widgets = []; }
  if(!widgets.length) return cardMsg('No pinned widgets', 'Widgets pinned from the Query Builder in the main dashboard appear here. The Query Builder itself is not carried into the redesign.');
  const A = API();
  const cards = widgets.map(wd => {
    const key = 'w:'+wd.id;
    const st = lazy(key, async () => {
      const fl = (wd.filters || []).filter(f => f.field && f.value !== '').map(f => f.op === 'contains'
        ? 'contains('+f.field+",'"+String(f.value).replace(/'/g,"''")+"')"
        : f.field+' '+f.op+' '+(isNaN(f.value) ? "'"+String(f.value).replace(/'/g,"''")+"'" : f.value));
      let u = A.G_URL + wd.table + '?$select=' + encodeURIComponent((wd.fields || []).join(','));
      if(fl.length) u += '&$filter=' + encodeURIComponent(fl.join(' and '));
      if(wd.sortField) u += '&$orderby=' + encodeURIComponent(wd.sortField + ' ' + (wd.sortDir || 'asc'));
      u += '&$top=' + (wd.limit || 500);
      return A.fetchAll(u);
    }, () => !!(LAZY[key] && LAZY[key].value));
    let body;
    if(st === 'loading') body = '<p class="t-sub dim">Loading…</p>';
    else if(st === 'error') body = '<p class="t-sub red">'+esc(LAZY[key].err)+'</p>';
    else {
      const data = LAZY[key].value;
      if(wd.vizType === 'kpi') body = '<span class="kpi-val">'+data.length+'</span>';
      else if(wd.vizType === 'bar' || wd.vizType === 'pie'){
        const x = wd.chartX || (wd.fields || [])[0], y = wd.chartY, g = {};
        data.forEach(r => { const k = String(r[x] ?? '—'); g[k] = (g[k] || 0) + (y && y !== '__count__' ? (+r[y] || 0) : 1); });
        body = barList(Object.entries(g).sort((a,b) => b[1]-a[1]).slice(0,20).map(([k,n]) => ({ k, n:Math.round(n*100)/100 })));
      } else body = plainTable(key, (wd.fields || []).map(f => ({ l:f })), data.map(r => (wd.fields || []).map(f => '<span class="t-small">'+esc(r[f] ?? '—')+'</span>')), 10);
    }
    return card(wd.name || 'Widget', esc(wd.table)+' · '+esc(wd.vizType || 'table'), body);
  }).join('');
  return '<section class="sec beta-cards">'+cards+'</section>';
}

async function sendFeedback(){
  const ta = document.getElementById('betaFb'), msg = ta ? ta.value.trim() : '';
  if(!msg) return toast('Write a message first', '');
  if(!REAL.feedbackUrl || !window.BETA_SB) return toast('Feedback unavailable', 'Sign in on the main dashboard in this tab first.');
  try{
    const { data } = await window.BETA_SB.auth.getSession();
    const token = data && data.session && data.session.access_token;
    if(!token) throw new Error('session expired — sign in again');
    const r = await fetch(REAL.feedbackUrl, { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+token },
      body: JSON.stringify({ message: msg.slice(0,1500), name: REAL.user.full_name || '', role: REAL.user.role || '',
        page: 'beta · '+location.hash, rev: REAL.appRev + ' (beta)', ua: navigator.userAgent }) });
    if(!r.ok) throw new Error('HTTP '+r.status);
    BS.fbMsg = ''; if(ta) ta.value = '';
    toast('Feedback sent', 'Thank you — it reached the dashboard owner.');
  }catch(e){ toast('Could not send feedback', e.message || String(e)); }
}

  const k = e.target && e.target.getAttribute && e.target.getAttribute('data-bset');
  if(!k) return;
  BS[k] = e.target.value; BS.pg = {}; render();
});
document.addEventListener('input', e => {
  if(e.target && e.target.id === 'betaFb') BS.fbMsg = e.target.value;
});

/* BETA-SCREENS:END */

/* ==========================================================================
   BOOT
   ========================================================================== */
(function boot(){
  $('#railBtn').innerHTML = ic('rail',20);
  paintThemeBtn();
  $('#searchBtnIc').innerHTML = ic('search',18);
  $('#searchSheetIc').innerHTML = ic('search',18);
  $('#drawerClose').innerHTML = ic('x',20);
  $('#stamp').textContent = fmtDate(TODAY);
  if(REAL){
    const tag = document.querySelector('.demo-tag');
    if(tag){
      tag.textContent = 'Beta';
      tag.title = 'Live Galileo data via index.html '+REAL.appRev+(REAL.source === 'cache'
        ? ' · from the main dashboard cache, saved '+new Date(REAL.cacheTs).toLocaleString()
        : ' · loaded from Galileo '+new Date(REAL.generatedAt).toLocaleString());
    }
    /* the mock sidebar profile is an invented person — never show it next to real records */
    const un = document.querySelector('.user-name'), ur = document.querySelector('.user-role'), av = document.querySelector('.user .avatar');
    const nm = (REAL.user && (REAL.user.full_name || REAL.user.email)) || 'Signed in';
    if(un) un.textContent = nm;
    if(ur) ur.textContent = (REAL.user && REAL.user.role === 'admin' ? 'Admin' : 'Viewer')+' · '+REAL.appRev;
    if(av) av.textContent = nm.split(/\s+/).filter(Boolean).slice(-2).map(w=>w[0]).join('').toUpperCase() || '·';
    if(REAL.loadWarnings && REAL.loadWarnings.length)
      setTimeout(()=> toast('Some data did not load', REAL.loadWarnings.join(' · ')), 400);
  }

  $('#fDept').innerHTML = '<option value="">All departments</option>'
    + DEPTS.map(d=>'<option value="'+esc(d)+'">'+esc(d)+'</option>').join('');

  $('#themeBtn').addEventListener('click', ()=> setTheme(currentTheme() === 'light' ? 'dark' : 'light'));
  if(window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    const onOS = e=>{
      let saved = null;
      try{ saved = localStorage.getItem('qa-amo-theme'); }catch(err){}
      if(saved !== 'light' && saved !== 'dark'){
        document.documentElement.setAttribute('data-theme', e.matches ? 'light' : 'dark');
        paintThemeBtn();
      }
    };
    mq.addEventListener ? mq.addEventListener('change', onOS) : mq.addListener(onOS);
  }

  $('#railBtn').addEventListener('click', ()=>{ railPref = effRail() ? 'wide' : 'rail'; applyRail(); });
  window.addEventListener('resize', applyRail);
  applyRail();

  buildPeriodPicker();
  document.addEventListener('change', e=>{
    const c = e.target.closest && e.target.closest('input[data-msel]');
    if(!c) return;
    const key = c.dataset.msel === 'year' ? 'years' : 'months', v = Number(c.value);
    const cur = state.filters[key];
    state.filters[key] = c.checked ? [...new Set([...cur, v])] : cur.filter(x=>x !== v);
    periodChanged();
  });
  $('#fDept').addEventListener('change',  e=>{ state.filters.dept  = e.target.value; state.page = {}; render(); });

  $('#searchBtn').addEventListener('click', openSearch);
  $('#searchScrim').addEventListener('click', closeSearch);
  $('#drawerScrim').addEventListener('click', closeDrawer);
  $('#drawerClose').addEventListener('click', closeDrawer);
  $('#q').addEventListener('input', runSearch);

  state.cat = '';
  if(!location.hash) location.hash = '#/overview';
  route();
})();
</script>
</body>
</html>
